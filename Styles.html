<style>
/* Styles.html — OIS Team Wiki (Apps Script)
   Tokens copied from ois-toolhub assets/css/01-tokens.css; the wiki rules
   from assets/css/06-wiki.css. The frame at the bottom is this app's own. */
:root {
  /* ─── Light theme (default). Brand colours: Brand.gs → css ─── */
  --bg: #EEF2F4;
  --surface: #FFFFFF;
  --surface-hover: #F4F7F9;
  --surface-strong: #EEF2F4;
  --border: #DEE6E9;
  --border-bright: #C5CFD5;
  --text: #0D1421;
  --text-muted: #6F7A85;
  --text-faint: #C5CFD5;
  --mesh-1: rgba(0,5,121,0.07);
  --mesh-2: rgba(225,26,119,0.05);
  --mesh-3: rgba(54,153,241,0.06);
  --grid-dot: rgba(0,5,121,0.04);
  --modal-backdrop: rgba(13,20,33,0.42);
  --shadow-lg: 0 24px 64px rgba(0,2,57,0.18);

  --navy: #000579;
  --navy-dark: #000239;
  --accent: #4F46E5;        /* indigo */
  --accent-2: #4338CA;      /* gradient end */
  --on-accent: #fff;        /* text on accent */
  --accent-glow: rgba(79,70,229,0.16);
  --gradient-text: linear-gradient(135deg, #000579 0%, #E11A77 100%);

  /* Categorical accents */
  --cyan: #3699F1;
  --cyan-glow: rgba(54,153,241,0.16);
  --pink: #E11A77;
  --purple: #3D1B9F;
  --green: #06A77D;
  --blue: #000579;
  --amber: #D97706;

  --font-display: 'Instrument Serif', 'Times New Roman', serif;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', monospace;
}

[data-theme="dark"] {
  /* ─── Dark theme ─── */
  --bg: #0A1230;
  --surface: #131B40;
  --surface-hover: #1B2453;
  --surface-strong: #1B2453;
  --border: #2A3366;
  --border-bright: #3F4880;
  --text: #F0F3FA;
  --text-muted: #8990B5;
  --text-faint: #545C8E;
  --mesh-1: rgba(166,180,244,0.10);
  --mesh-2: rgba(246,153,191,0.07);
  --mesh-3: rgba(136,192,248,0.08);
  --grid-dot: rgba(166,180,244,0.04);
  --modal-backdrop: rgba(0,2,57,0.65);
  --shadow-lg: 0 24px 64px rgba(0,0,0,0.55);

  --navy: #A6B4F4;
  --navy-dark: #88C0F8;
  --accent: #A5B4FC;        /* indigo, dark-mode tint */
  --accent-2: #818CF8;
  --on-accent: #12102a;
  --accent-glow: rgba(165,180,252,0.20);
  --gradient-text: linear-gradient(135deg, #A6B4F4 0%, #F699BF 100%);

  --cyan: #88C0F8;
  --cyan-glow: rgba(136,192,248,0.20);
  --pink: #F699BF;
  --purple: #B59BE8;
  --green: #5FE0B0;
  --blue: #A6B4F4;
  --amber: #FBBF77;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  transition: background 0.4s ease, color 0.4s ease;
}

/* Ambient mesh background */

/* ─── OIS Process Guides — full embedded wiki (Confluence-style) ────── */
.wgt-shell {
  position: relative; /* anchors the insert dialog + symbol palette */
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(0,2,57,0.04);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 200px);
  min-height: 560px;
}
.wgt-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-strong);
  flex-wrap: wrap;
}
.wgt-toolbar .wgt-search { flex: 1; min-width: 140px; max-width: 260px; }
.wgt-toolbar .wgt-search input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font-size: 12.5px;
}
.wgt-spacer { flex: 1; }
.wgt-btn {
  padding: 6px 11px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}
.wgt-btn:hover { border-color: var(--accent); color: var(--accent); }
.wgt-btn.wgt-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.wgt-btn.wgt-primary:hover { opacity: .9; color: #fff; }
.wgt-btn:disabled { opacity: .45; cursor: not-allowed; }
.wgt-badge {
  display: inline-block; min-width: 15px; padding: 0 5px; margin-left: 5px;
  border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; line-height: 15px; text-align: center;
}
.wgt-main { flex: 1 1 auto; display: flex; min-height: 0; }
.wgt-sidebar { width: 232px; flex: 0 0 auto; border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 8px 14px; background: var(--surface-strong); }
.wgt-sidebar::-webkit-scrollbar { width: 8px; }
.wgt-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
.wgt-sidebar::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
.wgt-empty-hint { padding: 14px 12px; color: var(--text-muted); font-size: 12.5px; line-height: 1.5; }
.wgt-space-title { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: none; padding: 6px 8px 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; font-family: inherit; cursor: pointer; }
.wgt-space-title::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.wgt-space-title .wgt-space-count { margin-left: auto; font-weight: 600; letter-spacing: 0; opacity: .75; }
.wgt-space-title:hover { color: var(--accent); }
.wgt-space-title.active { color: var(--accent); }
.wgt-page-link { position: relative; display: flex; align-items: flex-start; gap: 7px; padding: 8px 10px 8px 8px; margin-bottom: 2px; border-radius: 7px; color: var(--text-muted); text-decoration: none; font-size: 12.5px; line-height: 1.45; transition: background .12s ease, color .12s ease; }
.wgt-page-link-text { flex: 1 1 auto; word-break: break-word; overflow-wrap: anywhere; hyphens: auto; }
.wgt-page-link::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 0; border-radius: 3px; background: var(--accent); transition: height .15s ease; }
.wgt-page-link:hover { background: var(--surface-hover); color: var(--text); }
.wgt-page-link:hover::before { height: 40%; }
.wgt-page-link.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
.wgt-page-link.active::before { height: 62%; }
/* Drag handle — six dots, revealed on hover */
.wgt-drag-dots { flex: 0 0 auto; width: 9px; height: 15px; margin-top: 2px; cursor: grab; opacity: 0; transition: opacity .12s ease; background-image: radial-gradient(currentColor 1px, transparent 1.3px); background-size: 4px 4px; background-position: 0 2px; color: var(--text-faint); }
.wgt-page-link:hover .wgt-drag-dots, .wgt-page-link.active .wgt-drag-dots { opacity: .75; }
.wgt-no-drag .wgt-drag-dots { display: none; }
.wgt-drag-ghost { opacity: .45; background: var(--accent-glow) !important; }
.wgt-drag-chosen { cursor: grabbing; }
.wgt-drag-active { background: var(--surface) !important; border: 1px solid var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,.16); }
.wgt-dragging .wgt-drag-dots { opacity: .75; }
.wgt-content { flex: 1 1 auto; overflow-y: auto; padding: 20px 26px; }
.wgt-page-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 4px; }
.wgt-page-header h2 { font-size: 19px; margin: 0; color: var(--text); }
.wgt-page-meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
.wgt-page-actions { display: flex; gap: 6px; flex: 0 0 auto; }
.wgt-view { line-height: 1.65; margin-top: 14px; font-size: 13.5px; color: var(--text); }
.wgt-view h1 { font-size: 19px; margin-top: 22px; }
.wgt-view h2 { font-size: 16.5px; margin-top: 18px; }
.wgt-view h3 { font-size: 14.5px; margin-top: 14px; }
.wgt-view p { margin: 8px 0; }
.wgt-view a { color: var(--accent); }
.wgt-view code { background: var(--surface-strong); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.wgt-view pre { background: #14131c; color: #eee; padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.wgt-view pre code { background: none; border: none; padding: 0; }
.wgt-view blockquote { border-left: 3px solid var(--accent); margin: 10px 0; padding: 3px 12px; color: var(--text-muted); background: var(--accent-glow); border-radius: 0 6px 6px 0; }
.wgt-view table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12.5px; }
.wgt-view th, .wgt-view td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
.wgt-view img { max-width: 100%; border-radius: 4px; }
.wgt-wikilink.wgt-missing { color: var(--pink); border-bottom: 1px dashed var(--pink); }
.wgt-editor-wrap { margin-top: 14px; }
.wgt-editor { width: 100%; min-height: 320px; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; resize: vertical; background: var(--surface); color: var(--text); }
.wgt-editor-help { color: var(--text-faint); font-size: 11px; margin-top: 6px; }
/* ─── Google Docs-style editor ───────────────────────────────────────── */
/* Toolbar: flat pill sitting above the page, sticky while you scroll. */
.wgt-rte-toolbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  padding: 5px 8px; margin: 0 0 0 0;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-strong);
}
.wgt-rte-btn {
  min-width: 28px; height: 28px; padding: 0 6px;
  border: none; border-radius: 6px; background: none;
  color: var(--text); font-size: 13px; line-height: 1; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.wgt-rte-btn:hover { background: var(--surface-hover); }
.wgt-rte-btn.wgt-active { background: var(--accent-glow); color: var(--accent); }
.wgt-rte-select {
  height: 28px; padding: 0 4px; border: none; border-radius: 6px;
  background: none; color: var(--text); font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.wgt-rte-select:hover { background: var(--surface-hover); }
.wgt-rte-select.wgt-w-style { max-width: 116px; }
.wgt-rte-select.wgt-w-font  { max-width: 116px; }
.wgt-rte-select.wgt-w-space { max-width: 74px; }
.wgt-rte-sep { width: 1px; height: 20px; background: var(--border); margin: 0 5px; flex-shrink: 0; }
/* Font-size stepper */
.wgt-rte-stepper { display: inline-flex; align-items: center; gap: 1px; }
.wgt-rte-step {
  width: 22px; height: 24px; border: none; border-radius: 5px; background: none;
  color: var(--text-muted); font-size: 14px; line-height: 1; cursor: pointer;
}
.wgt-rte-step:hover { background: var(--surface-hover); color: var(--text); }
.wgt-rte-sizebox {
  width: 34px; height: 24px; text-align: center; font-size: 12px; font-family: inherit;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface); color: var(--text);
}
.wgt-rte-sizebox:focus { outline: none; border-color: var(--accent); }
.wgt-rte-color { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
.wgt-rte-color:hover { background: var(--surface-hover); }
.wgt-rte-colorglyph { font-size: 13px; font-weight: 700; line-height: 1; pointer-events: none; }
.wgt-rte-color input[type="color"] {
  position: absolute; left: 3px; right: 3px; bottom: 3px; width: 22px; height: 5px;
  padding: 0; border: none; border-radius: 2px; cursor: pointer; background: none;
}
.wgt-rte-color input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.wgt-rte-color input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

/* The grey desk the page sits on. */
.wgt-doc-canvas {
  margin-top: 14px; padding: 26px 0 60px;
  background: var(--surface-strong);
  border: 1px solid var(--border); border-radius: 10px;
}
[data-theme="dark"] .wgt-doc-canvas { background: rgba(0,0,0,.22); }
/* The sheet of paper — Letter width, Docs' 1in margins, scaled for the panel. */
.wgt-doc-page {
  width: min(816px, calc(100% - 48px));
  margin: 0 auto;
  background: #fff;
  border: 1px solid rgba(0,0,0,.08);
  box-shadow: 0 1px 3px rgba(60,64,67,.15), 0 4px 8px rgba(60,64,67,.10);
  padding: 64px 72px;
  min-height: 520px;
}
[data-theme="dark"] .wgt-doc-page { background: #f7f7f5; }

/* Docs' default document typography: Arial 11pt, 1.15 spacing, black on white. */
.wgt-editor.wgt-rte {
  min-height: 380px; padding: 0; border: none; border-radius: 0; background: none;
  font-family: Arial, Helvetica, sans-serif; font-size: 11pt; line-height: 1.15;
  color: #202124; outline: none; cursor: text;
}
.wgt-editor.wgt-rte:empty::before { content: attr(data-placeholder); color: #9aa0a6; }
.wgt-editor.wgt-rte p { margin: 0 0 10pt; }
.wgt-editor.wgt-rte h1 { font-size: 20pt; font-weight: 400; margin: 0 0 6pt; color: #202124; }
.wgt-editor.wgt-rte h2 { font-size: 16pt; font-weight: 400; margin: 14pt 0 4pt; color: #202124; }
.wgt-editor.wgt-rte h3 { font-size: 14pt; font-weight: 400; margin: 12pt 0 4pt; color: #434343; }
.wgt-editor.wgt-rte h4 { font-size: 12pt; font-weight: 400; margin: 10pt 0 4pt; color: #666; }
.wgt-editor.wgt-rte a { color: #1155cc; text-decoration: underline; }
.wgt-editor.wgt-rte blockquote { border-left: 3px solid #dadce0; margin: 10pt 0; padding: 2pt 12pt; color: #5f6368; background: none; }
.wgt-editor.wgt-rte ul, .wgt-editor.wgt-rte ol { margin: 0 0 10pt; padding-left: 32px; }
.wgt-editor.wgt-rte img { max-width: 100%; height: auto; }
.wgt-editor.wgt-rte code { background: #f1f3f4; border: none; padding: 1px 4px; border-radius: 3px; }
mark.wgt-hl { padding: 0 1px; border-radius: 2px; cursor: pointer; }
mark.wgt-hl-yellow { background: #fdf099; }
mark.wgt-hl-green { background: #bdeeb8; }
mark.wgt-hl-blue { background: #bcdcf7; }
mark.wgt-hl-pink { background: #f7c6de; }
.wgt-commented { cursor: pointer; border-bottom: 2px solid #d9a441; background: rgba(217,164,65,.14); }
.wgt-commented.wgt-resolved-anchor { border-bottom: 2px dotted var(--text-faint); background: transparent; }
.wgt-commented.wgt-flash, .wgt-cp-item.wgt-flash { animation: wgtFlash 1s ease; }
@keyframes wgtFlash { 0%,100% { background: rgba(217,164,65,.14); } 35% { background: rgba(217,164,65,.55); } }
.wgt-sel-toolbar, .wgt-hl-menu {
  position: fixed; display: none; align-items: center; gap: 4px;
  background: #221f2b; border-radius: 8px; padding: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.3); z-index: 200;
}
.wgt-sel-toolbar .wgt-swatch, .wgt-hl-menu .wgt-swatch { width: 18px; height: 18px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,.25); }
.wgt-swatch.yellow { background: #fdf099; }
.wgt-swatch.green { background: #bdeeb8; }
.wgt-swatch.blue { background: #bcdcf7; }
.wgt-swatch.pink { background: #f7c6de; }
.wgt-sel-toolbar .wgt-sep { width: 1px; height: 18px; background: rgba(255,255,255,.2); margin: 0 2px; }
.wgt-sel-toolbar .wgt-cmt-btn, .wgt-hl-menu .wgt-trash { background: none; border: none; color: #fff; font-size: 12px; cursor: pointer; padding: 2px 5px; border-radius: 5px; white-space: nowrap; }
.wgt-hl-menu .wgt-trash { color: #f2a8a2; }
.wgt-sel-toolbar .wgt-cmt-btn:hover, .wgt-hl-menu button:hover { background: rgba(255,255,255,.12); }
.wgt-comment-popup {
  position: fixed; display: none; width: 250px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 10px 26px rgba(0,0,0,.2); padding: 10px; z-index: 200;
}
.wgt-comment-popup textarea { width: 100%; min-height: 58px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; resize: vertical; color: var(--text); background: var(--surface); }
.wgt-comment-popup .wgt-row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.wgt-comment-popup .wgt-quote-preview { font-size: 11px; color: var(--text-muted); border-left: 2px solid var(--accent); padding-left: 7px; margin-bottom: 5px; max-height: 36px; overflow: hidden; }
.wgt-comments-panel { width: 260px; flex: 0 0 auto; border-left: 1px solid var(--border); overflow-y: auto; display: none; flex-direction: column; background: var(--surface); }
.wgt-comments-panel.wgt-open { display: flex; }
.wgt-cp-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 12.5px; }
.wgt-cp-header button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }
.wgt-cp-empty { padding: 14px 12px; color: var(--text-muted); font-size: 12px; line-height: 1.5; }
.wgt-cp-list { padding: 8px; }
.wgt-cp-item { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 7px; background: var(--surface-strong); }
.wgt-cp-item.wgt-resolved { opacity: .55; }
.wgt-cp-quote { font-size: 10.5px; color: var(--text-muted); border-left: 2px solid #d9a441; padding-left: 7px; margin-bottom: 5px; font-style: italic; }
.wgt-cp-text { font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: var(--text); }
.wgt-cp-meta { font-size: 10px; color: var(--text-faint); margin-top: 5px; }
.wgt-cp-actions { display: flex; gap: 6px; margin-top: 6px; }
.wgt-cp-actions button { background: none; border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; font-size: 10.5px; cursor: pointer; color: var(--text); }
.wgt-cp-actions button:hover { border-color: var(--accent); color: var(--accent); }
.wgt-cp-toggle-resolved { padding: 7px 12px; font-size: 11px; color: var(--text-muted); cursor: pointer; border-top: 1px solid var(--border); }
.wgt-cp-toggle-resolved:hover { color: var(--accent); }
.wgt-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #221f2b; color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 300; }
.wgt-toast.wgt-show { opacity: 1; }
.wgt-welcome { max-width: 420px; margin: 60px auto; padding: 0 20px; text-align: center; color: var(--text-muted); line-height: 1.6; font-size: 13px; }
.wgt-welcome h3 { color: var(--text); font-size: 16px; }
.wgt-search-results-header { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; }
.wgt-search-result { display: block; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; text-decoration: none; color: var(--text); background: var(--surface-strong); }
.wgt-search-result:hover { border-color: var(--accent); background: var(--surface-hover); }
.wgt-search-result-title { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.wgt-search-result-snippet { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.wgt-search-result-path { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; }
.wgt-toc-header { margin-bottom: 14px; }
.wgt-toc-header h2 { margin: 0; font-size: 20px; }
.wgt-toc-header .wgt-toc-count { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.wgt-toc-list { display: grid; gap: 8px; }
.wgt-toc-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; color: var(--text); background: var(--surface-strong); }
.wgt-toc-item:hover { border-color: var(--accent); background: var(--surface-hover); }
.wgt-toc-num { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); min-width: 20px; }
.wgt-toc-body { flex: 1 1 auto; min-width: 0; }
.wgt-toc-type { flex: 0 0 auto; font-size: 11px; color: var(--text-faint); white-space: nowrap; }
.wgt-toc-item:hover .wgt-toc-type { color: var(--text-muted); }
@media (max-width: 860px) { .wgt-toc-type { display: none; } }
.wgt-toc-title { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
.wgt-toc-snippet { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.wgt-search-mark { background: var(--accent-glow); color: var(--accent); border-radius: 2px; padding: 0 1px; font-weight: 600; }

/* ─── Insert tools: dialog, symbol palette, embedded media ───────────── */
.wgt-dialog-backdrop { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(15,18,26,.42); }
.wgt-dialog { width: min(420px, 92%); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,.28); overflow: hidden; }
.wgt-dlg-title { padding: 13px 16px; font-size: 13.5px; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); background: var(--surface-strong); }
.wgt-dlg-body { padding: 14px 16px; display: grid; gap: 11px; }
.wgt-dlg-row { display: grid; gap: 5px; font-size: 11.5px; color: var(--text-muted); }
.wgt-dlg-row input, .wgt-dlg-row select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font-size: 12.5px; font-family: inherit; }
.wgt-dlg-row input:focus, .wgt-dlg-row select:focus { outline: none; border-color: var(--accent); }
.wgt-dlg-row input[type="file"] { padding: 6px; font-size: 11.5px; }
.wgt-dlg-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface-strong); }

.wgt-symbols { position: absolute; z-index: 60; width: 312px; max-height: 320px; overflow-y: auto; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.22); }
.wgt-sym-group + .wgt-sym-group { margin-top: 10px; }
.wgt-sym-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; margin-bottom: 5px; }
.wgt-sym-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.wgt-sym { height: 28px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--text); font-size: 15px; line-height: 1; cursor: pointer; }
.wgt-sym:hover { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }

/* Media and tables inside rendered pages and the editor */
.wgt-view iframe, .wgt-view video { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; background: #000; }
.wgt-view audio { width: 100%; margin: 10px 0; }
.wgt-view figure { margin: 12px 0; }
.wgt-editor.wgt-rte table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12.5px; }
.wgt-editor.wgt-rte th, .wgt-editor.wgt-rte td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; min-width: 40px; }
.wgt-editor.wgt-rte th { background: var(--surface-strong); font-weight: 600; }
.wgt-editor.wgt-rte td:focus, .wgt-editor.wgt-rte th:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.wgt-editor.wgt-rte hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

/* Contextual table bar — appears while the caret is inside a table */
.wgt-table-tools {
  display: none; position: fixed; z-index: 55; align-items: center; gap: 3px;
  padding: 5px 7px; border-radius: 9px; background: #1d2330; color: #fff;
  box-shadow: 0 8px 22px rgba(0,0,0,.3); font-size: 11.5px;
}
.wgt-tt-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; opacity: .55; margin-right: 3px; }
.wgt-tt-btn { background: none; border: none; color: #fff; font-size: 11.5px; font-family: inherit; cursor: pointer; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.wgt-tt-btn:hover { background: rgba(255,255,255,.14); }
.wgt-tt-danger:hover { background: rgba(240,90,110,.32); }
.wgt-tt-sep { width: 1px; height: 16px; background: rgba(255,255,255,.2); margin: 0 3px; }

/* Find in this page — floats over the top-right of the document */
.wgt-find-bar {
  display: none; position: absolute; top: 62px; right: 18px; z-index: 40;
  align-items: center; gap: 4px; padding: 6px 8px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.16);
}
.wgt-find-bar.wgt-open { display: flex; }
.wgt-find-bar input {
  width: 190px; padding: 5px 9px; font-size: 12.5px; font-family: inherit;
  border: 1px solid var(--border); border-radius: 7px;
  background: var(--surface); color: var(--text);
}
.wgt-find-bar input:focus { outline: none; border-color: var(--accent); }
.wgt-find-bar.wgt-find-none input { border-color: var(--pink); }
.wgt-find-count { font-size: 11px; color: var(--text-muted); min-width: 62px; text-align: center; white-space: nowrap; }
.wgt-find-btn {
  width: 24px; height: 24px; border: none; border-radius: 6px; background: none;
  color: var(--text-muted); font-size: 12px; cursor: pointer; line-height: 1;
}
.wgt-find-btn:hover { background: var(--surface-hover); color: var(--text); }
mark.wgt-find { background: #ffe066; color: inherit; padding: 0 1px; border-radius: 2px; }
mark.wgt-find-current { background: #ff9f1a; box-shadow: 0 0 0 2px rgba(255,159,26,.35); }

/* Reading view uses the same sheet of paper, so switching in and out of edit
   mode doesn't move the text around. */
/* `:not(.wgt-doc-native)` keeps these defaults away from imported Word
   documents, which carry their own stylesheet — otherwise the hub's typography
   would win on specificity and flatten the design we just preserved. */
.wgt-doc-page .wgt-view { margin-top: 0; color: #202124; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11pt; line-height: 1.15;
}
.wgt-doc-page .wgt-view:not(.wgt-doc-native) h1 { font-size: 20pt; font-weight: 400; margin: 0 0 6pt; color: #202124; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) h2 { font-size: 16pt; font-weight: 400; margin: 14pt 0 4pt; color: #202124; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) h3 { font-size: 14pt; font-weight: 400; margin: 12pt 0 4pt; color: #434343; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) h4 { font-size: 12pt; font-weight: 400; margin: 10pt 0 4pt; color: #666; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) p  { margin: 0 0 10pt; }
.wgt-doc-page .wgt-view a  { color: #1155cc; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) ul, .wgt-doc-page .wgt-view:not(.wgt-doc-native) ol { margin: 0 0 10pt; padding-left: 32px; }
.wgt-doc-page .wgt-view code { background: #f1f3f4; border: none; color: #202124; }
.wgt-doc-page .wgt-view pre  { background: #f1f3f4; color: #202124; }
.wgt-doc-page .wgt-view blockquote { border-left: 3px solid #dadce0; background: none; color: #5f6368; border-radius: 0; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) th, .wgt-doc-page .wgt-view:not(.wgt-doc-native) td { border-color: #dadce0; }
.wgt-doc-page .wgt-view:not(.wgt-doc-native) th { background: #f8f9fa; }

/* An imported Word document is scoped under .wdoc by docx-preview. Let its own
   rules through, but stop its page-sized section boxes from double-framing the
   sheet the hub already draws. */
.wgt-view .wdoc, .wgt-editor.wgt-rte .wdoc { color: inherit; }
.wgt-view .wdoc table, .wgt-editor.wgt-rte .wdoc table { max-width: 100%; }
/* Images keep the size Word gave them. max-width only clamps ones too wide for
   the page, and height:auto then keeps those in proportion. */
.wgt-view .wdoc img, .wgt-editor.wgt-rte .wdoc img { max-width: 100%; }
.wgt-view .wdoc img[width], .wgt-editor.wgt-rte .wdoc img[width] { height: auto; }
.wgt-view .wdoc section, .wgt-editor.wgt-rte .wdoc section {
  width: auto !important; min-height: 0 !important; padding: 0 !important;
  margin: 0 !important; box-shadow: none !important; background: none !important;
}

/* Word tables are often wider than the page. Scroll them inside the sheet
   rather than letting them push the whole document sideways. */
.wgt-doc-page .wgt-view, .wgt-editor.wgt-rte { max-width: 100%; overflow-x: auto; }
.wgt-doc-page .wgt-view table, .wgt-editor.wgt-rte table {
  max-width: 100%; table-layout: auto; word-break: break-word;
}
.wgt-doc-page .wgt-view td, .wgt-doc-page .wgt-view th,
.wgt-editor.wgt-rte td, .wgt-editor.wgt-rte th { overflow-wrap: anywhere; }
.wgt-doc-page .wgt-view img, .wgt-editor.wgt-rte img { max-width: 100%; height: auto; }
.wgt-doc-page .wgt-view pre { white-space: pre-wrap; word-break: break-word; }

/* Marks the published (uploaded) copy, where nothing can be written back */
.wgt-readonly-note {
  padding: 5px 10px; border-radius: 999px; font-size: 11.5px;
  border: 1px dashed var(--border); color: var(--text-faint); white-space: nowrap;
}

/* Read-only mode — shown to anyone who isn't signed in. */
.wgt-shell.wgt-readonly .wgt-page-link { cursor: pointer; }
.wgt-shell.wgt-readonly .wgt-drag-dots { display: none; }
.wgt-welcome-hint { font-size: 12px; color: var(--text-muted); line-height: 1.55; max-width: 460px; margin: 6px auto 14px; }
.wgt-welcome-hint a { color: var(--accent); }
.wgt-welcome-actions { display: flex; gap: 8px; justify-content: center; margin: 14px 0 4px; }

/* Folder switcher — subfolders of wiki-pages become sections you browse one at
   a time. Search still spans all of them. */
.wgt-folder-head {
  padding: 6px 8px 4px; font-size: 10px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-faint); font-weight: 700;
}
/* Collapsible "Folders" header */
.wgt-folder-head.wgt-folder-section {
  display: flex; align-items: center; gap: 5px; width: 100%; text-align: left;
  background: none; border: none; cursor: pointer; font-family: inherit;
  border-radius: 6px;
}
.wgt-folder-head.wgt-folder-section:hover { color: var(--accent); background: var(--surface-hover); }
.wgt-folder-head .wgt-space-count { margin-left: auto; }
.wgt-chev { display: inline-block; width: 10px; font-size: 9px; line-height: 1; }
/* Per-folder expander, only drawn when a folder has subfolders */
.wgt-folder-twisty {
  flex: 0 0 auto; width: 16px; height: 22px; padding: 0; border: none; background: none;
  color: var(--text-faint); font-size: 9px; line-height: 1; cursor: pointer; border-radius: 4px;
}
.wgt-folder-twisty:hover { color: var(--accent); background: var(--surface); }
.wgt-folder-twisty-blank { cursor: default; }
/* Open accordion: capped height so a long folder list scrolls instead of
   pushing the pages out of sight. */
.wgt-folder-list {
  display: grid; gap: 2px; margin-bottom: 10px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  max-height: 260px; overflow-y: auto;
}
.wgt-folder-list[hidden] { display: none; }
.wgt-folder-list::-webkit-scrollbar { width: 8px; }
.wgt-folder-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
.wgt-folder-filter {
  width: 100%; padding: 6px 9px; margin-bottom: 4px; font-size: 12px; font-family: inherit;
  border: 1px solid var(--border); border-radius: 7px;
  background: var(--surface); color: var(--text);
}
.wgt-folder-filter:focus { outline: none; border-color: var(--accent); }
/* Closed accordion shows the folder you're in */
.wgt-folder-current {
  flex: 1 1 auto; text-transform: none; letter-spacing: 0; font-size: 12px;
  font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wgt-folder-row { display: flex; align-items: center; border-radius: 7px; }
.wgt-folder-row:hover { background: var(--surface-hover); }
.wgt-folder-row.active { background: var(--accent-glow); }
.wgt-folder-item {
  display: flex; align-items: center; gap: 7px; flex: 1 1 auto; min-width: 0; text-align: left;
  padding: 7px 4px 7px 4px; border: none; border-radius: 7px; cursor: pointer;
  background: none; color: var(--text-muted); font-family: inherit; font-size: 12.5px;
}
.wgt-folder-item::before { content: '📁'; font-size: 12px; flex: 0 0 auto; filter: grayscale(1); opacity: .7; }
.wgt-folder-row:hover .wgt-folder-item { color: var(--text); }
.wgt-folder-row.active .wgt-folder-item { color: var(--accent); font-weight: 600; }
.wgt-folder-row.active .wgt-folder-item::before { filter: none; opacity: 1; }
/* While a page is being dragged, folders read as drop targets */
.wgt-dragging .wgt-folder-row {
  outline: 1px dashed var(--border); outline-offset: -1px;
}
.wgt-dragging .wgt-folder-row:hover {
  outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-glow);
}
/* A page dropped on a folder is removed on the next render — keep it invisible
   in the meantime so the row doesn't visibly jump. */
.wgt-folder-row .wgt-page-link { display: none; }

/* Rename / delete, revealed on hover so the list stays calm */
.wgt-folder-tools { display: flex; gap: 1px; padding-right: 5px; opacity: 0; transition: opacity .12s ease; }
.wgt-folder-row:hover .wgt-folder-tools, .wgt-folder-row.active .wgt-folder-tools { opacity: 1; }
.wgt-folder-tool {
  width: 22px; height: 22px; border: none; border-radius: 5px; background: none;
  color: var(--text-faint); font-size: 11px; line-height: 1; cursor: pointer;
}
.wgt-folder-tool:hover { background: var(--surface); color: var(--accent); }
.wgt-folder-tool-danger:hover { background: rgba(214,51,108,.14); color: var(--pink); }
/* Destructive confirm button */
.wgt-btn.wgt-danger { background: var(--pink); border-color: var(--pink); color: #fff; }
.wgt-btn.wgt-danger:hover { opacity: .9; color: #fff; }
.wgt-dlg-intro { margin: 0 0 4px; font-size: 12.5px; color: var(--text-muted); line-height: 1.55; }
.wgt-folder-name { flex: 1 1 auto; word-break: break-word; }
/* Which folder a search hit came from */
.wgt-page-folder {
  display: block; font-size: 10.5px; color: var(--text-faint);
  font-weight: 400; margin-top: 2px;
}
.wgt-upload-fail {
  max-width: 460px; margin: 12px auto 4px; padding: 10px 12px;
  border: 1px solid var(--pink); border-radius: 8px;
  background: rgba(214,51,108,.07); color: var(--text);
  font-size: 12.5px; line-height: 1.5; text-align: left;
}
.wgt-welcome-hint code { background: var(--surface-strong); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }

/* ─── Standalone frame (not in the hub) ───────────────────── */
.wk-top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  height: 60px; padding: 0 18px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(255,255,255,.03), 0 6px 24px -18px rgba(0,2,57,.45);
}

/* Brand: logo | wiki name (brand_() in Code.gs). Clicking it goes home. */
.wk-brand {
  display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
  text-decoration: none; color: inherit; padding: 6px 8px; margin-left: -8px; border-radius: 10px;
  transition: background .15s;
}
.wk-brand:hover { background: var(--surface-hover); }
.wk-logo { display: block; height: 18px; width: auto; }
.wk-mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--on-accent);
  box-shadow: 0 4px 12px -4px var(--accent);
}
/* Navy wordmark on the light theme, white one on the dark theme. */
.wk-logo-dark { display: none; }
[data-theme="dark"] .wk-logo-light { display: none; }
[data-theme="dark"] .wk-logo-dark { display: block; }
.wk-brand-divider { width: 1px; height: 20px; background: var(--border-bright); }
.wk-brand-name { font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; color: var(--text); white-space: nowrap; }

/* Search + actions, between the brand and the account */
.wk-tools { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 14px; }
.wk-search {
  position: relative; flex: 1 1 360px; max-width: 460px; min-width: 150px;
  display: flex; align-items: center; cursor: text;
}
.wk-search > svg { position: absolute; left: 12px; color: var(--text-muted); pointer-events: none; transition: color .15s; }
.wk-search input {
  width: 100%; height: 38px; padding: 0 64px 0 38px;
  border: 1px solid var(--border); border-radius: 11px;
  background: var(--surface-strong); color: var(--text);
  font: inherit; font-size: 13px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.wk-search input::placeholder { color: var(--text-muted); }
.wk-search input:hover:not(:disabled) { border-color: var(--border-bright); }
.wk-search input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-glow); }
.wk-search:focus-within > svg { color: var(--accent); }
.wk-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.wk-search input:disabled { opacity: .6; }
.wk-kbd {
  position: absolute; right: 9px; pointer-events: none;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted);
  padding: 2px 7px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px;
  background: var(--surface); transition: opacity .15s;
}
.wk-search:focus-within .wk-kbd { opacity: 0; }

.wk-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.wk-seg {
  display: flex; align-items: stretch; height: 38px;
  border: 1px solid var(--border); border-radius: 11px; overflow: hidden;
  background: var(--surface-strong);
}
.wk-act {
  display: inline-flex; align-items: center; gap: 7px;
  height: 100%; padding: 0 13px;
  border: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: background .15s, color .15s, transform .15s, box-shadow .15s, filter .15s;
}
.wk-seg .wk-act + .wk-act { border-left: 1px solid var(--border); }
.wk-act > svg { flex: 0 0 auto; color: var(--text-muted); transition: color .15s; }
.wk-seg .wk-act:hover:not(:disabled) { background: var(--surface-hover); color: var(--accent); }
.wk-seg .wk-act:hover:not(:disabled) > svg { color: var(--accent); }
.wk-act:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.wk-act:disabled { opacity: .45; cursor: not-allowed; }
.wk-act-primary {
  height: 38px; padding: 0 16px; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: var(--on-accent);
  box-shadow: 0 6px 16px -6px var(--accent), inset 0 1px 0 rgba(255,255,255,.22);
}
.wk-act-primary > svg { color: var(--on-accent); }
.wk-act-primary:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 10px 22px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.22); }
.wk-act-primary:active:not(:disabled) { transform: translateY(0); }

.wk-readonly {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
  border: 1px dashed var(--border-bright); border-radius: 999px;
  color: var(--text-muted); font-size: 12px; font-weight: 600;
}

/* Account + theme */
.wk-user {
  display: inline-flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0;
  height: 38px; padding: 0 12px 0 4px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface-strong);
  font-size: 12.5px; color: var(--text-muted);
}
.wk-user-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.wk-avatar {
  position: relative; width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #3699F1, #000579);
}
.wk-avatar::after {
  content: ''; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--text-faint); border: 2px solid var(--surface-strong);
}
.wk-user.wk-can-edit .wk-avatar::after { background: var(--green); }
.wk-icon-btn {
  width: 38px; height: 38px; border-radius: 11px; cursor: pointer; flex: 0 0 auto;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface-strong); color: var(--text);
  transition: border-color .15s, color .15s, transform .2s;
}
.wk-icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(-12deg); }

/* Narrower windows: icons only, then the search takes its own row. */
@media (max-width: 1180px) {
  .wk-act .wk-label, .wk-readonly .wk-label { display: none; }
  .wk-act { padding: 0 11px; }
  .wk-user-text { max-width: 140px; }
}
@media (max-width: 860px) {
  .wk-brand-name, .wk-brand-divider, .wk-kbd { display: none; }
  .wk-user-text { display: none; }
  .wk-user { padding: 0 4px; }
}
@media (max-width: 620px) {
  .wk-top { flex-wrap: wrap; height: auto; padding: 10px 12px; row-gap: 10px; }
  .wk-tools { order: 5; flex-basis: 100%; }
  .wk-user { margin-left: auto; }
}
