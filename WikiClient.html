<script>
/* WikiClient.html
 * OIS Team Wiki — the ToolHub wiki (assets/js/wiki/process-guides.js) running
 * as a Google Apps Script web app. The UI is the hub's; only storage differs.
 */
// Pages live in a Google Drive folder and every read and write goes through
// google.script.run (pgCall, in Helpers.html) to Code.gs / Api.gs.
//
// The page list arrives with the page itself (window.OIS_WIKI_BOOT) and holds
// titles, folders and short snippets only. A page's content and its
// highlights/comments are fetched when it is opened, and search runs on the
// server — one imported Word document can be over a megabyte, too much to
// ship the whole wiki up front.
//
// New pages and uploads are Google Docs, and existing Google Docs can be
// linked in (a Drive shortcut; the Doc stays where it is). The wiki shows a
// Doc in Google's own viewer, so it looks exactly as it does in Docs, and
// sends "Edit" to Google Docs. Older .html/.md pages
// keep the wiki's own editor, highlights and comments.
//
// Who may edit is decided on the server (Script Property EDITORS and Drive
// sharing); the client only hides the controls to match.
window.OIS_WIKI_STARTED = true;
(function () {
  const BOOT = window.OIS_WIKI_BOOT || {};
  let PG_SPACE = (BOOT.tree && BOOT.tree.space) || 'OIS Team Wiki';
  const pgUser = BOOT.user || { email: '', canEdit: false };

  let pgPages = [];
  let pgCurrent = null;
  let pgEditing = false;
  let pgShowingToc = false;
  let pgShowingHome = false;    // the welcome page is on screen
  let pgShowResolved = false;
  let pgTurndown = null;
  let pgGlobalBound = false;
  let pgPendingComment = null;
  let pgLoaded = false;

  // The organisation's name (Brand.gs), for "your … Google account".
  const PG_BRAND = BOOT.brand || { name: 'Team Wiki', org: '' };
  const PG_ACCOUNT = (PG_BRAND.org ? PG_BRAND.org + ' ' : 'work ') + 'Google account';

  // What this person may do, as set on the Settings page (Access.gs):
  // add, edit, upload, link, delete. The server checks each one again.
  function pgCan(perm) {
    if (!pgUser.email) return false;
    if (pgUser.perms) return !!pgUser.perms[perm];
    return !!pgUser.canEdit;                        // older server: one switch for all
  }
  function pgReadOnlyReason() {
    if (!pgUser.email) return 'signedout';
    if (!pgUser.canEdit) return 'viewer';
    return null;
  }
  // True when the person may change anything at all.
  function pgCanEdit() { return !pgReadOnlyReason(); }
  const PG_PERM_WORDS = { add: 'create pages or folders', edit: 'edit pages', upload: 'upload files',
                          link: 'link files', delete: 'delete pages or folders' };
  function pgRequire(perm) {
    const who = (pgUser.contact && pgUser.contact[0]) || 'a wiki admin';
    pgToast(!pgUser.email
      ? 'Sign in with your ' + PG_ACCOUNT + ' to make changes'
      : "You don't have permission to " + (PG_PERM_WORDS[perm] || 'do that') + ' — ask ' + who, 6000);
    return false;
  }

  // ── Storage ─────────────────────────────────────────────
  const PG_ROOT_FOLDER = 'All pages';   // label for pages sitting loose in the root folder
  let pgFolder = '';         // subfolder currently being browsed ('' = top level)
  let pgFolderList = [];     // every subfolder in Drive, including empty ones

  // A page row from the server — metadata only. `content` and `annotations`
  // stay null until the page is opened (pgEnsureContent). Doc pages never
  // fetch content: Google's viewer shows them (pgDocPreviewUrl).
  function pgPageFromRow(row) {
    const doc = row.kind === 'gdoc' || row.kind === 'link';
    return {
      id: row.id,
      kind: row.kind || 'html',     // 'html' | 'gdoc' | 'link' (see Docs.gs)
      app: row.app || 'doc',        // for gdoc/link: 'doc' | 'sheet' | 'slide'
      office: row.office || null,   // 'pptx', 'docx', … for an Office file kept as-is
      docId: row.docId || null,
      docUrl: row.docUrl || null,
      broken: !!row.broken,
      path: row.path,
      file: row.file,
      folder: row.folder || '',
      title: row.title || pgTitleFromFilename(row.file),
      snippet: row.snippet || '',
      rev: row.rev || 0,
      modified: row.modified || 0,
      space: PG_SPACE,
      content: doc ? '' : null,
      annotations: doc ? { highlights: [], comments: [] } : null
    };
  }

  // Fetches a page's content and annotations the first time it is needed.
  // Concurrent callers share one request.
  function pgEnsureContent(page) {
    if (page.content !== null && page.annotations) return Promise.resolve(page);
    if (!page._loading) {
      page._loading = pgCall('getPage', page.id).then(data => {
        page.content = data.content;
        page.annotations = data.annotations || { highlights: [], comments: [] };
        if (data.snippet !== undefined) page.snippet = data.snippet;
        page.rev = data.rev;
        page.modified = data.modified;
        page._loading = null;
        return page;
      }, err => { page._loading = null; throw err; });
    }
    return page._loading;
  }

  // Every folder: those in Drive (even empty ones) plus any a page lives in.
  // Root always first.
  function pgFolders() {
    const set = new Set(['']);
    pgFolderList.forEach(f => set.add(f));
    pgPages.forEach(p => set.add(p.folder || ''));
    return Array.from(set).sort((a, b) => {
      if (a === '') return -1;
      if (b === '') return 1;
      return a.localeCompare(b);
    });
  }
  function pgFolderLabel(folder) {
    return folder ? folder.split('/').pop() : PG_ROOT_FOLDER;
  }

  // ── Collapse state for the folder list ──────────────────
  // Remembered per browser so the sidebar looks the same on the next visit.
  const PG_UI_KEY = 'ois-toolhub-wiki-folder-ui';
  let pgFoldersCollapsed = true;   // accordion starts closed — one row, not a wall
  let pgCollapsed = {};            // folder path -> true when its children are hidden
  let pgFolderFilter = '';         // not persisted; clears when a folder is picked
  (function pgLoadFolderUi() {
    try {
      const saved = JSON.parse(localStorage.getItem(PG_UI_KEY) || '{}');
      if (typeof saved.sectionCollapsed === 'boolean') pgFoldersCollapsed = saved.sectionCollapsed;
      pgCollapsed = saved.collapsed && typeof saved.collapsed === 'object' ? saved.collapsed : {};
    } catch (e) { /* first run */ }
  })();
  function pgSaveFolderUi() {
    try {
      localStorage.setItem(PG_UI_KEY, JSON.stringify({
        sectionCollapsed: pgFoldersCollapsed, collapsed: pgCollapsed
      }));
    } catch (e) { /* quota/private mode */ }
  }
  // True when some ancestor of this folder is collapsed.
  function pgFolderHidden(folder) {
    if (!folder) return false;
    const parts = folder.split('/');
    for (let i = 1; i < parts.length; i++) {
      if (pgCollapsed[parts.slice(0, i).join('/')]) return true;
    }
    return false;
  }
  function pgFolderHasChildren(folder, all) {
    if (!folder) return false;
    return all.some(f => f.indexOf(folder + '/') === 0);
  }

  // Google Doc pages (made here or linked in) are edited in Google Docs, not
  // in the wiki's editor, and use Docs comments instead of the wiki's.
  function pgIsDocPage(p) { return !!p && (p.kind === 'gdoc' || p.kind === 'link'); }

  // Google's own read-only viewer for a Doc. It is the same renderer Google
  // Docs uses, so fonts, spacing, page size, margins, headers, footers and
  // images all match — an HTML export can't. It shows the Doc with the
  // reader's own Google access.
  const PG_APP_INFO = {
    doc:   { path: 'document',     noun: 'Doc',         name: 'Google Doc',    icon: 'doc' },
    sheet: { path: 'spreadsheets', noun: 'Sheet',       name: 'Google Sheet',  icon: 'sheet' },
    slide: { path: 'presentation', noun: 'Slides file', name: 'Google Slides', icon: 'slide' }
  };
  function pgAppInfo(p) { return PG_APP_INFO[(p && p.app) || 'doc'] || PG_APP_INFO.doc; }
  const PG_OFFICE_NOUN = { docx: 'Word file', doc: 'Word file', xlsx: 'Excel file', xls: 'Excel file',
                           pptx: 'PowerPoint file', ppt: 'PowerPoint file' };
  // What to call the file in messages: "Doc", "Sheet", "PowerPoint file"…
  function pgNoun(p) { return (p && p.office && PG_OFFICE_NOUN[p.office]) || pgAppInfo(p).noun; }
  // Office files (a .pptx kept as-is) use Drive's file viewer — Google's
  // Slides/Docs/Sheets viewers only show native files.
  function pgDocPreviewUrl(p) {
    if (p.office) return 'https://drive.google.com/file/d/' + encodeURIComponent(p.docId) + '/preview';
    return 'https://docs.google.com/' + pgAppInfo(p).path + '/d/' + encodeURIComponent(p.docId) + '/preview';
  }
  // The real Google editor (Docs, Sheets or Slides), embedded. Google saves
  // as you type. Office files open in its Office-compatibility mode, which
  // saves back into the .pptx/.docx/.xlsx itself.
  function pgDocEditUrl(p) {
    return 'https://docs.google.com/' + pgAppInfo(p).path + '/d/' + encodeURIComponent(p.docId) + '/edit' +
      (p.office ? '?rtpof=true&sd=true' : '');
  }
  let pgDocInline = false;   // the open Doc is showing the embedded editor

  // Server errors arrive as Error objects whose message is already written for
  // the reader (see guard_ in Api.gs).
  function pgErrMsg(err) {
    return String(err && err.message || err || 'unknown error').replace(/^(Exception|Error):\s*/, '');
  }

  function pgGenId() { return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9); }
  // Produces a safe, URL-friendly, lowercase kebab-case filename stem. Strips
  // characters that are illegal on Windows or awkward in URLs (& ( ) etc.) and
  // collapses runs of separators, so uploads can't create names like
  // "e-&-a-consulting-group-(1).md".
  function pgSlugify(name) {
    return String(name || '')
      .trim()
      .toLowerCase()
      .replace(/[\\/:*?\x22<>|]/g, '')       // illegal on Windows
      .replace(/[&+#%{}$!\x27\x60~^]/g, '')     // awkward in URLs
      .replace(/[()\[\]]/g, '')           // brackets
      .replace(/[\s_.]+/g, '-')           // spaces, underscores, dots -> dash
      .replace(/-{2,}/g, '-')             // collapse runs
      .replace(/^-+|-+$/g, '')            // trim dashes
      || 'untitled';
  }
  // Strips a trailing document extension from a title. Pages imported before
  // extensions were stripped at upload time still have e.g. "Handbook.pdf" as
  // their heading, so clean it on read too rather than rewriting those files.
  function pgCleanTitle(t) {
    return String(t || '').replace(/\.(html?|md|markdown|docx?|pdf|txt|rtf|xlsx?|pptx?)$/i, '').trim();
  }
  // A page's title is its first heading — written as Markdown for most pages,
  // or as an <h1> for Word documents, which are stored as HTML.
  function pgTitleFromContent(content, fallback) {
    const text = String(content || '');
    const md = text.match(/^\s*#\s+(.+)$/m);
    if (md) return pgCleanTitle(md[1].trim());
    const h1 = text.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
    if (h1) {
      const plain = h1[1].replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
      if (plain) return pgCleanTitle(plain);
    }
    return fallback;
  }

  // ── Manual page ordering (drag to reorder in the sidebar) ──
  // Stores an explicit list of page paths in localStorage. Pages not in the
  // list (newly added/uploaded) fall to the end in alphabetical order, so a
  // saved order never hides a new page.
  const PG_ORDER_KEY = 'ois-toolhub-wiki-page-order';
  function pgLoadOrder() {
    try {
      const raw = JSON.parse(localStorage.getItem(PG_ORDER_KEY) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch (e) { return []; }
  }
  function pgSaveOrder(paths) {
    try { localStorage.setItem(PG_ORDER_KEY, JSON.stringify(paths)); } catch (e) { /* quota/private mode */ }
  }
  function pgSortPages() {
    const order = pgLoadOrder();
    const rank = {};
    order.forEach((p, i) => { rank[p] = i; });
    pgPages.sort((a, b) => {
      const ra = rank[a.path], rb = rank[b.path];
      if (ra !== undefined && rb !== undefined) return ra - rb;
      if (ra !== undefined) return -1;
      if (rb !== undefined) return 1;
      return a.title.localeCompare(b.title);
    });
  }
  // Strips any file extension (.md, .docx, .pdf, .txt, …) so uploaded documents
  // don't carry their extension into the page title.
  function pgTitleFromFilename(name) {
    return String(name || '')
      .replace(/\.[A-Za-z0-9]{1,8}$/, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function pgTruncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
  function pgFmtTime(ts) { try { return new Date(ts).toLocaleString(); } catch (e) { return ''; } }

  // `ms` lets errors linger — a 2-second toast is easy to miss, and a failure
  // that vanishes looks exactly like a success.
  function pgToast(msg, ms) {
    const t = document.getElementById('wgtToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('wgt-show');
    clearTimeout(pgToast._t);
    pgToast._t = setTimeout(() => t.classList.remove('wgt-show'), ms || 2200);
  }

  // Shared sanitiser settings: allow the inline styling, embedded media and
  // data-URI images the editor can produce, while DOMPurify still strips scripts
  // and event handlers.
  //
  // `style` is in ADD_TAGS because an imported Word document carries its own
  // stylesheet — that is what makes the page look like the original. DOMPurify
  // parses and sanitises CSS itself, so no script can ride in on it, and
  // docx-preview scopes every rule under .wdoc so a document can't restyle the
  // hub around it.
  const PG_SANITIZE = {
    // iframe stays allowed for the Insert > media embeds; frames without a real
    // https source are stripped in pgContentToHtml instead.
    ADD_TAGS: ['iframe', 'video', 'audio', 'source', 'style'],
    ADD_ATTR: ['style', 'class', 'target', 'allowfullscreen', 'frameborder', 'controls', 'colspan', 'rowspan'],
    ADD_DATA_URI_TAGS: ['img']
  };

  async function pgLoadViewLibs() {
    await Promise.all([
      loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js'),
      loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js'),
    ]).catch(() => {});
    if (window.marked) marked.setOptions({ breaks: true, gfm: true });
  }
  async function pgLoadTurndownLib() {
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.js').catch(() => {});
    if (window.TurndownService && !pgTurndown) {
      pgTurndown = new TurndownService({ headingStyle: 'atx' });
      // Preserve anything with inline styling (color/font/size/spacing/alignment
      // applied from the rich-text editor toolbar) as raw HTML — Markdown has no
      // syntax for these, so round-tripping through the editor keeps them intact.
      pgTurndown.keep((node) => !!(node.getAttribute && node.getAttribute('style')));
      // Embedded media has no Markdown equivalent — keep it as raw HTML.
      pgTurndown.keep(['u', 'iframe', 'video', 'audio', 'source']);
      pgTurndown.addRule('strikethrough', {
        filter: ['strike', 's', 'del'],
        replacement: (content) => '~~' + content + '~~'
      });
      // Tables: emit a clean GitHub-style pipe table when the table is simple,
      // otherwise keep the original HTML so merged cells and cell styling survive.
      pgTurndown.addRule('table', {
        filter: 'table',
        replacement: (content, node) => '\n\n' + pgTableToMarkdown(node) + '\n\n'
      });
      // Wiki links render as <a data-wikilink="..."> — convert them back to
      // [[Target]] / [[Target|Label]] syntax instead of a plain markdown link.
      pgTurndown.addRule('wikilink', {
        filter: (node) => node.nodeName === 'A' && node.hasAttribute('data-wikilink'),
        replacement: (content, node) => {
          const target = decodeURIComponent(node.getAttribute('data-wikilink') || '');
          const label = (content || '').trim();
          return label && label.toLowerCase() !== target.toLowerCase() ? `[[${target}|${label}]]` : `[[${target}]]`;
        }
      });
    }
  }
  async function pgLoadUploadLibs() {
    await Promise.all([
      pgLoadTurndownLib(),
      loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'),
      loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'),
    ]);
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  }

  // ── Pages + annotations ─────────────────────────────────
  async function pgSaveAnnotations(page) {
    if (!pgCan('edit')) return;
    try {
      await pgCall('saveAnnotations', page.id, page.annotations);
    } catch (err) {
      console.error(err);
      pgToast("Couldn't save comments/highlights: " + pgErrMsg(err), 7000);
    }
  }

  // Loads the folder and page list. The first call uses the list that came
  // with the page; later calls (`fresh`, or any quiet refresh) ask Drive again.
  async function pgLoadPages(opts) {
    const quiet = opts && opts.quiet;
    let data = null;
    if (!pgLoaded && BOOT.tree && !(opts && opts.fresh)) {
      data = BOOT.tree;
    } else {
      try {
        data = await pgCall('listTree');
      } catch (err) {
        console.error(err);
        if (quiet) return;          // keep showing what we have
        pgShowLoadError(pgErrMsg(err));
        return;
      }
    }
    if (!data) { pgShowLoadError(BOOT.error || 'The wiki could not be loaded.'); return; }
    PG_SPACE = data.space || PG_SPACE;

    // Update pages already known in place, so pgCurrent and anything else
    // holding a page stays valid. Content is dropped (and fetched again when
    // next opened) only when someone has changed the page since — except the
    // page being edited, whose revision is what detects that on save.
    const known = {};
    pgPages.forEach(p => { known[p.id] = p; });
    pgPages = (data.pages || []).map(row => {
      const fresh = pgPageFromRow(row);
      const old = known[row.id];
      if (!old) return fresh;
      const editingThis = pgEditing && old === pgCurrent;
      const changed = old.rev !== fresh.rev || old.modified !== fresh.modified;
      Object.assign(old, { path: fresh.path, file: fresh.file, folder: fresh.folder,
                           title: fresh.title, snippet: fresh.snippet });
      if (changed && !editingThis) {
        Object.assign(old, { rev: fresh.rev, modified: fresh.modified });
        if (!pgIsDocPage(old)) Object.assign(old, { content: null, annotations: null });
      }
      return old;
    });
    pgFolderList = (data.folders || []).filter(Boolean);
    // Stay on a folder that still exists.
    if (pgFolder && pgFolders().indexOf(pgFolder) === -1) pgFolder = '';
    pgLoaded = true;
    pgSortPages();
    pgRenderSidebar(pgSearchValue());
    pgApplyPermissions();
    const search = document.getElementById('wgtSearch');
    if (search) search.disabled = false;
    if (quiet) {
      // Background refresh — stay on whatever the reader was looking at, and
      // never disturb an edit in progress.
      if (pgEditing || pgSearchValue()) return;     // don't pull the reader off results
      if (pgShowingToc) { pgRenderTableOfContents(pgFolder); return; }
      if (pgCurrent && pgPages.includes(pgCurrent)) {
        if (pgCurrent.content === null) pgOpenPage(pgCurrent);   // changed by someone else
      }
      else pgShowHome();          // home, or the open page is gone
      return;
    }
    pgShowHome();
  }

  function pgSearchValue() {
    const s = document.getElementById('wgtSearch');
    return s ? s.value : '';
  }

  function pgShowLoadError(msg) {
    const contentEl = document.getElementById('wgtContent');
    const sidebarEl = document.getElementById('wgtSidebar');
    if (sidebarEl) sidebarEl.innerHTML = `<div class="wgt-empty-hint">No pages loaded.</div>`;
    if (!contentEl) return;
    contentEl.innerHTML = `
      <div class="wgt-welcome">
        <h3>Couldn't load the wiki</h3>
        <p class="wgt-upload-fail">${esc(msg)}</p>
        <button class="wgt-btn wgt-primary" id="wgtRetryLoad">Try again</button>
      </div>`;
    const retry = document.getElementById('wgtRetryLoad');
    if (retry) retry.addEventListener('click', () => pgLoadPages({ fresh: true }));
  }

  // Shows or hides everything that changes content, based on the account.
  function pgApplyPermissions() {
    const can = pgCanEdit();
    const shell = document.getElementById('wgtShell');
    if (shell) shell.classList.toggle('wgt-readonly', !can);

    const needs = { wgtNewPageBtn: 'add', wgtNewFolderBtn: 'add', wgtUploadBtn: 'upload', wgtLinkDocBtn: 'link' };
    Object.keys(needs).forEach(id => {
      const b = document.getElementById(id);
      if (!b) return;
      const ok = pgCan(needs[id]);
      b.style.display = ok ? '' : 'none';
      b.disabled = !ok || !pgLoaded;
    });
    const note = document.getElementById('wgtReadonlyNote');
    if (note) note.style.display = can ? 'none' : '';
    // The grouped buttons disappear as a group when none of them apply.
    const group = document.getElementById('wkEditTools');
    if (group) group.style.display = (pgCan('add') || pgCan('upload') || pgCan('link')) ? '' : 'none';
    const cmt = document.getElementById('wgtCommentsToggleBtn');
    if (cmt) cmt.disabled = !pgLoaded;
    const editBtn = document.getElementById('wgtEditBtn');
    if (editBtn) editBtn.style.display = pgCan('edit') ? '' : 'none';
    const delBtn = document.getElementById('wgtDeleteBtn');
    if (delBtn) delBtn.style.display = pgCan('delete') ? '' : 'none';
    const settings = document.getElementById('wkSettingsBtn');
    if (settings) settings.style.display = pgUser.isAdmin ? '' : 'none';
    const sidebar = document.getElementById('wgtSidebar');
    if (sidebar) pgInitSidebarSortable(sidebar, !pgCan('edit'));
  }

  // ── Settings (admins): who can open the wiki and what each person may do ──
  // Edited in memory, saved in one go (saveSettings in Access.gs).
  const PG_PERM_LABELS = [
    ['add', 'Add', 'Create pages and folders'],
    ['edit', 'Edit', 'Edit pages and Google files, move pages, rename folders, highlight and comment'],
    ['upload', 'Upload', 'Upload Word, Excel, PowerPoint, PDF…'],
    ['link', 'Link', 'Link existing Google or Office files'],
    ['delete', 'Delete', 'Delete pages and folders, remove links']
  ];
  let pgSettings = null;         // { viewers, people: [{ email, admin, perms }], domain, me }
  let pgSettingsDirty = false;

  async function pgShowSettings() {
    if (!pgUser.isAdmin) return;
    pgExitDocMax();
    const contentEl = document.getElementById('wgtContent');
    if (!contentEl) return;
    pgShowingHome = false; pgShowingToc = false; pgCurrent = null; pgEditing = false; pgDocInline = false;
    pgHideCommentsPanel();
    contentEl.classList.remove('wgt-content-doc');
    contentEl.innerHTML = '<div class="wk-settings"><div class="wgt-empty-hint">Loading settings…</div></div>';
    pgRenderSidebar(pgSearchValue());
    try {
      pgSettings = await pgCall('getSettings');
      pgSettingsDirty = false;
      pgRenderSettings();
    } catch (err) {
      contentEl.innerHTML = `<div class="wgt-welcome"><h3>Couldn't open settings</h3><p class="wgt-upload-fail">${esc(pgErrMsg(err))}</p></div>`;
    }
  }

  function pgRenderSettings() {
    const contentEl = document.getElementById('wgtContent');
    if (!contentEl || !pgSettings) return;
    const st = pgSettings;
    const people = st.people;
    const colAll = key => people.length && people.every(p => p.admin || p.perms[key]);
    contentEl.innerHTML = `
      <div class="wk-settings">
        <div class="wgt-page-header">
          <div class="wk-title"><span class="wk-kind wk-kind-page">${PG_ICONS.gear}</span>
            <div class="wk-title-text"><h2>Settings</h2></div></div>
          <div class="wgt-page-actions">
            <span class="wk-settings-dirty"${pgSettingsDirty ? '' : ' hidden'}>Unsaved changes</span>
            <button type="button" class="wk-pa-ghost" id="wkSetRevert"${pgSettingsDirty ? '' : ' disabled'}>Discard</button>
            <button type="button" class="wk-pa-primary" id="wkSetSave"${pgSettingsDirty ? '' : ' disabled'}>${PG_ICONS.check}<span>Save</span></button>
          </div>
        </div>

        <section class="wk-set-card">
          <h3>Who can open the wiki</h3>
          <label class="wk-radio"><input type="radio" name="wkViewers" value="listed"${st.viewers !== 'domain' ? ' checked' : ''}>
            <span><strong>Only the people below</strong><small>Everyone else sees a “no access” page.</small></span></label>
          <label class="wk-radio"><input type="radio" name="wkViewers" value="domain"${st.viewers === 'domain' ? ' checked' : ''}>
            <span><strong>Anyone at ${esc(st.domain || 'the organisation')}</strong><small>Can read and search. Only the people below can change anything.</small></span></label>
        </section>

        <section class="wk-set-card">
          <div class="wk-set-head">
            <h3>People and permissions <span class="wk-set-count">${people.length}</span></h3>
            <form class="wk-set-add" id="wkSetAdd" autocomplete="off">
              <input type="email" id="wkSetEmail" placeholder="name@${esc(st.domain || 'example.com')}" required />
              <button type="submit" class="wk-pa-primary">${PG_ICONS.plus}<span>Add person</span></button>
            </form>
          </div>
          <div class="wk-set-table-wrap">
          <table class="wk-set-table">
            <thead><tr>
              <th class="wk-set-person">Person</th>
              <th title="Admins manage these settings and can do everything">Admin</th>
              ${PG_PERM_LABELS.map(([k, label, tip]) => `<th title="${esc(tip)}">
                <button type="button" class="wk-set-col" data-col="${k}" title="${colAll(k) ? 'Untick' : 'Tick'} ${label} for everyone">${label}</button></th>`).join('')}
              <th></th>
            </tr></thead>
            <tbody>
              ${people.map((p, i) => {
                const me = p.email === st.me;
                return `<tr${p.admin ? ' class="wk-set-admin"' : ''}>
                  <td class="wk-set-person"><div class="wk-set-who"><span class="wk-avatar wk-avatar-sm">${esc(p.email.charAt(0).toUpperCase())}</span>
                    <span class="wk-set-email">${esc(p.email)}${me ? ' <em>(you)</em>' : ''}</span></div></td>
                  <td><input type="checkbox" data-i="${i}" data-admin="1"${p.admin ? ' checked' : ''}${me ? ' disabled title="You can\u2019t remove your own admin access"' : ''}></td>
                  ${PG_PERM_LABELS.map(([k]) => `<td><input type="checkbox" data-i="${i}" data-perm="${k}"${p.admin || p.perms[k] ? ' checked' : ''}${p.admin ? ' disabled title="Admins can do everything"' : ''}></td>`).join('')}
                  <td>${me ? '' : `<button type="button" class="wk-pa wk-pa-danger" data-remove="${i}" title="Remove ${esc(p.email)}" aria-label="Remove">${PG_ICONS.trash}</button>`}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          </div>
          <p class="wk-set-legend">${PG_PERM_LABELS.map(([, label, tip]) => `<span><strong>${label}</strong> — ${esc(tip)}</span>`).join('')}</p>
        </section>
      </div>`;

    const dirty = () => { pgSettingsDirty = true; pgRenderSettings(); };
    contentEl.querySelectorAll('input[name="wkViewers"]').forEach(r => r.addEventListener('change', () => { st.viewers = r.value; dirty(); }));
    contentEl.querySelectorAll('input[data-perm]').forEach(cb => cb.addEventListener('change', () => {
      people[+cb.dataset.i].perms[cb.dataset.perm] = cb.checked; dirty();
    }));
    contentEl.querySelectorAll('input[data-admin]').forEach(cb => cb.addEventListener('change', () => {
      const p = people[+cb.dataset.i];
      p.admin = cb.checked;
      if (p.admin) PG_PERM_LABELS.forEach(([k]) => { p.perms[k] = true; });
      dirty();
    }));
    contentEl.querySelectorAll('[data-col]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.col, on = !colAll(k);
      people.forEach(p => { if (!p.admin) p.perms[k] = on; });
      dirty();
    }));
    contentEl.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
      people.splice(+b.dataset.remove, 1); dirty();
    }));
    const add = document.getElementById('wkSetAdd');
    if (add) add.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('wkSetEmail');
      const email = String(input.value || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { pgToast('That isn\u2019t an email address'); return; }
      if (people.some(p => p.email === email)) { pgToast(email + ' is already on the list'); return; }
      const perms = {};
      PG_PERM_LABELS.forEach(([k]) => { perms[k] = true; });
      people.push({ email, admin: false, perms });
      people.sort((a, b) => a.email.localeCompare(b.email));
      dirty();
      const again = document.getElementById('wkSetEmail');
      if (again) again.focus();
    });
    const revert = document.getElementById('wkSetRevert');
    if (revert) revert.addEventListener('click', () => pgShowSettings());
    const save = document.getElementById('wkSetSave');
    if (save) save.addEventListener('click', async () => {
      save.disabled = true;
      save.innerHTML = '<span>Saving…</span>';
      try {
        pgSettings = await pgCall('saveSettings', { viewers: st.viewers, people: people });
        pgSettingsDirty = false;
        pgRenderSettings();
        pgToast('Settings saved');
      } catch (err) {
        console.error(err);
        pgToast("Couldn't save: " + pgErrMsg(err), 8000);
        pgRenderSettings();
      }
    });
  }

  // Shown instead of the wiki to people who aren't on the access list.

    container.innerHTML = `
      <div class="wk-denied">

      </div>`;

  // ── Home: shown on first visit, on refresh, and from the logo ──
  const PG_PHRASES = [
    'Everything the OIS team knows, in one place.',
    'Playbooks, guides and workbooks — one search away.',
    'Write it once. Share it with the whole team.',
    'Good docs make great handoffs.',
    'Find it fast, fix it faster.',
    'Today’s notes are tomorrow’s playbook.',
    'Ask the wiki before you ask the channel.'
  ];
  const PG_TIPS = [
    () => `Press <kbd>${/Mac|iPhone|iPad/.test(navigator.platform || '') ? '⌘' : 'Ctrl'} K</kbd> anywhere to search every page, Doc, Sheet and Slides file.`,
    () => 'Drag a page in the sidebar onto a folder to move it there.',
    () => '<strong>Link</strong> adds a Google file that lives elsewhere — removing the link never deletes the file.',
    () => '<strong>✎ Edit</strong> opens Google Docs, Sheets or Slides right here — no new tab needed.',
    () => 'The number on the 💬 button is how many comments are still open on that page.',
    () => 'Upload Word, Excel or PowerPoint and Google turns it into a Doc, Sheet or Slides.'
  ];
  let pgPhraseTimer = null;

  function pgFirstName() {
    const local = String(pgUser.email || '').split('@')[0].split(/[._-]/)[0];
    return local ? local.charAt(0).toUpperCase() + local.slice(1) : '';
  }
  function pgGreeting() {
    const h = new Date().getHours();
    const part = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    const name = pgFirstName();
    return name ? part + ', ' + name : part;
  }
  function pgAgo(ms) {
    if (!ms) return '';
    const mins = Math.round((Date.now() - ms) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + ' h ago';
    const days = Math.round(hrs / 24);
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function pgShowHome() {
    const contentEl = document.getElementById('wgtContent');
    if (!contentEl) return;
    pgExitDocMax();
    pgShowingHome = true;
    pgShowingToc = false;
    pgCurrent = null;
    pgEditing = false;
    pgDocInline = false;
    pgFindClose();
    pgHideCommentsPanel();
    contentEl.classList.remove('wgt-content-doc');
    const can = pgCanEdit();

    const recent = pgPages.slice().sort((a, b) => (b.modified || 0) - (a.modified || 0)).slice(0, 6);
    const count = pred => pgPages.filter(pred).length;
    const stats = [
      { cls: 'doc', icon: 'doc', n: count(p => p.kind !== 'html' && (p.app || 'doc') === 'doc'), label: 'Docs' },
      { cls: 'sheet', icon: 'sheet', n: count(p => p.kind !== 'html' && p.app === 'sheet'), label: 'Sheets' },
      { cls: 'slide', icon: 'slide', n: count(p => p.kind !== 'html' && p.app === 'slide'), label: 'Slides' },
      { cls: 'page', icon: 'page', n: count(p => p.kind === 'html'), label: 'Wiki pages' }
    ];
    const folders = pgFolders().length - 1;
    const start = Math.floor(Math.random() * PG_PHRASES.length);
    const tip = PG_TIPS[Math.floor(Math.random() * PG_TIPS.length)]();

    contentEl.innerHTML = `
      <div class="wk-home" id="wkHomePage">
        <section class="wk-home-hero">
          <div class="wk-home-eyebrow">${esc(PG_BRAND.name)}</div>
          <h1>${esc(pgGreeting())}</h1>
          <p class="wk-home-phrase" id="wkPhrase">${esc(PG_PHRASES[start])}</p>
          <label class="wk-home-search" for="wkHomeSearch">
            ${PG_ICONS.search}
            <input id="wkHomeSearch" type="search" autocomplete="off" spellcheck="false"
                   placeholder="What are you looking for?" />
          </label>
          ${can ? `<div class="wk-home-actions">
            ${pgCan('add') ? `<button type="button" class="wk-act wk-act-primary" id="wkHomeNew">${PG_ICONS.plus}<span>New page</span></button>` : ''}
            ${pgCan('upload') ? `<button type="button" class="wk-act" id="wkHomeUpload">${PG_ICONS.upload}<span>Upload</span></button>` : ''}
            ${pgCan('link') ? `<button type="button" class="wk-act" id="wkHomeLink">${PG_ICONS.link}<span>Link a Google file</span></button>` : ''}
          </div>` : ''}
        </section>
        <div class="wk-home-grid">
          <section class="wk-home-card">
            <h3>Recently updated</h3>
            ${recent.length ? recent.map(p => `
              <a href="#" class="wk-recent" data-path="${esc(p.path)}">
                ${pgKindBadge(p)}
                <span class="wk-recent-title">${esc(p.title)}</span>
                <span class="wk-recent-when">${esc(pgAgo(p.modified))}</span>
              </a>`).join('')
              : `<div class="wk-home-empty">Nothing here yet — ${can ? 'create a page, upload a file or link a Google file to get started.' : 'pages will show up here once the team adds them.'}</div>`}
          </section>
          <section class="wk-home-card">
            <h3>At a glance</h3>
            <div class="wk-stats">
              ${stats.map(st => `<div class="wk-stat"><span class="wk-kind wk-kind-${st.cls}">${PG_ICONS[st.icon]}</span>
                <div><b>${st.n}</b><span>${st.label}</span></div></div>`).join('')}
            </div>
            <div class="wk-home-empty">${pgPages.length} page${pgPages.length === 1 ? '' : 's'} in ${folders} folder${folders === 1 ? '' : 's'}</div>
          </section>
        </div>
        <div class="wk-home-tip">${PG_ICONS.eye}<div><strong>Tip:</strong> ${tip}</div></div>
      </div>`;

    contentEl.querySelectorAll('.wk-recent').forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      const p = pgPages.find(x => x.path === a.dataset.path);
      if (p) pgOpenPage(p);
    }));
    const bind = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
    bind('wkHomeNew', () => pgCreateNewPage());
    bind('wkHomeUpload', () => { const input = document.getElementById('wgtFileInput'); if (input) input.click(); });
    bind('wkHomeLink', () => pgLinkDoc());

    // Typing here searches in the header box, which keeps the focus once the
    // results replace this page.

    if (homeSearch && header) homeSearch.addEventListener('input', () => {
      header.value = homeSearch.value;
      header.focus();
      header.setSelectionRange(header.value.length, header.value.length);

    // A new phrase every few seconds, until the reader leaves home.

      const el = document.getElementById('wkPhrase');

      el.classList.add('wk-fade');

        i = (i + 1) % PG_PHRASES.length;
        el.textContent = PG_PHRASES[i];

  function pgShowCreatePrompt() {

      <div class="wgt-welcome">
        <h3>${esc(pgFolder ? pgFolderLabel(pgFolder) : PG_SPACE)} is empty</h3>
        <p>${can
            ? 'Upload a document or create a page — it will be saved into <code>' +
              esc(pgFolder ? PG_SPACE + '/' + pgFolder : PG_SPACE) + '</code> in Google Drive.'
            : pgReadOnlyReason() === 'viewer'
              ? 'You have read-only access to this wiki.'
              : 'Sign in with your ' + esc(PG_ACCOUNT) + ' to add pages.'}</p>
        ${can ? `
          <div class="wgt-welcome-actions">
            ${pgCan('upload') ? '<button class="wgt-btn wgt-primary" id="wgtFirstUploadBtn">⭱ Upload document</button>' : ''}
            ${pgCan('add') ? '<button class="wgt-btn" id="wgtFirstPageBtn">+ New page</button>' : ''}
            ${pgCan('link') ? '<button class="wgt-btn" id="wgtFirstLinkBtn">🔗 Link Google file</button>' : ''}
            ${pgCan('add') ? '<button class="wgt-btn" id="wgtFirstFolderBtn">📁 New folder</button>' : ''}
          </div>
          <p class="wgt-welcome-hint">New pages and uploads (Word, PDF, text, Markdown, HTML) become

      const input = document.getElementById('wgtFileInput');
      if (input) input.click();
    });

    if (link) link.addEventListener('click', () => pgLinkDoc());

    if (mkdir) mkdir.addEventListener('click', () => pgCreateFolder());
