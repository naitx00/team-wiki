  // ── Sidebar ──────────────────────────────────────────────
  function pgRenderSidebar(filter) {
    const sidebarEl = document.getElementById('wgtSidebar');
    if (!sidebarEl) return;
    const q = pgSearchKey(filter);
    const searching = !!q;

    // Only bail out before the folder list has anything to show. Folders exist
    // independently of pages — an empty folder still needs to be selectable.
    if (!pgLoaded) {
      sidebarEl.innerHTML = `<div class="wgt-empty-hint">Loading pages…</div>`;
      return;
    }
    if (!pgPages.length && pgFolders().length <= 1) {
      sidebarEl.innerHTML = `
        <div class="wgt-folder-head">${esc(PG_ROOT_FOLDER)}</div>
        <div class="wgt-empty-hint">No pages yet.</div>`;
      return;
    }

    // Searching looks across every folder — a page you can't remember the
    // folder for is exactly when search matters. Browsing stays inside the
    // folder you picked. Titles match instantly; body text matches arrive
    // from the server (pgRunSearch) and fill in the rest.
    const matches = searching
      ? pgPages.filter(p => pgMatchesSearch(p, q))
      : pgPages.filter(p => (p.folder || '') === pgFolder);

    let html = '';
    const folders = pgFolders();
    if (searching) {
      html += `<div class="wgt-folder-head">${matches.length} result${matches.length === 1 ? '' : 's'} in all folders</div>`;
    } else {
      if (folders.length > 1) {
        // Accordion: closed, it is one row showing where you are. Open, it is
        // the full list. That keeps the sidebar the same height whether there
        // are three folders or thirty, leaving room for the pages below.
        html += `<button type="button" class="wgt-folder-head wgt-folder-section" id="wgtFoldersToggle"
                   aria-expanded="${!pgFoldersCollapsed}"
                   title="${pgFoldersCollapsed ? 'Choose a folder' : 'Hide the folder list'}">
            <span class="wgt-chev">${pgFoldersCollapsed ? '▸' : '▾'}</span>
            <span class="wgt-folder-current">${esc(pgFolderLabel(pgFolder))}</span>
            <span class="wgt-space-count">${folders.length - 1}</span>
          </button>`;

        // A filter appears once the list is long enough to scroll.
        const manyFolders = folders.length > 9;
        const ff = (pgFolderFilter || '').trim().toLowerCase();

        html += `<div class="wgt-folder-list"${pgFoldersCollapsed ? ' hidden' : ''}>`;
        if (!pgFoldersCollapsed && manyFolders) {
          html += `<input type="text" class="wgt-folder-filter" id="wgtFolderFilter"
                     placeholder="Filter folders…" value="${esc(pgFolderFilter || '')}" />`;
        }
        let shown = 0;
        folders.forEach(f => {
          if (pgFolderHidden(f)) return;          // an ancestor is collapsed
          // While filtering, match anywhere in the path and ignore the tree.
          if (ff && !(f || PG_ROOT_FOLDER).toLowerCase().includes(ff)) return;
          shown++;
          const count = pgPages.filter(p => (p.folder || '') === f).length;
          const depth = f ? f.split('/').length - 1 : 0;
          const hasKids = pgFolderHasChildren(f, folders);
          const twisty = hasKids
            ? `<button type="button" class="wgt-folder-twisty" data-folder-toggle="${esc(f)}"
                 title="${pgCollapsed[f] ? 'Expand' : 'Collapse'}">${pgCollapsed[f] ? '▸' : '▾'}</button>`
            : `<span class="wgt-folder-twisty wgt-folder-twisty-blank"></span>`;
          // The top level isn't a real folder on disk, so it can't be renamed
          // or deleted — only the subfolders get those controls.
          const tools = (f && (pgCan('edit') || pgCan('delete')))
            ? `<span class="wgt-folder-tools">
                 ${pgCan('edit') ? `<button type="button" class="wgt-folder-tool" data-folder-edit="${esc(f)}" title="Rename folder">✎</button>` : ''}
                 ${pgCan('delete') ? `<button type="button" class="wgt-folder-tool wgt-folder-tool-danger" data-folder-del="${esc(f)}" title="Delete folder">🗑</button>` : ''}
               </span>` : '';
          html += `<div class="wgt-folder-row${f === pgFolder ? ' active' : ''}" style="padding-left:${depth * 12}px">
              ${twisty}
              <button type="button" class="wgt-folder-item" data-folder="${esc(f)}">
                <span class="wgt-folder-name">${esc(pgFolderLabel(f))}</span>
                <span class="wgt-space-count">${count}</span>
              </button>${tools}
            </div>`;
        });
        if (!pgFoldersCollapsed && ff && !shown) {
          html += `<div class="wgt-empty-hint">No folders match "${esc(pgFolderFilter)}".</div>`;
        }
        html += `</div>`;
      }
      html += `<button type="button" class="wgt-space-title${pgShowingToc ? ' active' : ''}" data-space="${esc(pgFolder)}" title="Show a contents list for this folder">${esc(pgFolderLabel(pgFolder))}<span class="wgt-space-count">${matches.length}</span></button>`;
    }

    html += `<div class="wgt-page-list" data-space-list="${esc(pgFolder)}">`;
    matches.forEach(p => {
      const where = searching && (p.folder || '') !== ''
        ? `<span class="wgt-page-folder">${esc(pgFolderLabel(p.folder))}</span>` : '';
      html += `<a href="#" draggable="false" class="wgt-page-link${pgCurrent === p ? ' active' : ''}" data-path="${esc(p.path)}" title="${esc(p.title)} — drag onto a folder to move it"><span class="wgt-drag-dots" aria-hidden="true"></span>${pgSideIcon(p)}<span class="wgt-page-link-text">${esc(p.title)}${p.broken ? ' <span title="The wiki can no longer open this linked file">⚠</span>' : ''}${where}</span></a>`;
    });
    html += `</div>`;

    if (!matches.length) {
      html += `<div class="wgt-empty-hint">${searching
        ? 'No pages match "' + esc(filter) + '".'
        : 'This folder is empty.'}</div>`;
    }

    sidebarEl.innerHTML = html;
    sidebarEl.querySelectorAll('[data-path]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const p = pgPages.find(x => x.path === a.dataset.path);
        if (p) pgOpenPage(p);
      });
    });
    sidebarEl.querySelectorAll('[data-folder]').forEach(btn => {
      btn.addEventListener('click', () => {
        pgFolder = btn.dataset.folder;
        // Picking a folder closes the accordion — the list has done its job,
        // and the pages get the room back.
        pgFoldersCollapsed = true;
        pgFolderFilter = '';
        pgSaveFolderUi();
        pgRenderSidebar('');
        const first = pgPages.find(p => (p.folder || '') === pgFolder);
        if (first) pgOpenPage(first); else pgShowCreatePrompt();
      });
    });
    const folderFilter = document.getElementById('wgtFolderFilter');
    if (folderFilter) {
      folderFilter.addEventListener('input', () => {
        pgFolderFilter = folderFilter.value;
        pgRenderSidebar(filter);
        const again = document.getElementById('wgtFolderFilter');
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      });
      folderFilter.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { pgFolderFilter = ''; pgRenderSidebar(filter); }
      });
    }
    const sectionToggle = document.getElementById('wgtFoldersToggle');
    if (sectionToggle) sectionToggle.addEventListener('click', () => {
      pgFoldersCollapsed = !pgFoldersCollapsed;
      pgSaveFolderUi();
      pgRenderSidebar(filter);
    });
    sidebarEl.querySelectorAll('[data-folder-toggle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();                      // don't also switch folder
        const f = btn.dataset.folderToggle;
        if (pgCollapsed[f]) delete pgCollapsed[f]; else pgCollapsed[f] = true;
        pgSaveFolderUi();
        pgRenderSidebar(filter);
      });
    });
    sidebarEl.querySelectorAll('[data-folder-edit]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); pgRenameFolder(btn.dataset.folderEdit); });
    });
    sidebarEl.querySelectorAll('[data-folder-del]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); pgDeleteFolder(btn.dataset.folderDel); });
    });
    sidebarEl.querySelectorAll('[data-space]').forEach(btn => {
      btn.addEventListener('click', () => pgRenderTableOfContents(btn.dataset.space));
    });
    pgInitSidebarSortable(sidebarEl, !!q || !pgCan('edit'));
  }

  // Drag-to-reorder the page list. Disabled while a search filter is active,
  // since the visible list is then a subset and dropping into it would imply
  // an order for pages that aren't on screen.
  function pgInitSidebarSortable(sidebarEl, filtering) {
    if (typeof Sortable === 'undefined') return;

    sidebarEl.querySelectorAll('[data-space-list]').forEach(list => {
      if (list._pgSortable) { list._pgSortable.destroy(); list._pgSortable = null; }
      if (filtering) { list.classList.add('wgt-no-drag'); return; }
      list._pgSortable = new Sortable(list, {
        // Shared group so a page can also be dropped onto a folder row below.
        group: { name: 'wiki-pages', pull: true, put: true },
        animation: 180,
        delay: 120,
        delayOnTouchOnly: true,
        ghostClass: 'wgt-drag-ghost',
        chosenClass: 'wgt-drag-chosen',
        dragClass: 'wgt-drag-active',
        onStart: () => sidebarEl.classList.add('wgt-dragging'),
        onEnd: (evt) => {
          sidebarEl.classList.remove('wgt-dragging');
          if (evt.to !== evt.from) return;        // handled by the folder's onAdd
          if (evt.oldIndex === evt.newIndex) return;
          // Rebuild the saved order from the DOM across every space list, so
          // the stored order always mirrors exactly what's on screen.
          const paths = [];
          sidebarEl.querySelectorAll('[data-space-list] .wgt-page-link').forEach(a => paths.push(a.dataset.path));
          pgSaveOrder(paths);
          pgSortPages();
          pgToast('Order saved');
        }
      });
    });

    // Each folder row is its own drop target: dragging a page onto one moves
    // the file into that folder. `sort: false` and `pull: false` mean nothing
    // can be dragged back out of a row — it only ever receives.
    if (filtering || !pgCan('edit')) return;
    sidebarEl.querySelectorAll('.wgt-folder-row').forEach(row => {
      if (row._pgSortable) { row._pgSortable.destroy(); row._pgSortable = null; }
      const target = row.querySelector('[data-folder]');
      if (!target) return;
      row._pgSortable = new Sortable(row, {
        group: { name: 'wiki-pages', pull: false, put: true },
        sort: false,
        animation: 0,
        onAdd: (evt) => {
          const el = evt.item;
          const path = el && el.dataset ? el.dataset.path : null;
          el.remove();                              // the re-render rebuilds the list
          sidebarEl.classList.remove('wgt-dragging');
          if (path) pgMovePageToFolder(path, target.dataset.folder);
        }
      });
    });
  }

  // Moves a page (and its annotations) into another Drive folder.
  async function pgMovePageToFolder(pagePath, targetFolder) {
    const p = pgPages.find(x => x.path === pagePath);
    if (!p) return;
    const dest = targetFolder || '';
    if ((p.folder || '') === dest) return;
    if (!pgCan('edit')) return pgRequire('edit');
    try {
      pgToast('Moving…', 20000);
      const info = await pgCall('movePage', p.id, dest);
      // Same Drive file, new folder — the content already loaded still holds.
      Object.assign(p, { path: info.path, file: info.file, folder: info.folder, modified: info.modified });
      pgFolder = dest;
      pgSortPages();
      pgOpenPage(p);
      pgToast('Moved to ' + pgFolderLabel(dest));
    } catch (err) {
      console.error(err);
      pgToast("Couldn't move the page: " + pgErrMsg(err), 7000);
      pgRenderSidebar(pgSearchValue());   // put the dragged row back
    }
  }

  // ── Table of contents (click the space name in the sidebar) ──
  function pgRenderTableOfContents(space) {
    const contentEl = document.getElementById('wgtContent');
    if (!contentEl) return;
    contentEl.classList.remove('wgt-content-doc');
    // `space` is the folder path here ('' = top level). Follows pgPages, which
    // is already in the user's manual drag order.
    const folder = space || '';
    const pages = pgPages.filter(p => (p.folder || '') === folder);
    pgExitDocMax();
    pgShowingToc = true;
    pgShowingHome = false;
    pgCurrent = null;
    pgEditing = false;
    pgHideCommentsPanel();

    let html = `<div class="wgt-toc-header">
        <h2>${esc(pgFolderLabel(folder))}</h2>
        <div class="wgt-toc-count">${pages.length} page${pages.length === 1 ? '' : 's'}</div>
      </div>`;
    if (!pages.length) {
      html += `<div class="wgt-empty-hint">No pages yet. Click "+ New page" or upload a document.</div>`;
    } else {
      html += `<div class="wgt-toc-list">`;
      pages.forEach((p, i) => {
        const snippet = pgTruncate(p.snippet || '', 130);
        html += `<a href="#" class="wgt-toc-item" data-path="${esc(p.path)}">
            <span class="wgt-toc-num">${i + 1}.</span>
            ${pgKindBadge(p)}
            <span class="wgt-toc-body">
              <span class="wgt-toc-title">${esc(p.title)}</span>
              ${snippet ? `<div class="wgt-toc-snippet">${esc(snippet)}</div>` : ''}
            </span>
            <span class="wgt-toc-type">${esc(pgKindOf(p).label)}</span>
          </a>`;
      });
      html += `</div>`;
    }
    contentEl.innerHTML = html;
    contentEl.querySelectorAll('.wgt-toc-item').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const p = pgPages.find(x => x.path === a.dataset.path);
        if (p) pgOpenPage(p);
      });
    });
    pgRenderSidebar(pgSearchValue());
  }

  // ── Search ───────────────────────────────────────────────
  // Titles are matched here as you type. Page text lives in Drive, so the
  // server searches it (searchPages) and the hits merge in when they arrive.
  // hits: page id -> snippet; unreadable: pages the server couldn't look inside.
  let pgSearch = { q: '', pending: false, hits: {}, unreadable: [], searched: 0 };
  let pgSearchTimer = null;
  let pgSearchSeq = 0;

  function pgMatchesSearch(p, q) {
    if (pgTextMatches(pgSearchKey(p.title), q)) return true;
    if (pgSearch.q === q && pgSearch.hits[p.id] !== undefined) return true;
    // Pages already opened can be checked on the spot.
    return !!p.content && pgTextMatches(pgPlainText(p.content).toLowerCase(), q);
  }

  // The same three levels as matchScore_ in Api.gs: exact phrase, the same
  // words in order whatever the punctuation between them, or every word
  // somewhere in the text.
  function pgLoose(str) {
    return String(str).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }
  function pgTextMatches(lower, q) {
    if (!lower) return false;
    if (lower.includes(q)) return true;
    const ql = pgLoose(q);
    if (!ql) return false;
    const loose = pgLoose(lower);
    return loose.includes(ql) || ql.split(' ').every(w => loose.includes(w));
  }

  function pgRunSearch(query) {
    const q = pgSearchKey(query);
    clearTimeout(pgSearchTimer);
    if (!q) { pgSearch = { q: '', pending: false, hits: {}, unreadable: [], searched: 0 }; return; }
    if (pgSearch.q !== q) pgSearch = { q, pending: true, hits: {}, unreadable: [], searched: 0 };
    const seq = ++pgSearchSeq;
    // Wait for a pause in typing — each search is a trip to Drive.
    pgSearchTimer = setTimeout(async () => {
      try {
        const res = await pgCall('searchPages', q);
        if (seq !== pgSearchSeq) return;            // a newer search has started
        const hits = Array.isArray(res) ? res : (res && res.hits) || [];
        const map = {};
        hits.forEach(h => { map[h.id] = h.snippet || ''; });
        pgSearch = { q, pending: false, hits: map,
                     unreadable: (res && res.unreadable) || [], searched: (res && res.searched) || 0 };
        // A hit on a page this tab hasn't seen means someone added it since
        // the list loaded — fetch the list so the result can be shown.
        if ((hits || []).some(h => !pgPages.some(p => p.id === h.id))) {
          await pgLoadPages({ fresh: true, quiet: true });
          if (seq !== pgSearchSeq) return;
        }
      } catch (err) {
        if (seq !== pgSearchSeq) return;
        console.error(err);
        pgSearch = { q, pending: false, hits: {}, unreadable: [], searched: 0, failed: pgErrMsg(err) };
        pgToast('Searching page text failed: ' + pgErrMsg(err) + ' — showing title matches only', 6000);
      }
      const current = pgSearchValue();
      if (pgSearchKey(current) !== q) return;
      pgRenderSidebar(current);
      pgRenderSearchResults(current);
    }, 350);
  }

  function pgHighlightSnippet(text, query) {
    const clean = (text || '').replace(/\s+/g, ' ').trim();
    const idx = clean.toLowerCase().indexOf(query.toLowerCase());
    let snippet;
    if (idx === -1) {
      snippet = pgTruncate(clean, 140);
    } else {
      const start = Math.max(0, idx - 50);
      const end = Math.min(clean.length, idx + query.length + 50);
      snippet = (start > 0 ? '…' : '') + clean.slice(start, end) + (end < clean.length ? '…' : '');
    }
    const escSnippet = esc(snippet);
    const terms = [query].concat(pgLoose(query).split(' ')).filter(t => t && t.length > 1)
      .sort((a, b) => b.length - a.length)
      .map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!terms.length) return escSnippet;
    const re = new RegExp('(' + terms.join('|') + ')', 'ig');
    return escSnippet.replace(re, '<mark class="wgt-search-mark">$1</mark>');
  }

  function pgRenderSearchResults(query) {
    const contentEl = document.getElementById('wgtContent');
    if (!contentEl) return;
    contentEl.classList.remove('wgt-content-doc');
    const q = (query || '').trim();
    if (!q) {
      // Search cleared — restore whatever was being viewed before.
      if (pgShowingToc) pgRenderTableOfContents(pgFolder);
      else if (pgCurrent) pgRenderPageView();
      else pgShowHome();
      return;
    }
    pgExitDocMax();
    const ql = pgSearchKey(q);
    const pending = pgSearch.q === ql && pgSearch.pending;
    const matches = pgPages.filter(p => pgMatchesSearch(p, ql));
    const done = pgSearch.q === ql && !pending;
    const unreadable = done ? (pgSearch.unreadable || []) : [];
    const notice = unreadable.length
      ? `<div class="wk-search-notice">${PG_ICONS.eye}<div><strong>Couldn't look inside ${unreadable.length}
           page${unreadable.length === 1 ? '' : 's'}</strong> — ${unreadable.map(u =>
             `<span class="wk-search-notice-item">${esc(u.title)} <em>(${esc(u.reason)})</em></span>`).join(', ')}</div></div>`
      : (done && pgSearch.failed
          ? `<div class="wk-search-notice">${PG_ICONS.eye}<div><strong>Page text couldn't be searched</strong> — ${esc(pgSearch.failed)}. Only titles were checked.</div></div>`
          : '');
    if (!matches.length) {
      contentEl.innerHTML = `<div class="wgt-welcome"><h3>${pending ? 'Searching…' : 'No matches'}</h3>
        <p>${pending ? 'Looking through every page for' : 'No pages match'} "${esc(q)}"${
          done && pgSearch.searched ? ` — searched ${pgSearch.searched} page${pgSearch.searched === 1 ? '' : 's'}` : ''}.</p>${notice}</div>`;
      return;
    }
    let html = `<div class="wgt-search-results">
      <div class="wgt-search-results-header">${matches.length} page${matches.length === 1 ? '' : 's'} match "${esc(q)}"${
        pending ? ' — still searching page text…' : ''}</div>${notice}`;
    matches.forEach(p => {
      const serverSnippet = pgSearch.q === ql ? pgSearch.hits[p.id] : undefined;
      const bodyForSnippet = serverSnippet !== undefined ? serverSnippet
        : (p.content !== null ? pgPlainText(p.content) : p.snippet);
      html += `<a href="#" class="wgt-search-result" data-path="${esc(p.path)}">
        <div class="wgt-search-result-title">${pgSideIcon(p)}<span>${pgHighlightSnippet(p.title, q)}</span>${
          (p.folder || '') ? ` <span class="wgt-page-folder">in ${esc(pgFolderLabel(p.folder))}</span>` : ''}</div>
        <div class="wgt-search-result-snippet">${pgHighlightSnippet(bodyForSnippet, q)}</div>
      </a>`;
    });
    html += `</div>`;
    contentEl.innerHTML = html;
    contentEl.querySelectorAll('.wgt-search-result').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const p = pgPages.find(x => x.path === a.dataset.path);
        if (!p) return;
        const search = document.getElementById('wgtSearch');
        if (search) search.value = '';
        pgRunSearch('');
        pgRenderSidebar('');
        pgOpenPage(p);
      });
    });
  }

  // ── View / edit ──────────────────────────────────────────
  function pgOpenPage(page) {
    if (page !== pgCurrent) pgExitDocMax();
    pgShowingHome = false;
    pgCurrent = page;
    pgEditing = false;
    pgDocInline = false;
    pgShowingToc = false;
    pgFindClose();          // a find is scoped to one page
    pgRenderSidebar(pgSearchValue());
    if (page.content === null || !page.annotations) {
      pgShowPageLoading(page);
      pgEnsureContent(page).then(() => {
        if (pgCurrent === page && !pgEditing) pgShowOpenedPage();
      }, (err) => {
        console.error(err);
        if (pgCurrent !== page) return;
        const contentEl = document.getElementById('wgtContent');
        if (contentEl) contentEl.innerHTML = `
          <div class="wgt-welcome">
            <h3>Couldn't open "${esc(page.title)}"</h3>
            <p class="wgt-upload-fail">${esc(pgErrMsg(err))}</p>
            <button class="wgt-btn wgt-primary" id="wgtRetryOpen">Try again</button>
          </div>`;
        const retry = document.getElementById('wgtRetryOpen');
        if (retry) retry.addEventListener('click', () => pgOpenPage(page));
      });
      return;
    }
    pgShowOpenedPage();
  }
  function pgShowOpenedPage() {
    pgRenderPageView();
    const panel = document.getElementById('wgtCommentsPanel');
    if (panel && panel.classList.contains('wgt-open')) pgRenderCommentsPanel();
  }
  function pgShowPageLoading(page) {
    const contentEl = document.getElementById('wgtContent');
    if (!contentEl) return;
    contentEl.innerHTML = `
      <div class="wgt-page-header">${pgPageTitleHtml(page)}</div>
      <div class="wgt-empty-hint">Loading…</div>`;
    pgUpdateCommentBadge();
  }

  // Readable plain text for search snippets and the table of contents — drops
  // the leading title and any HTML tags, so Word pages don't show markup.
  function pgPlainText(content) {
    return pgMarkupToText(String(content || '')
      .replace(/^\s*#\s+.*\n+/, '')
      .replace(/<h1[^>]*>[\s\S]*?<\/h1>/i, ''));
  }
  // Same rules as markupToText_ in Api.gs, so a page matches the same way
  // whether the browser or the server checks it: formatting tags vanish
  // (a <span> mid-word mustn't split it), block tags become spaces.
  const PG_INLINE_TAGS = /<\/?(span|a|b|i|u|em|strong|sup|sub|font|s|strike|del|ins|mark|code|small|big|abbr|cite|q)\b[^>]*>/gi;
  function pgMarkupToText(html) {
    const text = html
      .replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi, ' ')
      .replace(PG_INLINE_TAGS, '')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&amp;/g, '&')
      .replace(/(\*\*|__|~~|`)/g, '');
    return pgNormalizeText(text).replace(/\s+/g, ' ').trim();
  }
  // Curly quotes, long dashes and non-breaking spaces as the plain characters
  // people type — one for one, like normalizeText_ in Api.gs.
  function pgNormalizeText(str) {
    return String(str)
      .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, '\u0027')
      .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '\u0022')
      .replace(/[\u2010\u2011\u2012\u2013\u2014\u2015\u2212]/g, '-')
      .replace(/[\u00A0\u2007\u202F]/g, ' ');
  }
  // A search query as it is compared: normalised, single-spaced, lowercase.
  function pgSearchKey(query) {
    return pgNormalizeText(query || '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  // New pages are .html. Older .md pages still work, so both formats have to be
  // handled — the extension decides, with a content sniff as a backstop.
  const PG_EXT = '.html';
  function pgIsHtmlFile(name) { return /\.html?$/i.test(name || ''); }
  function pgLooksLikeHtml(content) {
    const t = String(content || '').trimStart();
    return t.startsWith('<') && !/^\s*#\s+/m.test(t.slice(0, 400));
  }
  function pgPageIsHtml(page) {
    if (!page) return false;
    if (pgIsDocPage(page)) return true;
    return pgIsHtmlFile(page.path) || pgLooksLikeHtml(page.content);
  }
  // True for pages imported by docx-preview, which ship their own stylesheet.
  // The hub's page typography stands aside for these — see 06-wiki.css.
  // Google Doc exports (class="gdoc") carry their own stylesheet the same way.
  function pgIsNativeDoc(content) { return /class=\x22[wg]doc\x22/.test(String(content || '')); }

  // Turns page content into display HTML, whichever format it is stored in.
  //
  // The <style> blocks are lifted out before sanitising and put back after.
  // DOMPurify empties the *contents* of a style element even when the tag
  // itself is allowed — and for an imported Word document that stylesheet is
  // the entire design: font sizes, colours, typefaces, table borders and
  // shading. Losing it is why imports came through looking plain.
  //
  // The CSS is machine-generated by docx-preview and scoped under .wdoc, so it
  // can't restyle the hub. It is still swept for anything script-like first.
  function pgContentToHtml(content, isHtml) {
    const withLinks = pgResolveWikiLinks(content);
    const treatAsHtml = isHtml === undefined ? pgLooksLikeHtml(content) : isHtml;
    let raw = treatAsHtml
      ? withLinks
      : (window.marked ? marked.parse(withLinks) : withLinks);

    const sheets = [];
    raw = raw.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (m, css) => { sheets.push(css); return ''; });

    // A frame with no real source resolves to index.html, which Chrome blocks
    // on file:// ("unique security origins"). Real embeds always have an https
    // source, so anything else goes.
    raw = raw.replace(/<iframe\b[^>]*>[\s\S]*?<\/iframe>|<iframe\b[^>]*\/?>/gi,
      (tag) => /src\s*=\s*[\x22\x27]https:\/{2}/i.test(tag) ? tag : '');

    let safe = window.DOMPurify ? DOMPurify.sanitize(raw, PG_SANITIZE) : raw;

    if (sheets.length) {
      const css = sheets.join('\n')
        .replace(/<\/?[a-z][^>]*>/gi, '')        // no markup inside a stylesheet
        .replace(/javascript\s*:/gi, '')
        .replace(/expression\s*\(/gi, '')
        .replace(/@import[^;]*;/gi, '');         // no pulling in remote CSS
      safe = '<style>' + css + '</style>' + safe;
    }
    return safe;
  }

  function pgResolveWikiLinks(md) {
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, label) => {
      const clean = target.trim();
      const text = (label || clean).trim();
      const exists = pgPages.some(p => p.title.toLowerCase() === clean.toLowerCase());
      const cls = exists ? 'wgt-wikilink' : 'wgt-wikilink wgt-missing';
      return `<a href="#" class="${cls}" data-wikilink="${encodeURIComponent(clean)}">${esc(text)}</a>`;
    });
  }

  function pgRenderPageView() {
    const p = pgCurrent;
    const contentEl = document.getElementById('wgtContent');
    if (!p || !contentEl) return;
    contentEl.classList.remove('wgt-content-doc');
    if (pgIsDocPage(p)) return pgRenderDocView(p, contentEl);
    const safeHtml = pgContentToHtml(p.content, pgPageIsHtml(p));

    contentEl.innerHTML = `
      <div class="wgt-page-header">
        ${pgPageTitleHtml(p)}
        <div class="wgt-page-actions">
          ${pgIconBtn('wgtFindBtn', 'search', 'Find in this page (Ctrl+F)')}
          ${pgIconBtn('wgtDeleteBtn', 'trash', 'Delete page', 'wk-pa-danger')}
          <span class="wk-pa-sep"></span>
          ${pgCommentsBtnHtml()}
          ${pgPrimaryBtn('wgtEditBtn', 'pen', 'Edit')}
        </div>
      </div>
      <div class="wgt-doc-canvas">
        <div class="wgt-doc-page">
          <div class="wgt-view${pgIsNativeDoc(p.content) ? ' wgt-doc-native' : ''}" id="wgtView">${safeHtml}</div>
        </div>
      </div>
    `;
    const editBtn = document.getElementById('wgtEditBtn');
    const delBtn = document.getElementById('wgtDeleteBtn');
    const findBtn = document.getElementById('wgtFindBtn');
    if (editBtn) editBtn.addEventListener('click', pgRenderPageEditor);
    pgBindCommentsBtn();
    if (delBtn) delBtn.addEventListener('click', () => pgDeletePage(p));
    if (findBtn) findBtn.addEventListener('click', () => pgFindOpen());
    pgFindReset();

    pgApplyAnnotations(p);
    pgUpdateCommentBadge();
    pgApplyPermissions();
  }

  function pgRenderDocView(p, contentEl) {
    const editing = pgDocInline && pgCan('edit');
    contentEl.classList.add('wgt-content-doc');
    contentEl.innerHTML = `
      <div class="wgt-page-header">
        ${pgPageTitleHtml(p)}
        <div class="wgt-page-actions">
          ${editing
            ? `<span class="wk-autosave"><span class="wk-autosave-dot"></span>Saved automatically</span>
               ${pgMaxButtonsHtml()}
               ${pgIconBtn('wgtNewTabDocBtn', 'external', 'Open this Doc in its own tab')}
               <span class="wk-pa-sep"></span>
               ${pgCommentsBtnHtml()}
               ${pgPrimaryBtn('wgtDoneDocBtn', 'check', 'Done', 'Done editing — back to the view')}`
            : `${pgMaxButtonsHtml()}
               ${pgIconBtn('wgtOpenDocBtn', 'external', 'Open in ' + pgAppInfo(p).name)}
               ${p.kind === 'link'
                 ? pgIconBtn('wgtDeleteBtn', 'unlink', 'Remove link (the ' + pgNoun(p) + ' itself is kept)', 'wk-pa-danger')
                 : pgIconBtn('wgtDeleteBtn', 'trash', 'Delete page', 'wk-pa-danger')}
               <span class="wk-pa-sep"></span>
               ${pgCommentsBtnHtml()}
               ${pgCan('edit') ? pgPrimaryBtn('wgtEditDocBtn', 'pen', 'Edit', 'Edit here, in the ' + pgAppInfo(p).name + ' editor') : ''}`}
        </div>
      </div>
      <div class="wgt-gdoc-wrap${editing ? ' wgt-gdoc-editing' : ''}">
        <iframe class="wgt-gdoc-frame" id="wgtDocFrame" src="${esc(editing ? pgDocEditUrl(p) : pgDocPreviewUrl(p))}"
                title="${esc(p.title)}" allow="clipboard-read; clipboard-write" loading="eager"></iframe>
        <div class="wgt-gdoc-hint">${editing
          ? 'Editor not loading, or says you can only view? You need edit access to this ' + pgNoun(p) + ' — '
          : 'Blank or asking for access? You need view access to this ' + pgNoun(p) + ' in Google Drive — '}
          <a href="${esc(p.docUrl)}" target="_blank" rel="noopener">open it in ${esc(pgAppInfo(p).name.replace('Google Doc', 'Google Docs').replace('Google Sheet', 'Google Sheets'))}</a>.</div>
      </div>`;
    const bind = (id, fn) => { const b = document.getElementById(id); if (b) b.addEventListener('click', fn); };
    bind('wgtEditDocBtn', () => pgSetDocInline(true));
    bind('wgtDoneDocBtn', () => pgSetDocInline(false));
    bind('wgtOpenDocBtn', () => pgOpenInDocs(p));
    bind('wgtNewTabDocBtn', () => { pgSetDocInline(false); pgOpenInDocs(p); });
    bind('wgtDeleteBtn', () => pgDeletePage(p));
    bind('wgtMaxBtn', () => pgSetDocMax(pgDocMax ? '' : 'max'));
    bind('wgtFullBtn', () => pgSetDocMax(pgDocMax === 'full' ? '' : 'full'));
    pgBindCommentsBtn();
    pgFindReset();
    pgUpdateCommentBadge();
    pgApplyPermissions();
    pgLoadDocComments(p, 60000);
  }

  // ── Maximize / full screen for Google file pages ──
  // Maximize: the page (its header buttons and the Google frame) fills the
  // browser window over the wiki's header and sidebar. Full screen: the same,
  // plus the browser's own full screen. It stays on while switching between
  // viewing and inline editing, and ends when another page or view opens.
  let pgDocMax = '';             // '' | 'max' | 'full'

  function pgMaxButtonsHtml() {
    const max = !!pgDocMax, full = pgDocMax === 'full';
    return pgIconBtn('wgtMaxBtn', max ? 'restore' : 'maximize', max ? 'Restore (Esc)' : 'Maximize — fill the window') +
           pgIconBtn('wgtFullBtn', full ? 'exitFullscreen' : 'fullscreen', full ? 'Exit full screen (Esc)' : 'Full screen');
  }

  async function pgSetDocMax(mode) {
    if (mode === 'full' && !document.fullscreenElement) {
      try {
        if (!document.fullscreenEnabled) throw new Error('not allowed here');
        await document.documentElement.requestFullscreen();
      } catch (e) {
        // Some embeds don't allow it; maximizing still gives most of the room.
        mode = 'max';
        pgToast('Full screen isn’t available here — maximized instead', 4000);
      }
    }
    if (mode !== 'full' && document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (e) { /* already out */ }
    }
    pgDocMax = mode || '';
    document.body.classList.toggle('wk-doc-max', !!pgDocMax);
    pgSyncMaxButtons();
  }

  // Swaps the two buttons' icon and label without re-rendering the page,
  // which would reload the Google frame.
  function pgSyncMaxButtons() {
    const max = document.getElementById('wgtMaxBtn');
    const full = document.getElementById('wgtFullBtn');
    const set = (b, icon, label) => { if (!b) return; b.innerHTML = PG_ICONS[icon]; b.title = label; b.setAttribute('aria-label', label); };
    set(max, pgDocMax ? 'restore' : 'maximize', pgDocMax ? 'Restore (Esc)' : 'Maximize — fill the window');
    set(full, pgDocMax === 'full' ? 'exitFullscreen' : 'fullscreen', pgDocMax === 'full' ? 'Exit full screen (Esc)' : 'Full screen');
  }

  // Called whenever something other than the same Google file takes the pane.
  function pgExitDocMax() {
    if (!pgDocMax) return;
    pgSetDocMax('');
  }

  // Leaving the browser's full screen (Esc, F11) restores the page too.
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && pgDocMax === 'full') pgSetDocMax('');
  });
  // Esc restores a maximized page (while the focus is on the wiki, not inside
  // the Google frame, which keeps its own keys).
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && pgDocMax === 'max' && !document.getElementById('wgtDialog')) pgSetDocMax('');
  });

  // Switches the open Doc between Google's viewer and its editor. While the
  // editor is up, pgEditing holds off background refreshes that would reload
  // the frame mid-sentence.
  function pgSetDocInline(on) {
    pgDocInline = !!on;
    pgEditing = pgDocInline;
    pgRenderPageView();   // leaving the editor loads a fresh viewer = the saved version
    if (!pgDocInline) {
      pgLoadPages({ fresh: true, quiet: true });   // pick up a renamed title
      if (pgCurrent) pgLoadDocComments(pgCurrent, 0);   // and comments added while editing
    }
  }

  // ── Rich-text editor helpers ────────────────────────────
  let pgSavedRange = null;
  function pgSaveSelection() {
    const editorEl = document.getElementById('wgtEditor');
    const sel = window.getSelection();
    if (!editorEl || !sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    if (editorEl.contains(range.commonAncestorContainer)) pgSavedRange = range.cloneRange();
  }
  function pgRestoreSelection() {
    if (!pgSavedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(pgSavedRange);
  }
  // Wraps the current selection in a <span style="..."> — used for font
  // family/size and text/highlight color, which Markdown can't express natively.
  function pgWrapSelectionStyle(styleStr) {
    const editorEl = document.getElementById('wgtEditor');
    const sel = window.getSelection();
    if (!editorEl || !sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    if (!editorEl.contains(range.commonAncestorContainer)) return;
    try {
      const span = document.createElement('span');
      span.setAttribute('style', styleStr);
      span.appendChild(range.extractContents());
      range.insertNode(span);
      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      sel.removeAllRanges();
      sel.addRange(newRange);
      pgSavedRange = newRange.cloneRange();
    } catch (e) { console.warn('pgWrapSelectionStyle failed', e); }
  }
  // Applies a style (e.g. line-height) to the nearest block ancestor of the
  // selection/cursor, rather than wrapping inline text.
  function pgApplyBlockStyle(styleStr) {
    const editorEl = document.getElementById('wgtEditor');
    const sel = window.getSelection();
    if (!editorEl || !sel || sel.rangeCount === 0) return;
    let node = sel.getRangeAt(0).commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    const blockTags = ['P', 'H1', 'H2', 'H3', 'H4', 'LI', 'BLOCKQUOTE', 'DIV'];
    while (node && node !== editorEl && !blockTags.includes(node.nodeName)) node = node.parentElement;
    if (!node || node === editorEl) return;
    const [prop, val] = styleStr.split(':');
    const camel = prop.trim().replace(/-([a-z])/g, (m, c) => c.toUpperCase());
    node.style[camel] = val.trim();
  }

  // ── Insert menu: image, media, table, link, symbols ──────
  // Inserts HTML at the cursor, restoring the selection the editor had before
  // the user reached for the toolbar.
  function pgInsertHtml(html) {
    const editorEl = document.getElementById('wgtEditor');
    if (!editorEl) return;
    editorEl.focus();
    pgRestoreSelection();
    document.execCommand('insertHTML', false, html);
    pgSaveSelection();
  }

  // Simple tables become pipe tables; anything with merged cells or styling is
  // left as HTML so nothing is silently lost.
  function pgTableToMarkdown(table) {
    const rows = Array.from(table.querySelectorAll('tr'));
    if (!rows.length) return table.outerHTML;
    const complex = rows.some(tr => Array.from(tr.children).some(c =>
      c.getAttribute('style') || (c.colSpan > 1) || (c.rowSpan > 1) || c.querySelector('table, ul, ol, p + p')
    ));
    const widths = rows.map(r => r.children.length);
    if (complex || Math.min.apply(null, widths) !== Math.max.apply(null, widths)) return table.outerHTML;

    const cell = (c) => (c.textContent || '').replace(/\s+/g, ' ').replace(/\|/g, '\\|').trim();
    const body = rows.map(r => Array.from(r.children).map(cell));
    const cols = body[0].length;
    const hasHeader = !!rows[0].querySelector('th');
    const head = hasHeader ? body.shift() : new Array(cols).fill('');
    let md = '| ' + head.join(' | ') + ' |\n';
    md += '| ' + new Array(cols).fill('---').join(' | ') + ' |\n';
    body.forEach(r => { md += '| ' + r.join(' | ') + ' |\n'; });
    return md.trim();
  }

  // Lightweight modal used by the insert tools. `fields` is a list of
  // { name, label, type, value, placeholder, options }.
  // `opts`: { confirm: button label, danger: true for destructive actions,
  //           intro: a line of explanation above the fields }
  function pgDialog(title, fields, onSubmit, opts) {
    const o = opts || {};
    const host = document.getElementById('wgtShell') || document.body;
    const old = document.getElementById('wgtDialog');
    if (old) old.remove();

    const wrap = document.createElement('div');
    wrap.className = 'wgt-dialog-backdrop';
    wrap.id = 'wgtDialog';
    const rows = (fields || []).map(f => {
      const id = 'wgtDlg_' + f.name;
      if (f.type === 'select') {
        const opts = (f.options || []).map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
        return `<label class="wgt-dlg-row"><span>${esc(f.label)}</span><select id="${id}">${opts}</select></label>`;
      }
      if (f.type === 'file') {
        return `<label class="wgt-dlg-row"><span>${esc(f.label)}</span><input type="file" id="${id}" accept="${esc(f.accept || '')}"></label>`;
      }
      return `<label class="wgt-dlg-row"><span>${esc(f.label)}</span><input type="${esc(f.type || 'text')}" id="${id}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}"></label>`;
    }).join('');

    wrap.innerHTML = `
      <div class="wgt-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="wgt-dlg-title">${esc(title)}</div>
        <div class="wgt-dlg-body">
          ${o.intro ? `<p class="wgt-dlg-intro">${o.intro}</p>` : ''}
          ${rows}
        </div>
        <div class="wgt-dlg-actions">
          <button class="wgt-btn" data-dlg="cancel">Cancel</button>
          <button class="wgt-btn ${o.danger ? 'wgt-danger' : 'wgt-primary'}" data-dlg="ok">${esc(o.confirm || 'Insert')}</button>
        </div>
      </div>`;
    host.appendChild(wrap);

    const close = () => wrap.remove();
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) close(); });
    wrap.querySelector('[data-dlg="cancel"]').addEventListener('click', close);
    wrap.querySelector('[data-dlg="ok"]').addEventListener('click', async () => {
      const values = {};
      (fields || []).forEach(f => {
        const el = document.getElementById('wgtDlg_' + f.name);
        values[f.name] = f.type === 'file' ? (el.files && el.files[0]) : el.value;
      });
      close();
      try { await onSubmit(values); }
      catch (err) { console.error(err); pgToast((o.confirm || 'Action') + ' failed: ' + err.message, 6000); }
    });
    wrap.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') {
        e.preventDefault();
        wrap.querySelector('[data-dlg="ok"]').click();
      }
    });
    const first = wrap.querySelector('input, select');
    if (first) first.focus();
  }

  // Images are embedded as data URIs so a page never depends on a file path
  // that could move. Large images are downscaled first to keep pages sane.
  function pgImageFileToDataUrl(file, maxDim, maxBytes) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('could not read file'));
      reader.onload = () => {
        const src = reader.result;
        if (file.size <= maxBytes && !/^data:image\/(png|jpeg|gif|webp)/.test(src)) return resolve(src);
        const img = new Image();
        img.onerror = () => resolve(src);
        img.onload = () => {
          if (img.width <= maxDim && img.height <= maxDim && file.size <= maxBytes) return resolve(src);
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const isPng = /^data:image\/png/.test(src);
          resolve(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.85));
        };
        img.src = src;
      };
      reader.readAsDataURL(file);
    });
  }

  function pgInsertImage() {
    pgDialog('Insert image', [
      { name: 'file', label: 'Upload a file', type: 'file', accept: 'image/*' },
      { name: 'url', label: '…or paste an image URL', type: 'text', placeholder: 'https://…' },
      { name: 'alt', label: 'Alt text', type: 'text', placeholder: 'Description (for accessibility)' },
      { name: 'width', label: 'Width', type: 'select', options: [
        { value: '', label: 'Original size' }, { value: '25%', label: '25%' },
        { value: '50%', label: '50%' }, { value: '75%', label: '75%' }, { value: '100%', label: 'Full width' }
      ] }
    ], async (v) => {
      let src = (v.url || '').trim();
      if (v.file) {
        pgToast('Processing image…');
        src = await pgImageFileToDataUrl(v.file, 1400, 300 * 1024);
      }
      if (!src) { pgToast('No image chosen'); return; }
      if (!/^(https?:|data:image\/)/i.test(src)) { pgToast('Only https or uploaded images are allowed'); return; }
      const style = v.width ? ` style="width:${v.width}"` : '';
      pgInsertHtml(`<img src="${esc(src)}" alt="${esc(v.alt || '')}"${style}>`);
      pgToast('Image inserted');
    });
  }

  // Recognises YouTube/Vimeo share links and embeds them properly; anything
  // else that looks like a video/audio file becomes a native player.
  function pgMediaEmbedHtml(url) {
    const u = url.trim();
    if (!/^https:\/{2}/i.test(u)) return null;
    let m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/i);
    if (m) return `<iframe src="https://www.youtube.com/embed/${m[1]}" width="560" height="315" frameborder="0" allowfullscreen></iframe>`;
    m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
    if (m) return `<iframe src="https://player.vimeo.com/video/${m[1]}" width="560" height="315" frameborder="0" allowfullscreen></iframe>`;
    if (/\.(mp4|webm|ogv|mov)(\?|$)/i.test(u)) return `<video src="${esc(u)}" controls width="560"></video>`;
    if (/\.(mp3|wav|ogg|m4a)(\?|$)/i.test(u)) return `<audio src="${esc(u)}" controls></audio>`;
    return null;
  }

  function pgInsertMedia() {
    pgDialog('Insert video or audio', [
      { name: 'url', label: 'Link', type: 'text', placeholder: 'YouTube, Vimeo, or a .mp4 / .mp3 URL' }
    ], (v) => {
      const html = pgMediaEmbedHtml(v.url || '');
      if (!html) { pgToast('Not a recognised media link (must be https)'); return; }
      pgInsertHtml(html + '<p><br></p>');
      pgToast('Media inserted');
    });
  }

  function pgInsertTable() {
    pgDialog('Insert table', [
      { name: 'rows', label: 'Rows (body)', type: 'number', value: '3' },
      { name: 'cols', label: 'Columns', type: 'number', value: '3' },
      { name: 'header', label: 'Header row', type: 'select', options: [
        { value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' }
      ] }
    ], (v) => {
      const rows = Math.max(1, Math.min(50, parseInt(v.rows, 10) || 3));
      const cols = Math.max(1, Math.min(12, parseInt(v.cols, 10) || 3));
      let html = '<table>';
      if (v.header === 'yes') {
        html += '<thead><tr>';
        for (let c = 0; c < cols; c++) html += `<th>Heading ${c + 1}</th>`;
        html += '</tr></thead>';
      }
      html += '<tbody>';
      for (let r = 0; r < rows; r++) {
        html += '<tr>';
        for (let c = 0; c < cols; c++) html += '<td>&nbsp;</td>';
        html += '</tr>';
      }
      html += '</tbody></table><p><br></p>';
      pgInsertHtml(html);
      pgToast('Table inserted');
    });
  }

  function pgInsertLink() {
    const sel = window.getSelection();
    const selected = sel && !sel.isCollapsed ? sel.toString().trim() : '';
    pgDialog('Insert link', [
      { name: 'url', label: 'Address', type: 'text', placeholder: 'https://…  or  a wiki page title' },
      { name: 'text', label: 'Text to show', type: 'text', value: selected }
    ], (v) => {
      const url = (v.url || '').trim();
      if (!url) return;
      const label = (v.text || '').trim() || url;
      if (/^https?:\/{2}/i.test(url)) {
        pgInsertHtml(`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`);
      } else {
        // Not a URL — treat it as a link to another wiki page.
        pgInsertHtml(`<a href="#" data-wikilink="${encodeURIComponent(url)}" class="wgt-wikilink">${esc(label)}</a>`);
      }
      pgToast('Link inserted');
    });
  }

  // ── Editing an existing table ────────────────────────────
  // Finds the cell the caret currently sits in, if any.
  function pgCurrentCell() {
    const editorEl = document.getElementById('wgtEditor');
    const sel = window.getSelection();
    if (!editorEl || !sel || sel.rangeCount === 0) return null;
    let node = sel.getRangeAt(0).startContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    if (!node || !editorEl.contains(node)) return null;
    const cell = node.closest ? node.closest('td, th') : null;
    if (!cell || !editorEl.contains(cell)) return null;
    const row = cell.parentElement;
    const table = cell.closest('table');
    if (!table) return null;
    return { cell, row, table, index: Array.prototype.indexOf.call(row.children, cell) };
  }

  // All rows of a table in visual order, across thead/tbody/tfoot.
  function pgTableRows(table) { return Array.from(table.querySelectorAll('tr')); }

  function pgTableInsertRow(ctx, after) {
    const { row, table } = ctx;
    const cols = Math.max.apply(null, pgTableRows(table).map(r => r.children.length));
    const tr = document.createElement('tr');
    for (let i = 0; i < cols; i++) {
      const td = document.createElement('td');
      td.innerHTML = '&nbsp;';
      tr.appendChild(td);
    }
    // A new row never belongs in the header — put it at the top of the body.
    if (row.parentElement.tagName === 'THEAD' && after) {
      let tbody = table.querySelector('tbody');
      if (!tbody) { tbody = document.createElement('tbody'); table.appendChild(tbody); }
      tbody.insertBefore(tr, tbody.firstChild);
    } else if (row.parentElement.tagName === 'THEAD' && !after) {
      row.parentElement.parentElement.insertBefore(tr, row.parentElement);
    } else {
      row.parentElement.insertBefore(tr, after ? row.nextSibling : row);
    }
    pgFocusCell(tr.children[Math.min(ctx.index, tr.children.length - 1)]);
  }

  function pgTableInsertCol(ctx, after) {
    const at = ctx.index + (after ? 1 : 0);
    pgTableRows(ctx.table).forEach(r => {
      const isHead = r.parentElement.tagName === 'THEAD' || r.children[0].tagName === 'TH';
      const cell = document.createElement(isHead ? 'th' : 'td');
      cell.innerHTML = isHead ? 'Heading' : '&nbsp;';
      if (at >= r.children.length) r.appendChild(cell);
      else r.insertBefore(cell, r.children[at]);
    });
    const rowCells = ctx.row.children;
    pgFocusCell(rowCells[Math.min(at, rowCells.length - 1)]);
  }

  function pgTableDeleteRow(ctx) {
    const rows = pgTableRows(ctx.table);
    if (rows.length <= 1) return pgTableDelete(ctx);
    const section = ctx.row.parentElement;
    const next = ctx.row.nextElementSibling || ctx.row.previousElementSibling;
    ctx.row.remove();
    if (section.tagName !== 'TABLE' && !section.children.length) section.remove();
    if (next) pgFocusCell(next.children[Math.min(ctx.index, next.children.length - 1)]);
    pgUpdateTableTools();
  }

  function pgTableDeleteCol(ctx) {
    const rows = pgTableRows(ctx.table);
    const cols = Math.max.apply(null, rows.map(r => r.children.length));
    if (cols <= 1) return pgTableDelete(ctx);
    rows.forEach(r => { if (r.children[ctx.index]) r.children[ctx.index].remove(); });
    const rowCells = ctx.row.children;
    if (rowCells.length) pgFocusCell(rowCells[Math.min(ctx.index, rowCells.length - 1)]);
    pgUpdateTableTools();
  }

  function pgTableDelete(ctx) {
    ctx.table.remove();
    pgHideTableTools();
    pgToast('Table deleted');
  }

  // Turns the first row into a header row, or back into a normal row.
  function pgTableToggleHeader(ctx) {
    const table = ctx.table;
    const thead = table.querySelector('thead');
    if (thead) {
      const tr = thead.querySelector('tr');
      if (tr) {
        Array.from(tr.children).forEach(th => {
          const td = document.createElement('td');
          td.innerHTML = th.innerHTML;
          if (th.getAttribute('style')) td.setAttribute('style', th.getAttribute('style'));
          th.replaceWith(td);
        });
        let tbody = table.querySelector('tbody');
        if (!tbody) { tbody = document.createElement('tbody'); table.appendChild(tbody); }
        tbody.insertBefore(tr, tbody.firstChild);
      }
      thead.remove();
    } else {
      const first = pgTableRows(table)[0];
      if (!first) return;
      Array.from(first.children).forEach(td => {
        const th = document.createElement('th');
        th.innerHTML = td.innerHTML;
        if (td.getAttribute('style')) th.setAttribute('style', td.getAttribute('style'));
        td.replaceWith(th);
      });
      const head = document.createElement('thead');
      head.appendChild(first);
      table.insertBefore(head, table.firstChild);
    }
    pgUpdateTableTools();
  }

  function pgFocusCell(cell) {
    if (!cell) return;
    const range = document.createRange();
    range.selectNodeContents(cell);
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    pgSavedRange = range.cloneRange();
    pgUpdateTableTools();
  }

  function pgHideTableTools() {
    const el = document.getElementById('wgtTableTools');
    if (el) el.style.display = 'none';
  }

  // Shows the table bar above whichever table the caret is inside; hides it
  // as soon as the caret leaves.
  function pgUpdateTableTools() {
    const bar = document.getElementById('wgtTableTools');
    if (!bar) return;
    if (!pgEditing) { bar.style.display = 'none'; return; }
    const ctx = pgCurrentCell();
    if (!ctx) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    const r = ctx.table.getBoundingClientRect();
    const top = r.top - bar.offsetHeight - 6;
    bar.style.top = Math.max(8, top) + 'px';
    bar.style.left = Math.max(8, r.left) + 'px';
  }

  function pgWireTableTools() {
    const bar = document.getElementById('wgtTableTools');
    const editorEl = document.getElementById('wgtEditor');
    if (!bar || !editorEl) return;
    bar.querySelectorAll('[data-tt]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => {
        const ctx = pgCurrentCell();
        if (!ctx) { pgHideTableTools(); return; }
        switch (btn.dataset.tt) {
          case 'row-above':  pgTableInsertRow(ctx, false); break;
          case 'row-below':  pgTableInsertRow(ctx, true);  break;
          case 'col-left':   pgTableInsertCol(ctx, false); break;
          case 'col-right':  pgTableInsertCol(ctx, true);  break;
          case 'header':     pgTableToggleHeader(ctx);     break;
          case 'del-row':    pgTableDeleteRow(ctx);        break;
          case 'del-col':    pgTableDeleteCol(ctx);        break;
          case 'del-table':  pgTableDelete(ctx);           break;
        }
      });
    });
    ['keyup', 'mouseup', 'focus', 'input'].forEach(ev =>
      editorEl.addEventListener(ev, () => setTimeout(pgUpdateTableTools, 0)));
    editorEl.addEventListener('blur', () => setTimeout(() => {
      if (!document.activeElement || !document.activeElement.closest('#wgtTableTools')) pgHideTableTools();
    }, 150));
    // Tab moves to the next cell, like a spreadsheet.
    editorEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const ctx = pgCurrentCell();
      if (!ctx) return;
      e.preventDefault();
      const cells = Array.from(ctx.table.querySelectorAll('td, th'));
      const i = cells.indexOf(ctx.cell);
      const next = cells[i + (e.shiftKey ? -1 : 1)];
      if (next) pgFocusCell(next);
      else if (!e.shiftKey) { pgTableInsertRow(ctx, true); }
    });
  }

  const PG_SYMBOL_GROUPS = [
    ['Common',    ['©', '®', '™', '§', '¶', '†', '‡', '•', '·', '…', '–', '—', '“', '”', '‘', '’', '«', '»']],
    ['Arrows',    ['←', '→', '↑', '↓', '↔', '⇐', '⇒', '⇔', '↵', '⟶', '➜', '▶', '◀', '▲', '▼']],
    ['Marks',     ['✓', '✔', '✗', '✘', '☑', '☐', '★', '☆', '⚑', '⚠', 'ℹ', '❗', '❓', '⏳', '🔒']],
    ['Maths',     ['±', '×', '÷', '≠', '≈', '≤', '≥', '∞', '√', '∑', '∏', '∆', '°', '′', '″', '½', '¼', '¾']],
    ['Currency',  ['€', '£', '¥', '¢', '₹', '₱', '₩', '₽', '$']],
    ['Greek',     ['α', 'β', 'γ', 'δ', 'ε', 'θ', 'λ', 'μ', 'π', 'σ', 'φ', 'ω', 'Ω', 'Δ', 'Σ', 'Φ']]
  ];

  function pgToggleSymbolPalette(anchorBtn) {
    const existing = document.getElementById('wgtSymbols');
    if (existing) { existing.remove(); return; }
    const host = document.getElementById('wgtShell') || document.body;
    const pal = document.createElement('div');
    pal.className = 'wgt-symbols';
    pal.id = 'wgtSymbols';
    pal.innerHTML = PG_SYMBOL_GROUPS.map(([name, chars]) =>
      `<div class="wgt-sym-group"><div class="wgt-sym-label">${esc(name)}</div><div class="wgt-sym-grid">` +
      chars.map(c => `<button type="button" class="wgt-sym" data-sym="${esc(c)}">${esc(c)}</button>`).join('') +
      `</div></div>`
    ).join('');
    host.appendChild(pal);

    const r = anchorBtn.getBoundingClientRect();
    const hr = host.getBoundingClientRect();
    pal.style.left = Math.max(8, Math.min(r.left - hr.left, hr.width - 320)) + 'px';
    pal.style.top = (r.bottom - hr.top + 6) + 'px';

    pal.querySelectorAll('.wgt-sym').forEach(b => {
      b.addEventListener('mousedown', (e) => e.preventDefault());
      b.addEventListener('click', () => { pgInsertHtml(b.dataset.sym); });
    });
    setTimeout(() => {
      const away = (e) => {
        if (!pal.contains(e.target) && e.target !== anchorBtn) { pal.remove(); document.removeEventListener('mousedown', away); }
      };
      document.addEventListener('mousedown', away);
    }, 0);
  }

  // Reflects the formatting at the caret back into the toolbar — the bold button
  // lights up inside bold text, the font/size boxes show what's actually there.
  function pgSyncToolbarState() {
    const editorEl = document.getElementById('wgtEditor');
    const toolbar = document.getElementById('wgtRteToolbar');
    if (!editorEl || !toolbar || !pgEditing) return;
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    let node = sel.getRangeAt(0).startContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    if (!node || !editorEl.contains(node)) return;

    ['bold', 'italic', 'underline', 'strikeThrough', 'insertUnorderedList',
     'insertOrderedList', 'justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'
    ].forEach(cmd => {
      const btn = toolbar.querySelector(`[data-cmd="${cmd}"]`);
      if (!btn) return;
      let on = false;
      try { on = document.queryCommandState(cmd); } catch (e) {}
      btn.classList.toggle('wgt-active', !!on);
    });

    const cs = window.getComputedStyle(node);
    const sizeBox = document.getElementById('wgtFontSize');
    if (sizeBox && document.activeElement !== sizeBox) {
      const px = parseFloat(cs.fontSize) || 0;
      if (px) sizeBox.value = String(Math.round(px * 0.75 * 10) / 10); // px -> pt
    }
    const fontSel = document.getElementById('wgtFontFamily');
    if (fontSel) {
      const fam = (cs.fontFamily || '').split(',')[0].replace(/[\x27\x22]/g, '').toLowerCase();
      const match = Array.from(fontSel.options).find(o =>
        o.value.split(',')[0].replace(/[\x27\x22]/g, '').toLowerCase() === fam);
      if (match) fontSel.value = match.value;
    }
    const blockSel = document.getElementById('wgtBlockFormat');
    if (blockSel) {
      let b = node;
      const tags = ['H1', 'H2', 'H3', 'H4', 'BLOCKQUOTE', 'P'];
      while (b && b !== editorEl && !tags.includes(b.nodeName)) b = b.parentElement;
      const tag = b && b !== editorEl ? b.nodeName : 'P';
      if (Array.from(blockSel.options).some(o => o.value === tag)) blockSel.value = tag;
    }
  }

  function pgWireRteToolbar() {
    const toolbar = document.getElementById('wgtRteToolbar');
    const editorEl = document.getElementById('wgtEditor');
    if (!toolbar || !editorEl) return;
    try { document.execCommand('styleWithCSS', false, false); } catch (e) {}

    editorEl.addEventListener('mouseup', pgSaveSelection);
    editorEl.addEventListener('keyup', pgSaveSelection);
    editorEl.addEventListener('focus', pgSaveSelection);
    ['keyup', 'mouseup', 'focus'].forEach(ev =>
      editorEl.addEventListener(ev, () => setTimeout(pgSyncToolbarState, 0)));

    // Docs-style shortcut: Ctrl/Cmd+K inserts a link.
    editorEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        pgSaveSelection();
        pgInsertLink();
      }
    });

    toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => {
        editorEl.focus();
        pgRestoreSelection();
        document.execCommand(btn.dataset.cmd, false, null);
        pgSaveSelection();
      });
    });

    const blockFormat = document.getElementById('wgtBlockFormat');
    if (blockFormat) {
      blockFormat.addEventListener('mousedown', pgSaveSelection);
      blockFormat.addEventListener('change', () => {
        editorEl.focus();
        pgRestoreSelection();
        document.execCommand('formatBlock', false, blockFormat.value);
        pgSaveSelection();
      });
    }
    const fontFamily = document.getElementById('wgtFontFamily');
    if (fontFamily) {
      fontFamily.addEventListener('mousedown', pgSaveSelection);
      fontFamily.addEventListener('change', () => {
        if (!fontFamily.value) return;
        editorEl.focus();
        pgRestoreSelection();
        pgWrapSelectionStyle('font-family:' + fontFamily.value);
      });
    }
    // Font size behaves like the Docs stepper: a typed box with − / + buttons,
    // in points rather than pixels.
    const fontSize = document.getElementById('wgtFontSize');
    const applySize = (pt) => {
      const v = Math.max(6, Math.min(96, parseFloat(pt) || 11));
      if (fontSize) fontSize.value = String(v);
      editorEl.focus();
      pgRestoreSelection();
      pgWrapSelectionStyle('font-size:' + v + 'pt');
    };
    if (fontSize) {
      fontSize.addEventListener('mousedown', pgSaveSelection);
      fontSize.addEventListener('change', () => applySize(fontSize.value));
      fontSize.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); applySize(fontSize.value); }
        if (e.key === 'ArrowUp') { e.preventDefault(); applySize((parseFloat(fontSize.value) || 11) + 1); }
        if (e.key === 'ArrowDown') { e.preventDefault(); applySize((parseFloat(fontSize.value) || 11) - 1); }
      });
    }
    [['wgtSizeDown', -1], ['wgtSizeUp', 1]].forEach(([id, delta]) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); pgSaveSelection(); });
      btn.addEventListener('click', () => applySize((parseFloat(fontSize && fontSize.value) || 11) + delta));
    });
    const textColor = document.getElementById('wgtTextColor');
    if (textColor) {
      textColor.addEventListener('mousedown', pgSaveSelection);
      textColor.addEventListener('change', () => {
        editorEl.focus();
        pgRestoreSelection();
        pgWrapSelectionStyle('color:' + textColor.value);
      });
    }
    const hiliteColor = document.getElementById('wgtHiliteColor');
    if (hiliteColor) {
      hiliteColor.addEventListener('mousedown', pgSaveSelection);
      hiliteColor.addEventListener('change', () => {
        editorEl.focus();
        pgRestoreSelection();
        pgWrapSelectionStyle('background-color:' + hiliteColor.value);
      });
    }
    const clearBtn = document.getElementById('wgtClearFormat');
    if (clearBtn) {
      clearBtn.addEventListener('mousedown', (e) => e.preventDefault());
      clearBtn.addEventListener('click', () => {
        editorEl.focus();
        pgRestoreSelection();
        document.execCommand('removeFormat', false, null);
      });
    }
    const lineSpacing = document.getElementById('wgtLineSpacing');
    if (lineSpacing) {
      lineSpacing.addEventListener('mousedown', pgSaveSelection);
      lineSpacing.addEventListener('change', () => {
        if (!lineSpacing.value) return;
        pgRestoreSelection();
        pgApplyBlockStyle('line-height:' + lineSpacing.value);
        lineSpacing.value = '';
      });
    }

    // Insert menu. mousedown/preventDefault keeps the caret where it was so the
    // content lands at the cursor rather than at the start of the document.
    [
      ['wgtInsertImage',  pgInsertImage],
      ['wgtInsertMedia',  pgInsertMedia],
      ['wgtInsertTable',  pgInsertTable],
      ['wgtInsertLink',   pgInsertLink],
      ['wgtInsertRule',   () => pgInsertHtml('<hr><p><br></p>')]
    ].forEach(([id, fn]) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('mousedown', (e) => { e.preventDefault(); pgSaveSelection(); });
      btn.addEventListener('click', fn);
    });
    const symBtn = document.getElementById('wgtInsertSymbol');
    if (symBtn) {
      symBtn.addEventListener('mousedown', (e) => { e.preventDefault(); pgSaveSelection(); });
      symBtn.addEventListener('click', () => pgToggleSymbolPalette(symBtn));
    }

    // Paste as plain-ish text: strips Word/Google Docs wrapper markup that would
    // otherwise drag in fonts and classes, but keeps images pasted from files.
    editorEl.addEventListener('paste', (e) => {
      const html = e.clipboardData && e.clipboardData.getData('text/html');
      if (!html) return;
      e.preventDefault();
      const clean = window.DOMPurify
        ? DOMPurify.sanitize(html, { ADD_ATTR: ['style'], ADD_DATA_URI_TAGS: ['img'], FORBID_TAGS: ['style', 'meta', 'link'] })
        : html.replace(/<[^>]+>/g, '');
      document.execCommand('insertHTML', false, clean);
      pgSaveSelection();
    });

    pgWireTableTools();
  }
