  async function pgSavePage() {
    const p = pgCurrent;
    const editor = document.getElementById('wgtEditor');
    if (!p || !editor) return;
    if (!pgCan('edit')) return pgRequire('edit');
    let newContent;
    if (pgPageIsHtml(p)) {
      // Pages are HTML now, so save what the editor is already holding.
      // Converting to Markdown here would undo the formatting.
      newContent = editor.innerHTML;
    } else {
      // A legacy .md page — keep it Markdown rather than silently changing
      // the format of a file someone may be reading outside the wiki.
      await pgLoadTurndownLib();
      try {
        newContent = pgTurndown ? pgTurndown.turndown(editor.innerHTML) : editor.innerText;
      } catch (err) {
        console.error(err);
        newContent = editor.innerText;
      }
    }
    await pgCommitSave(p, newContent, false);
  }

  // `force` skips the check for someone else having saved in the meantime —
  // only ever passed after the reader has been told and chosen to overwrite.
  async function pgCommitSave(p, newContent, force) {
    const btn = document.getElementById('wgtSaveBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span>Saving…</span>'; }
    const resetBtn = () => {
      const b = document.getElementById('wgtSaveBtn');
      if (b) { b.disabled = false; b.innerHTML = PG_ICONS.check + '<span>Save</span>'; }
    };
    try {
      const res = await pgCall('savePage', p.id, newContent, p.rev, !!force);
      if (res.conflict) {
        resetBtn();
        // The editor stays open behind the dialog, so nothing is lost either way.
        pgDialog('This page changed while you were editing', [], () => pgCommitSave(p, newContent, true), {
          confirm: 'Overwrite with my version',
          danger: true,
          intro: 'Someone else saved <strong>' + esc(p.title) + '</strong> at ' + esc(pgFmtTime(res.modified)) +
                 '. Saving now replaces their changes with yours.<br><br>Cancel to keep editing — copy ' +
                 'anything you need, then open the page again to see their version.'
        });
        return;
      }
      Object.assign(p, {
        content: newContent, title: res.title, snippet: res.snippet,
        rev: res.rev, modified: res.modified
      });
      pgSortPages();
      pgEditing = false;
      pgHideTableTools();
      pgToast('Saved');
      pgRenderSidebar(pgSearchValue());
      pgCurrent = p;
      pgRenderPageView();
    } catch (err) {
      console.error(err);
      resetBtn();
      pgToast('Save failed: ' + pgErrMsg(err), 8000);
    }
  }

  function pgDeletePage(p) {
    if (!pgCan('delete')) return pgRequire('delete');
    if (p.kind === 'link') {
      pgDialog('Remove link', [], () => pgDoDeletePage(p), {
        confirm: 'Remove link',
        danger: true,
        intro: 'Remove <strong>' + esc(p.title) + '</strong> from the wiki? Only the link goes — ' +
               'the ' + esc(p.office ? pgNoun(p) : pgAppInfo(p).name) + ' itself is not deleted or changed.'
      });
      return;
    }
    pgDialog('Delete page', [], () => pgDoDeletePage(p), {
      confirm: 'Delete page',
      danger: true,
      intro: 'Delete <strong>' + esc(p.title) + '</strong>? It moves to Google Drive\'s trash, ' +
             'where the folder\'s owner can restore it for 30 days.'
    });
  }

  async function pgDoDeletePage(p) {
    try {
      await pgCall('deletePage', p.id);
      pgPages = pgPages.filter(x => x !== p);
      pgCurrent = null;
      pgHideCommentsPanel();
      pgRenderSidebar(pgSearchValue());
      const next = pgPages.find(x => (x.folder || '') === pgFolder);
      if (next) pgOpenPage(next); else pgShowCreatePrompt();
      pgToast('Deleted');
    } catch (err) {
      console.error(err);
      pgToast('Delete failed: ' + pgErrMsg(err), 7000);
    }
  }

  // Creates a Drive folder inside whichever folder is open, then switches to
  // it — so the next upload or new page lands there.
  // Keep folder names human-readable — strip only what a filesystem refuses.
  function pgCleanFolderName(raw) {
    return String(raw || '').trim().replace(/[\\/:*?\x22<>|]/g, '').replace(/\s+/g, ' ').trim();
  }

  function pgCreateFolder() {
    if (!pgCan('add')) return pgRequire('add');
    pgDialog('New folder', [
      { name: 'name', label: 'Folder name', type: 'text', placeholder: 'e.g. QA Templates' }
    ], (v) => pgDoCreateFolder(v.name), {
      confirm: 'Create folder',
      intro: pgFolder
        ? 'Created inside <strong>' + esc(pgFolderLabel(pgFolder)) + '</strong>.'
        : 'Created in <strong>' + esc(PG_SPACE) + '</strong>. Uploads go to whichever folder is open.'
    });
  }

  async function pgDoCreateFolder(raw) {
    const name = pgCleanFolderName(raw);
    if (!name) { pgToast('That name can\'t be used for a folder'); return; }
    const path = pgFolder ? pgFolder + '/' + name : name;
    if (pgFolders().indexOf(path) !== -1) {
      pgToast('"' + name + '" already exists');
      pgFolder = path;
      pgRenderSidebar('');
      pgShowCreatePrompt();
      return;
    }
    try {
      await pgCall('createFolder', path);
      if (pgFolderList.indexOf(path) === -1) pgFolderList.push(path);
      pgFolder = path;
      pgRenderSidebar('');
      pgShowCreatePrompt();
      pgToast('Created folder "' + name + '"');
    } catch (err) {
      console.error(err);
      pgToast("Couldn't create the folder: " + pgErrMsg(err), 7000);
    }
  }

  // ── Renaming and deleting folders ───────────────────────
  function pgRenameFolder(path) {
    if (!pgCan('edit')) return pgRequire('edit');
    if (!path) return;
    pgDialog('Rename folder', [
      { name: 'name', label: 'Folder name', type: 'text', value: pgFolderLabel(path) }
    ], (v) => pgDoRenameFolder(path, v.name), { confirm: 'Rename' });
  }

  async function pgDoRenameFolder(path, raw) {
    const name = pgCleanFolderName(raw);
    if (!name || name === pgFolderLabel(path)) return;
    const parentPath = path.split('/').slice(0, -1).join('/');
    const newPath = parentPath ? parentPath + '/' + name : name;
    if (pgFolders().indexOf(newPath) !== -1) { pgToast('"' + name + '" already exists'); return; }

    try {
      pgToast('Renaming…', 30000);
      await pgCall('renameFolder', path, name);
      if (pgFolder === path || pgFolder.indexOf(path + '/') === 0) {
        pgFolder = newPath + pgFolder.slice(path.length);
      }
      await pgLoadPages({ fresh: true, quiet: true });   // every path under it changed
      pgToast('Renamed to "' + name + '"');
    } catch (err) {
      console.error(err);
      pgToast("Couldn't rename the folder: " + pgErrMsg(err), 7000);
    }
  }

  function pgDeleteFolder(path) {
    if (!pgCan('delete')) return pgRequire('delete');
    if (!path) return;
    const count = pgPages.filter(p => (p.folder || '') === path || (p.folder || '').indexOf(path + '/') === 0).length;
    pgDialog('Delete folder', [], () => pgDoDeleteFolder(path), {
      confirm: 'Delete folder',
      danger: true,
      intro: 'Delete <strong>' + esc(pgFolderLabel(path)) + '</strong>' +
        (count ? ' and the ' + count + ' page' + (count === 1 ? '' : 's') + ' inside it' : '') +
        '? The folder moves to Google Drive\'s trash, where its owner can restore it for 30 days.'
    });
  }

  async function pgDoDeleteFolder(path) {
    try {
      await pgCall('deleteFolder', path);
      const parentPath = path.split('/').slice(0, -1).join('/');
      if (pgFolder === path || pgFolder.indexOf(path + '/') === 0) pgFolder = parentPath;
      await pgLoadPages({ fresh: true });
      pgToast('Deleted folder');
    } catch (err) {
      console.error(err);
      pgToast("Couldn't delete the folder: " + pgErrMsg(err), 7000);
    }
  }

  function pgCreateNewPage(prefillTitle) {
    if (!pgCan('add')) return pgRequire('add');
    if (prefillTitle) return pgDoCreateNewPage(prefillTitle);
    pgDialog('New page', [
      { name: 'title', label: 'Page title', type: 'text', placeholder: 'e.g. Banner QA checklist' }
    ], (v) => pgDoCreateNewPage(v.title), {
      confirm: 'Create page',
      intro: 'Saved in <strong>' + esc(pgFolderLabel(pgFolder)) + '</strong>.'
    });
  }

  // Adds a page the server has just created to the list, with the content we
  // already hold so opening it needs no second trip.
  function pgAddCreatedPage(info, content) {
    const page = pgPageFromRow(info);
    if (!pgIsDocPage(page)) {
      page.content = content;
      page.annotations = { highlights: [], comments: [] };
    }
    pgPages.push(page);
    return page;
  }

  // New pages are Google Docs, opened straight into the embedded editor.
  async function pgDoCreateNewPage(title) {
    if (!title || !title.trim()) return;
    try {
      pgToast('Creating…', 20000);
      const info = await pgCall('createDoc', pgFolder, title.trim(), '<h1>' + esc(title.trim()) + '</h1><p></p>');
      const page = pgAddCreatedPage(info, null);
      pgSortPages();
      pgOpenPage(page);
      pgSetDocInline(true);
      pgToast('Created "' + page.title + '" — start writing', 5000);
    } catch (err) {
      console.error(err);
      pgToast("Couldn't create page: " + pgErrMsg(err), 7000);
    }
  }

  // ── Google Docs: open, link, and pick up edits ──────────
  let pgDocEditPending = null;   // the Doc page last sent to Google Docs

  function pgOpenInDocs(page) {
    pgDocEditPending = page;
    window.open(page.docUrl, '_blank', 'noopener');
  }
  // Called when the reader comes back to this tab: show the Doc as it is now.
  function pgRefreshEditedDoc() {
    const page = pgDocEditPending;
    if (!page) return false;
    pgDocEditPending = null;
    delete pgDocComments[page.id];
    if (pgCurrent === page && !pgSearchValue()) pgRenderPageView();   // fresh viewer = latest version
    return true;
  }

  function pgLinkDoc() {
    if (!pgCan('link')) return pgRequire('link');
    pgDialog('Link a Google file', [
      { name: 'url', label: 'Google Docs, Sheets, Slides — or a Word, Excel or PowerPoint file in Drive', type: 'text', placeholder: 'https://docs.google.com/…/d/…' }
    ], (v) => pgDoLinkDoc(v.url), {
      confirm: 'Add to wiki',
      intro: 'Adds it to <strong>' + esc(pgFolderLabel(pgFolder)) + '</strong>. The file stays where it is, ' +
             'with its owner and sharing unchanged — readers need access to it in Google to view or edit it.'
    });
  }

  async function pgDoLinkDoc(url) {
    if (!url || !url.trim()) return;
    try {
      pgToast('Linking…', 20000);
      const info = await pgCall('linkDoc', pgFolder, url.trim());
      const page = pgAddCreatedPage(info, null);
      pgSortPages();
      pgOpenPage(page);
      pgToast('Linked "' + page.title + '"');
    } catch (err) {
      console.error(err);
      pgToast("Couldn't link that file: " + pgErrMsg(err), 8000);
    }
  }

  // ── Upload & convert to HTML ────────────────────────────
  // Everything becomes HTML on the way in. HTML is what the editor and the
  // viewer both work in, so storing it avoids a lossy round trip through
  // Markdown — which is what used to flatten Word formatting.
  async function pgConvertToHtml(file) {
    const name = file.name.toLowerCase();

    if (name.endsWith('.html') || name.endsWith('.htm')) {
      let html = await file.text();
      // A saved web page is a whole document — keep only what goes in the body.
      const body = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (body) html = body[1];
      html = html.replace(/<(script|style|meta|link|title)[^>]*>[\s\S]*?<\/\1>/gi, '')
                 .replace(/<(meta|link)[^>]*>/gi, '');
      html = pgTidyDocxHtml(html);
      if (!/<h1[\s>]/i.test(html)) {
        html = '<h1>' + esc(pgTitleFromFilename(file.name)) + '</h1>\n' + html;
      }
      return html;
    }
    if (name.endsWith('.docx')) {
      return await pgDocxToHtml(file);
    }
    if (name.endsWith('.md') || name.endsWith('.markdown')) {
      const text = await file.text();
      return pgMarkdownToHtml(text, file.name);
    }
    if (name.endsWith('.txt')) {
      const text = await file.text();
      const paras = text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean)
        .map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('\n');
      return '<h1>' + esc(pgTitleFromFilename(file.name)) + '</h1>\n' + paras;
    }
    if (name.endsWith('.pdf')) {
      // The PDF reader reconstructs layout as Markdown; render it once here so
      // the stored page is HTML like everything else.
      return pgMarkdownToHtml(await pgPdfToMarkdown(file), file.name);
    }
    throw new Error('Unsupported file type — use .docx, .pdf, .txt, .md or .html');
  }

  async function pgMarkdownToHtml(md, filename) {
    await pgLoadViewLibs();
    const html = window.marked ? marked.parse(md) : '<pre>' + esc(md) + '</pre>';
    if (/<h1[\s>]/i.test(html)) return html;
    return '<h1>' + esc(pgTitleFromFilename(filename || 'Untitled')) + '</h1>\n' + html;
  }

  // ── Word → HTML ─────────────────────────────────────────
  // Two converters, tried in order:
  //
  //   docx-preview — reads the same XML Word does and reproduces the document's
  //     actual design: fonts, sizes, colours, table borders and shading,
  //     numbering, indents, images. This is what keeps an imported page looking
  //     like the original.
  //
  //   mammoth — the fallback. It is a *semantic* converter by design and throws
  //     away direct formatting, so pages come through plain. Only used when the
  //     faithful renderer can't load (no internet on first use, say).
  async function pgDocxToHtml(file) {
    try {
      const faithful = await pgDocxRenderFaithful(file);
      if (faithful) return faithful;
    } catch (err) {
      console.warn('docx-preview failed, falling back to mammoth', err);
      pgToast('Full-formatting import unavailable — importing with basic formatting', 5000);
    }
    return await pgDocxViaMammoth(file);
  }

  async function pgDocxRenderFaithful(file) {
    // docx-preview needs JSZip, which the hub already uses elsewhere.
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js');
    if (!window.docx || typeof window.docx.renderAsync !== 'function') return null;

    const bodyEl = document.createElement('div');
    const styleEl = document.createElement('div');
    await window.docx.renderAsync(file, bodyEl, styleEl, {
      className: 'wdoc',
      inWrapper: false,          // our own page sheet is the wrapper
      ignoreWidth: true,         // flow into that sheet rather than Word's page width
      ignoreHeight: true,
      ignoreFonts: false,        // keep the document's typefaces
      breakPages: false,
      ignoreLastRenderedPageBreak: true,
      useBase64URL: true,        // blob: URLs die on reload — inline the images
      renderHeaders: false,
      renderFooters: false,
      trimXmlDeclaration: true
    });

    // Word can carry embedded objects that come through as frames with no
    // source. An empty src resolves back to index.html, which Chrome refuses to
    // load in a frame from a file:// page — hence the "unique security origins"
    // error. None of it is content worth keeping, so drop it here.
    bodyEl.querySelectorAll('iframe, frame, object, embed').forEach(el => el.remove());
    bodyEl.querySelectorAll('img').forEach(img => {
      const src = img.getAttribute('src');
      if (!src || !src.trim()) img.remove();       // would render as a broken image
    });
    bodyEl.querySelectorAll('[src=""], [href=""]').forEach(el => {
      el.removeAttribute('src');
      el.removeAttribute('href');
    });

    const html = (bodyEl.innerHTML || '').trim();
    if (!html) return null;
    // styleEl holds <style> blocks whose rules are scoped under .wdoc — that
    // stylesheet carries the document's sizes, colours, fonts and table styling.
    const css = styleEl.innerHTML || '';
    console.info('[wiki] docx imported with full formatting (' +
                 Math.round((css.length + html.length) / 1024) + 'KB, ' +
                 (css ? 'stylesheet kept' : 'no stylesheet') + ')');
    return css + '\n<div class="wdoc">' + html + '</div>';
  }

  async function pgDocxViaMammoth(file) {
    await pgLoadUploadLibs();
    if (!window.mammoth) throw new Error('docx converter not loaded');
    const arrayBuffer = await file.arrayBuffer();

    // Mammoth keeps semantic structure and drops direct formatting by default.
    // This map pulls back the parts Word users actually rely on.
    const styleMap = [
      "u => u",
      "strike => s",
      "p[style-name='Title'] => h1:fresh",
      "p[style-name='Subtitle'] => h2:fresh",
      "p[style-name='Quote'] => blockquote:fresh",
      "p[style-name='Intense Quote'] => blockquote:fresh"
    ];

    let result;
    try {
      result = await mammoth.convertToHtml({ arrayBuffer }, { styleMap, includeDefaultStyleMap: true });
    } catch (e) {
      // A style map this browser's mammoth build dislikes shouldn't lose the import.
      console.warn('docx style map rejected, falling back to defaults', e);
      result = await mammoth.convertToHtml({ arrayBuffer });
    }

    let html = (result && result.value) || '';
    html = pgTidyDocxHtml(html);
    if (!/<h1[\s>]/i.test(html)) {
      html = '<h1>' + esc(pgTitleFromFilename(file.name)) + '</h1>\n' + html;
    }
    return html;
  }

  // Cleans up the debris Word tends to leave behind.
  function pgTidyDocxHtml(html) {
    return html
      // Headings Word left empty because the text lived in a nested list.
      .replace(/<(h[1-6])>(\s|&nbsp;|<br\s*\/?>)*<\/\1>/gi, '')
      // A heading whose entire content is bold is just a heading.
      .replace(/<(h[1-6])>\s*<strong>([\s\S]*?)<\/strong>\s*<\/\1>/gi, '<$1>$2</$1>')
      .replace(/<p>(\s|&nbsp;)*<\/p>/gi, '')
      .trim();
  }

  // ── PDF → Markdown, layout-aware ────────────────────────
  // Rather than dumping every text run into one blob, this reconstructs the
  // visual structure of the PDF: lines are rebuilt from glyph positions,
  // headings are inferred from relative font size, bold/italic runs are
  // detected from the embedded font names, lists keep their bullets/numbers,
  // centered lines stay centered, and paragraph breaks come from vertical gaps.
  function pgPdfFontFlags(page, content) {
    const flags = {};
    const names = new Set((content.items || []).map(it => it.fontName).filter(Boolean));
    names.forEach(fn => {
      let nm = '';
      try {
        const f = page.commonObjs.get(fn);
        nm = (f && (f.name || f.loadedName)) || '';
      } catch (e) { /* font object not resolved — fall back to style info */ }
      if (!nm) nm = (content.styles && content.styles[fn] && content.styles[fn].fontFamily) || '';
      flags[fn] = {
        bold: /bold|black|heavy|semibold|demibold/i.test(nm),
        italic: /italic|oblique/i.test(nm)
      };
    });
    return flags;
  }

  // Turns the positioned glyph runs of one line into Markdown, merging adjacent
  // runs that share styling and inserting spaces where the PDF left a visual gap.
  function pgPdfLineToMarkdown(items) {
    let out = '', buf = '', bufBold = false, bufItalic = false, prev = null;
    const flush = () => {
      if (!buf) return;
      const core = buf.trim();
      if (core) {
        let wrapped = core;
        if (bufBold) wrapped = '**' + wrapped + '**';
        if (bufItalic) wrapped = '*' + wrapped + '*';
        out += (/\s$/.test(out) || !out ? '' : ' ') + wrapped + (/\s$/.test(buf) ? ' ' : '');
      } else if (buf && out && !/\s$/.test(out)) out += ' ';
      buf = '';
    };
    items.forEach(it => {
      let s = it.str;
      if (!s) return;
      if (prev) {
        const gap = it.x - (prev.x + prev.w);
        if (gap > Math.max(1, prev.size * 0.2) && !/\s$/.test(buf) && !/^\s/.test(s)) s = ' ' + s;
      }
      if (buf && (it.bold !== bufBold || it.italic !== bufItalic)) flush();
      if (!buf) { bufBold = it.bold; bufItalic = it.italic; }
      buf += s;
      prev = it;
    });
    flush();
    return out.replace(/\s+/g, ' ').trim();
  }

  async function pgPdfPageLines(page) {
    const content = await page.getTextContent();
    const flags = pgPdfFontFlags(page, content);
    const viewport = page.getViewport({ scale: 1 });
    const lines = [];
    (content.items || []).forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      const size = Math.abs(it.transform[3]) || it.height || 10;
      const f = flags[it.fontName] || {};
      let line = lines.find(l => Math.abs(l.y - y) <= Math.max(1.5, size * 0.4));
      if (!line) { line = { y, items: [] }; lines.push(line); }
      line.items.push({ str: it.str, x, w: it.width || 0, size, bold: !!f.bold, italic: !!f.italic });
    });
    lines.forEach(l => {
      l.items.sort((a, b) => a.x - b.x);
      l.size = Math.max.apply(null, l.items.map(i => i.size));
      l.x = Math.min.apply(null, l.items.map(i => i.x));
      l.right = Math.max.apply(null, l.items.map(i => i.x + i.w));
      l.allBold = l.items.every(i => i.bold);
      l.text = pgPdfLineToMarkdown(l.items);
    });
    lines.sort((a, b) => b.y - a.y);
    return { lines: lines.filter(l => l.text), pageWidth: viewport.width };
  }

  // Scanned pages have no extractable text — embed a rendered image so the page
  // still looks like the original instead of coming through blank.
  async function pgPdfPageToImage(page) {
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas.toDataURL('image/jpeg', 0.72);
  }

  async function pgPdfToMarkdown(file) {
    await pgLoadUploadLibs();
    if (!window.pdfjsLib) throw new Error('pdf converter not loaded');
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    // Pass 1: read every page, and work out the document's body text size so
    // heading detection compares against the actual body copy, not a guess.
    const pageData = [];
    const sizeWeight = {};
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const data = await pgPdfPageLines(page);
      data.page = page;
      pageData.push(data);
      data.lines.forEach(l => {
        const key = Math.round(l.size * 2) / 2;
        sizeWeight[key] = (sizeWeight[key] || 0) + l.text.length;
      });
    }
    let bodySize = 0, bestWeight = -1;
    Object.keys(sizeWeight).forEach(k => {
      if (sizeWeight[k] > bestWeight) { bestWeight = sizeWeight[k]; bodySize = parseFloat(k); }
    });
    if (!bodySize) bodySize = 11;

    // Pass 2: turn each page's lines into Markdown blocks.
    let md = '';
    let titleUsed = false;
    for (let i = 0; i < pageData.length; i++) {
      const { lines, pageWidth, page } = pageData[i];
      if (i > 0) md += '\n---\n\n';

      if (!lines.length) {
        try {
          md += '![Page ' + (i + 1) + '](' + (await pgPdfPageToImage(page)) + ')\n\n';
        } catch (e) { console.warn('page render failed', e); }
        continue;
      }

      let para = null, prevLine = null;
      const flushPara = () => {
        if (para && para.text.trim()) md += para.text.trim() + '\n\n';
        para = null;
      };
      lines.forEach((l, idx) => {
        const ratio = l.size / bodySize;
        const bulletMatch = l.text.match(/^([•●○▪◦*•●◦▪]|-)\s+(.*)$/);
        const numberMatch = l.text.match(/^(\d{1,2})[.)]\s+(.*)$/);
        const isHeading = ratio >= 1.14 || (l.allBold && ratio >= 1.02 && l.text.length < 90);
        const gap = prevLine ? (prevLine.y - l.y) : 0;
        const newBlock = !prevLine || gap > l.size * 1.75;
        // A short line centred on the page is treated as centred text.
        const centre = (l.x + l.right) / 2;
        const isCentered = pageWidth > 0 && l.x > pageWidth * 0.12 &&
          Math.abs(centre - pageWidth / 2) < pageWidth * 0.06 &&
          (l.right - l.x) < pageWidth * 0.75;

        if (isHeading || bulletMatch || numberMatch || newBlock) flushPara();

        const nextText = (lines[idx + 1] || {}).text || '';
        const nextIsListItem = /^([•●○▪◦*-]|\d{1,2}[.)])\s/.test(nextText);

        if (bulletMatch) {
          md += '- ' + bulletMatch[2].trim() + '\n' + (nextIsListItem ? '' : '\n');
        } else if (numberMatch) {
          md += numberMatch[1] + '. ' + numberMatch[2].trim() + '\n' + (nextIsListItem ? '' : '\n');
        } else if (isHeading) {
          let level = ratio >= 1.7 ? 1 : ratio >= 1.38 ? 2 : ratio >= 1.18 ? 3 : 4;
          if (level === 1 && titleUsed) level = 2;
          if (level === 1) titleUsed = true;
          const heading = l.text.replace(/^\*+|\*+$/g, '').trim();
          md += (isCentered
            ? '<h' + level + ' style="text-align:center">' + heading + '</h' + level + '>'
            : '#'.repeat(level) + ' ' + heading) + '\n\n';
        } else if (isCentered) {
          md += '<p style="text-align:center">' + l.text + '</p>\n\n';
        } else {
          // Continuation of the current paragraph — PDFs hard-wrap every line,
          // so re-join them unless the vertical gap says otherwise.
          if (!para) para = { text: l.text };
          else para.text += ' ' + l.text;
        }
        prevLine = l;
      });
      flushPara();
    }

    md = md.replace(/\n{3,}/g, '\n\n').trim();
    return md.match(/^\s*#\s+/) ? md : '# ' + pgTitleFromFilename(file.name) + '\n\n' + md;
  }

  async function pgHandleUpload(fileList) {
    // A FileList, not an array — copy it before doing anything array-ish.
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (!pgCan('upload')) return pgRequire('upload');

    const imported = [];
    const failed = [];
    const folder = pgFolder;   // import into the folder being browsed
    for (const file of files) {
      pgToast('Converting ' + file.name + '…', 120000);
      try {
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        let info;
        if (ext === 'md' || ext === 'markdown') {
          // Google can't read Markdown — render it here, then convert the HTML.
          const html = await pgConvertToHtml(file);
          info = await pgCall('createDoc', folder, pgTitleFromFilename(file.name), html);
        } else {
          // Everything else goes to Google as-is; its converter keeps Word
          // formatting better than the browser can.
          info = await pgCall('importFile', folder, file.name, await pgFileToBase64(file));
        }
        imported.push(pgAddCreatedPage(info, null));
      } catch (err) {
        console.error('import failed:', file.name, err);
        failed.push({ name: file.name, error: pgErrMsg(err) });
      }
    }

    pgSortPages();
    pgRenderSidebar(pgSearchValue());

    // Only claim success when something actually landed.
    if (imported.length && !failed.length) {
      pgToast(imported.length === 1
        ? 'Imported "' + imported[imported.length - 1].title + '"'
        : 'Imported ' + imported.length + ' documents');
      pgOpenPage(imported[imported.length - 1]);
      return;
    }
    pgShowUploadReport(imported, failed);
  }

  function pgFileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('could not read ' + file.name));
      reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ''));
      reader.readAsDataURL(file);
    });
  }

  // Failures deserve more than a toast that disappears — this stays on screen
  // with the real reason and what to do about it.
  function pgShowUploadReport(imported, failed) {
    const contentEl = document.getElementById('wgtContent');
    if (failed.length) pgToast(failed.length + ' import' + (failed.length === 1 ? '' : 's') + ' failed', 6000);
    if (!contentEl) return;

    const guess = (msg) => {
      const m = (msg || '').toLowerCase();
      if (m.includes('edit access') || m.includes('read-only')) return 'Ask the wiki\'s owner to give you edit access.';
      if (m.includes('10 mb')) return 'Try a version of the document with smaller or fewer images.';
      if (m.includes('not loaded') || m.includes('converter')) return 'The converter is loaded from the internet on first use — check your connection and try again.';
      if (m.includes('unsupported')) return 'Supported: Word, PDF, text, Markdown, HTML (→ Doc); Excel, CSV (→ Sheet); PowerPoint (→ Slides).';
      return 'The full error is in the browser console (F12).';
    };

    contentEl.innerHTML = `
      <div class="wgt-welcome">
        <h3>${failed.length ? "Couldn't import " + (failed.length === 1 ? 'that file' : failed.length + ' files') : 'Import finished'}</h3>
        ${imported.length ? `<p>${imported.length} page${imported.length === 1 ? '' : 's'} imported successfully.</p>` : ''}
        ${failed.map(f => `
          <p class="wgt-upload-fail"><strong>${esc(f.name)}</strong><br>${esc(f.error)}</p>
          <p class="wgt-welcome-hint">${guess(f.error)}</p>`).join('')}
        ${imported.length ? `<button class="wgt-btn wgt-primary" id="wgtOpenImported">Open imported page</button>` : ''}
      </div>`;
    const btn = document.getElementById('wgtOpenImported');
    if (btn && imported.length) btn.addEventListener('click', () => pgOpenPage(imported[imported.length - 1]));
  }

  // ── Highlight/comment text-anchoring engine ─────────────
  function pgBuildTextMap(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const map = []; let full = ''; let n;
    while ((n = walker.nextNode())) { const start = full.length; full += n.nodeValue; map.push({ node: n, start, end: full.length }); }
    return { full, map };
  }
  function pgLocateQuote(full, map, quote, prefix, suffix) {
    if (!quote) return null;
    let searchFrom = 0, best = null;
    while (true) {
      const idx = full.indexOf(quote, searchFrom);
      if (idx === -1) break;
      const before = full.slice(Math.max(0, idx - (prefix || '').length), idx);
      const after = full.slice(idx + quote.length, idx + quote.length + (suffix || '').length);
      const score = (before === (prefix || '') ? 1 : 0) + (after === (suffix || '') ? 1 : 0);
      if (!best || score > best.score) best = { idx, score };
      if (score === 2) break;
      searchFrom = idx + 1;
    }
    if (!best) return null;
    return pgOffsetsToRange(map, best.idx, best.idx + quote.length);
  }
  function pgOffsetsToRange(map, start, end) {
    let startNode = null, startOffset = 0, endNode = null, endOffset = 0;
    for (const m of map) {
      if (startNode === null && start >= m.start && start <= m.end) { startNode = m.node; startOffset = start - m.start; }
      if (end >= m.start && end <= m.end) { endNode = m.node; endOffset = end - m.start; break; }
    }
    if (!startNode || !endNode) return null;
    return { startNode, startOffset, endNode, endOffset };
  }
  function pgTryWrap(container, quote, prefix, suffix, makeWrapper) {
    if (!quote) return false;
    const { full, map } = pgBuildTextMap(container);
    const loc = pgLocateQuote(full, map, quote, prefix, suffix);
    if (!loc) return false;
    try {
      const range = document.createRange();
      range.setStart(loc.startNode, loc.startOffset);
      range.setEnd(loc.endNode, loc.endOffset);
      const wrapper = makeWrapper(range.extractContents());
      range.insertNode(wrapper);
      return true;
    } catch (e) { console.warn("Couldn't anchor annotation", e); return false; }
  }
  // ── Find in this page ───────────────────────────────────
  // A Ctrl+F style search scoped to the open document: highlights every match,
  // steps through them, and leaves the page exactly as it found it on close.
  let pgFindMatches = [];
  let pgFindIndex = -1;

  function pgFindReset() {
    pgFindMatches = [];
    pgFindIndex = -1;
  }

  // Unwraps our own <mark>s and stitches the split text nodes back together, so
  // the annotation engine still sees the original DOM.
  function pgFindClearMarks() {
    const view = document.getElementById('wgtView');
    if (!view) return;
    view.querySelectorAll('mark.wgt-find').forEach(m => {
      const parent = m.parentNode;
      if (!parent) return;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
    pgFindReset();
  }

  function pgFindRun(query) {
    pgFindClearMarks();
    const view = document.getElementById('wgtView');
    const bar = document.getElementById('wgtFindBar');
    const q = (query || '').trim();
    if (!view || !bar) return;
    const countEl = document.getElementById('wgtFindCount');
    if (!q) {
      if (countEl) countEl.textContent = '';
      bar.classList.remove('wgt-find-none');
      return;
    }

    // Collect text nodes first — wrapping as we walk would invalidate the walker.
    const walker = document.createTreeWalker(view, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.nodeValue && n.nodeValue.trim() && n.parentElement &&
                          !/^(SCRIPT|STYLE)$/.test(n.parentElement.nodeName))
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);

    const needle = q.toLowerCase();
    nodes.forEach(node => {
      const text = node.nodeValue;
      const hay = text.toLowerCase();
      let from = 0, at;
      const cuts = [];
      while ((at = hay.indexOf(needle, from)) !== -1) {
        cuts.push(at);
        from = at + needle.length;
      }
      if (!cuts.length) return;
      // Split back-to-front so earlier offsets stay valid.
      let current = node;
      for (let i = cuts.length - 1; i >= 0; i--) {
        const start = cuts[i];
        const tail = current.splitText(start);
        tail.splitText(needle.length);
        const mark = document.createElement('mark');
        mark.className = 'wgt-find';
        tail.parentNode.replaceChild(mark, tail);
        mark.appendChild(tail);
      }
    });

    // Read them back from the DOM so they come out in document order.
    pgFindMatches = Array.prototype.slice.call(view.querySelectorAll('mark.wgt-find'));
    bar.classList.toggle('wgt-find-none', pgFindMatches.length === 0);
    if (pgFindMatches.length) pgFindGo(0);
    else if (countEl) countEl.textContent = 'No results';
  }

  function pgFindGo(index) {
    if (!pgFindMatches.length) return;
    const wrapped = (index + pgFindMatches.length) % pgFindMatches.length;
    pgFindMatches.forEach(m => m.classList.remove('wgt-find-current'));
    pgFindIndex = wrapped;
    const el = pgFindMatches[wrapped];
    el.classList.add('wgt-find-current');
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const countEl = document.getElementById('wgtFindCount');
    if (countEl) countEl.textContent = (wrapped + 1) + ' of ' + pgFindMatches.length;
  }

  function pgFindOpen(prefill) {
    const bar = document.getElementById('wgtFindBar');
    if (!bar) return;
    bar.classList.add('wgt-open');
    const input = document.getElementById('wgtFindInput');
    if (!input) return;
    if (prefill) input.value = prefill;
    input.focus();
    input.select();
    if (input.value) pgFindRun(input.value);
  }

  function pgFindClose() {
    const bar = document.getElementById('wgtFindBar');
    pgFindClearMarks();
    if (!bar) return;
    bar.classList.remove('wgt-open', 'wgt-find-none');
    const countEl = document.getElementById('wgtFindCount');
    if (countEl) countEl.textContent = '';
  }

  function pgWireFindBar() {
    const bar = document.getElementById('wgtFindBar');
    if (!bar) return;
    const input = document.getElementById('wgtFindInput');
    let timer = null;
    if (input) {
      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => pgFindRun(input.value), 150);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); pgFindGo(pgFindIndex + (e.shiftKey ? -1 : 1)); }
        if (e.key === 'Escape') { e.preventDefault(); pgFindClose(); }
      });
    }
    const prev = document.getElementById('wgtFindPrev');
    const next = document.getElementById('wgtFindNext');
    const close = document.getElementById('wgtFindClose');
    if (prev) prev.addEventListener('click', () => pgFindGo(pgFindIndex - 1));
    if (next) next.addEventListener('click', () => pgFindGo(pgFindIndex + 1));
    if (close) close.addEventListener('click', pgFindClose);
  }

  function pgApplyAnnotations(page) {
    const view = document.getElementById('wgtView');
    if (!view) return;
    const anns = page.annotations || { highlights: [], comments: [] };
    anns.highlights.forEach(h => {
      pgTryWrap(view, h.quote, h.prefix, h.suffix, (frag) => {
        const mark = document.createElement('mark');
        mark.className = 'wgt-hl wgt-hl-' + (h.color || 'yellow');
        mark.dataset.hid = h.id;
        mark.appendChild(frag);
        return mark;
      });
    });
    anns.comments.forEach(c => {
      pgTryWrap(view, c.quote, c.prefix, c.suffix, (frag) => {
        const span = document.createElement('span');
        span.className = 'wgt-commented' + (c.resolved ? ' wgt-resolved-anchor' : '');
        span.dataset.cid = c.id;
        span.appendChild(frag);
        return span;
      });
    });
  }

  // ── Selection toolbar / highlight menu / comment popup ──
  function pgGetSelectionInfo() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    const view = document.getElementById('wgtView');
    if (!view || !view.contains(range.commonAncestorContainer)) return null;
    const quote = sel.toString();
    if (!quote.trim()) return null;
    const { full } = pgBuildTextMap(view);
    const preRange = document.createRange();
    preRange.selectNodeContents(view);
    preRange.setEnd(range.startContainer, range.startOffset);
    const startIdx = preRange.toString().length;
    const endIdx = startIdx + quote.length;
    return {
      quote,
      prefix: full.slice(Math.max(0, startIdx - 40), startIdx),
      suffix: full.slice(endIdx, endIdx + 40),
      rect: range.getBoundingClientRect()
    };
  }
  function pgPositionFloating(elm, rect) {
    elm.style.display = 'flex';
    const top = rect.top - elm.offsetHeight - 8;
    const left = rect.left + rect.width / 2 - elm.offsetWidth / 2;
    elm.style.top = Math.max(8, top) + 'px';
    elm.style.left = Math.max(8, left) + 'px';
  }
  function pgHideSelToolbar() { const el = document.getElementById('wgtSelToolbar'); if (el) el.style.display = 'none'; }
  function pgHideHighlightMenu() { const el = document.getElementById('wgtHlMenu'); if (el) el.style.display = 'none'; }
  function pgHideCommentPopup() { const el = document.getElementById('wgtCommentPopup'); if (el) el.style.display = 'none'; pgPendingComment = null; }

  function pgShowHighlightMenu(hlEl) {
    const menu = document.getElementById('wgtHlMenu');
    if (!menu) return;
    menu.dataset.hid = hlEl.dataset.hid;
    pgPositionFloating(menu, hlEl.getBoundingClientRect());
  }

  function pgAddHighlight(quote, prefix, suffix, color) {
    const p = pgCurrent;
    if (!p || !quote) return;
    p.annotations.highlights.push({ id: pgGenId(), quote, prefix, suffix, color,
                                    createdAt: Date.now(), author: pgUser.email || '' });
    pgSaveAnnotations(p);
    pgRenderPageView();
  }
  function pgChangeHighlightColor(id, color) {
    const p = pgCurrent; if (!p) return;
    const h = p.annotations.highlights.find(x => x.id === id); if (!h) return;
    h.color = color; pgSaveAnnotations(p); pgRenderPageView();
  }
  function pgRemoveHighlight(id) {
    const p = pgCurrent; if (!p) return;
    p.annotations.highlights = p.annotations.highlights.filter(x => x.id !== id);
    pgSaveAnnotations(p); pgRenderPageView();
  }
  function pgAddComment(quote, prefix, suffix, text) {
    const p = pgCurrent;
    if (!p || !quote) return;
    p.annotations.comments.push({ id: pgGenId(), quote, prefix, suffix, text, resolved: false,
                                  createdAt: Date.now(), author: pgUser.email || '' });
    pgSaveAnnotations(p);
    pgRenderPageView();
    pgShowCommentsPanel();
  }
  function pgSetCommentResolved(id, resolved) {
    const p = pgCurrent; if (!p) return;
    const c = p.annotations.comments.find(x => x.id === id); if (!c) return;
    c.resolved = resolved; pgSaveAnnotations(p); pgRenderPageView(); pgRenderCommentsPanel();
  }
  function pgDeleteComment(id) {
    const p = pgCurrent; if (!p) return;
    pgDialog('Delete comment', [], () => {
      p.annotations.comments = p.annotations.comments.filter(x => x.id !== id);
      pgSaveAnnotations(p); pgRenderPageView(); pgRenderCommentsPanel();
    }, { confirm: 'Delete', danger: true, intro: 'Delete this comment? This cannot be undone.' });
  }

  // ── Comments panel ───────────────────────────────────────
  function pgShowCommentsPanel() {
    if (!pgCurrent) return;
    const panel = document.getElementById('wgtCommentsPanel');
    if (!panel) return;
    panel.classList.add('wgt-open');
    document.body.classList.add('wk-cp-open');
    pgRenderCommentsPanel();
    // Comments on a Doc change outside the wiki — check again when the
    // panel is opened, unless we only just did.
    if (pgIsDocPage(pgCurrent)) pgLoadDocComments(pgCurrent, 10000);
  }
  function pgHideCommentsPanel() {
    const panel = document.getElementById('wgtCommentsPanel');
    if (panel) panel.classList.remove('wgt-open');
    document.body.classList.remove('wk-cp-open');
  }
  function pgUpdateCommentBadge() {
    const badge = document.getElementById('wgtCmtBadge');
    if (!badge) return;
    let count = 0;
    if (pgIsDocPage(pgCurrent)) {
      const cached = pgDocComments[pgCurrent.id];
      count = cached && cached.list ? cached.list.filter(c => !c.resolved).length : 0;
    } else if (pgCurrent && pgCurrent.annotations) {
      count = pgCurrent.annotations.comments.filter(c => !c.resolved).length;
    }
    if (count > 0) { badge.style.display = 'inline-block'; badge.textContent = count; }
    else badge.style.display = 'none';
  }
  function pgCommentItemHtml(c) {
    return `<div class="wgt-cp-item${c.resolved ? ' wgt-resolved' : ''}" data-id="${c.id}" id="wgt-cp-item-${c.id}">
      <div class="wgt-cp-quote">${esc(pgTruncate(c.quote, 80))}</div>
      <div class="wgt-cp-text">${esc(c.text)}</div>
      <div class="wgt-cp-meta">${c.author ? `<span class="wgt-cp-author">${esc(c.author.split('@')[0])}</span> · ` : ''}${pgFmtTime(c.createdAt)}</div>
      <div class="wgt-cp-actions">
        ${c.resolved ? `<button class="wgt-cp-reopen" data-id="${c.id}">Reopen</button>` : `<button class="wgt-cp-resolve" data-id="${c.id}">Resolve</button>`}
        <button class="wgt-cp-delete" data-id="${c.id}">Delete</button>
      </div>
    </div>`;
  }
  function pgRenderCommentsPanel() {
    const body = document.getElementById('wgtCpBody');
    if (!body) return;
    const p = pgCurrent;
    if (!p) { body.innerHTML = '<div class="wgt-cp-empty">Open a page to see its comments.</div>'; return; }
    if (pgIsDocPage(p)) return pgRenderDocComments(p, body);
    if (!p.annotations) { body.innerHTML = '<div class="wgt-cp-empty">Loading comments…</div>'; return; }
    const all = p.annotations.comments.slice().sort((a, b) => b.createdAt - a.createdAt);
    const active = all.filter(c => !c.resolved);
    const resolved = all.filter(c => c.resolved);
    if (!all.length) { body.innerHTML = '<div class="wgt-cp-empty">No comments yet. Select any text in the page to add one.</div>'; return; }

    let html = '<div class="wgt-cp-list">';
    active.forEach(c => { html += pgCommentItemHtml(c); });
    if (!active.length) html += '<div class="wgt-cp-empty">No open comments.</div>';
    html += '</div>';
    if (resolved.length) {
      html += `<div class="wgt-cp-toggle-resolved" id="wgtCpToggleResolved">${pgShowResolved ? 'Hide' : 'Show'} resolved (${resolved.length})</div>`;
      if (pgShowResolved) {
        html += '<div class="wgt-cp-list">';
        resolved.forEach(c => { html += pgCommentItemHtml(c); });
        html += '</div>';
      }
    }
    body.innerHTML = html;
    body.querySelectorAll('.wgt-cp-resolve').forEach(b => b.addEventListener('click', () => pgSetCommentResolved(b.dataset.id, true)));
    body.querySelectorAll('.wgt-cp-reopen').forEach(b => b.addEventListener('click', () => pgSetCommentResolved(b.dataset.id, false)));
    body.querySelectorAll('.wgt-cp-delete').forEach(b => b.addEventListener('click', () => pgDeleteComment(b.dataset.id)));
    body.querySelectorAll('.wgt-cp-item').forEach(item => item.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      pgFlashAnchor(item.dataset.id);
    }));
    const toggleBtn = document.getElementById('wgtCpToggleResolved');
    if (toggleBtn) toggleBtn.addEventListener('click', () => { pgShowResolved = !pgShowResolved; pgRenderCommentsPanel(); });
  }
  // The Comments button sits with the page's own buttons, beside Edit, so it
  // is re-created with every page view and bound here each time.
  function pgCommentsBtnHtml() {
    return `<button type="button" class="wk-pa" id="wgtCommentsToggleBtn" title="Comments" aria-label="Comments">${PG_ICONS.comment}<span class="wk-pa-badge" id="wgtCmtBadge" style="display:none">0</span></button>`;
  }
  function pgBindCommentsBtn() {
    const btn = document.getElementById('wgtCommentsToggleBtn');
    if (btn) btn.addEventListener('click', () => {
      const panel = document.getElementById('wgtCommentsPanel');
      if (panel && panel.classList.contains('wgt-open')) pgHideCommentsPanel(); else pgShowCommentsPanel();
    });
  }

  // ── Google Doc comments (read from Drive, shown in the panel) ──
  const pgDocComments = {};   // page id -> { at, list, error, loading }

  // Fetches a Doc's comments unless the cached copy is younger than maxAgeMs.
  function pgLoadDocComments(p, maxAgeMs) {
    const cached = pgDocComments[p.id];
    if (cached && cached.loading) return cached.loading;
    if (cached && !cached.error && maxAgeMs !== undefined && Date.now() - cached.at < maxAgeMs) return Promise.resolve();
    const entry = pgDocComments[p.id] = Object.assign({}, cached || {}, { error: null });
    const done = () => {
      entry.loading = null;
      if (pgCurrent !== p) return;
      pgUpdateCommentBadge();
      const panel = document.getElementById('wgtCommentsPanel');
      if (panel && panel.classList.contains('wgt-open')) pgRenderCommentsPanel();
    };
    entry.loading = pgCall('getDocComments', p.id).then(res => {
      entry.list = res.comments || [];
      entry.at = Date.now();
      done();
    }, err => {
      console.error(err);
      entry.error = pgErrMsg(err);
      entry.at = Date.now();
      done();
    });
    if (pgCurrent === p) {
      const panel = document.getElementById('wgtCommentsPanel');
      if (panel && panel.classList.contains('wgt-open')) pgRenderCommentsPanel();
    }
    return entry.loading;
  }

  function pgDocCommentLink(p, c) {
    return p.docUrl + (p.docUrl.indexOf('?') === -1 ? '?' : '&') + 'disco=' + encodeURIComponent(c.id);
  }

  function pgDocCommentHtml(p, c) {
    const replies = (c.replies || []).filter(r => r.text);
    return `<div class="wgt-cp-item${c.resolved ? ' wgt-resolved' : ''}">
      ${c.quote ? `<div class="wgt-cp-quote">${esc(pgTruncate(c.quote, 120))}</div>` : ''}
      <div class="wgt-cp-text">${esc(c.text)}</div>
      <div class="wgt-cp-meta"><span class="wgt-cp-author">${esc(c.author)}</span> · ${pgFmtTime(c.created)}</div>
      ${replies.length ? `<div class="wgt-cp-replies">${replies.map(r => `
        <div class="wgt-cp-reply${r.action ? ' wgt-cp-reply-action' : ''}">
          <div class="wgt-cp-text">${esc(r.text)}</div>
          <div class="wgt-cp-meta"><span class="wgt-cp-author">${esc(r.author)}</span> · ${pgFmtTime(r.created)}</div>
        </div>`).join('')}</div>` : ''}
      <div class="wgt-cp-actions">
        <a class="wgt-cp-open" href="${esc(pgDocCommentLink(p, c))}" target="_blank" rel="noopener"
           title="Open the file at this comment to reply or resolve">↗ Open in Google</a>
      </div>
    </div>`;
  }

  function pgRenderDocComments(p, body) {
    const cached = pgDocComments[p.id];
    if (!cached || (!cached.list && !cached.error)) {
      body.innerHTML = '<div class="wgt-cp-empty">Loading comments…</div>';
      if (!cached) pgLoadDocComments(p);
      return;
    }
    const refreshing = !!cached.loading;
    let html = `<div class="wgt-cp-docbar">
        <span>${cached.list ? cached.list.filter(c => !c.resolved).length + ' open' : ''}${refreshing ? ' · refreshing…' : ''}</span>
        <button type="button" id="wgtCpRefresh" title="Check Google for new comments">↻ Refresh</button>
      </div>`;
    if (cached.error) {
      html += `<div class="wgt-cp-empty wgt-upload-fail">${esc(cached.error)}</div>`;
    } else {
      const all = cached.list;
      const active = all.filter(c => !c.resolved);
      const resolved = all.filter(c => c.resolved);
      if (!all.length) {
        html += `<div class="wgt-cp-empty">No comments on this ${esc(pgNoun(p))} yet. To add one, click
          <strong>✎ Edit</strong> and use Google's comment button.</div>`;
      } else {
        html += '<div class="wgt-cp-list">';
        active.forEach(c => { html += pgDocCommentHtml(p, c); });
        if (!active.length) html += '<div class="wgt-cp-empty">No open comments.</div>';
        html += '</div>';
        if (resolved.length) {
          html += `<div class="wgt-cp-toggle-resolved" id="wgtCpToggleResolved">${pgShowResolved ? 'Hide' : 'Show'} resolved (${resolved.length})</div>`;
          if (pgShowResolved) {
            html += '<div class="wgt-cp-list">';
            resolved.forEach(c => { html += pgDocCommentHtml(p, c); });
            html += '</div>';
          }
        }
        html += `<div class="wgt-cp-empty wgt-cp-foot">Reply to or resolve comments in <strong>✎ Edit</strong>
          mode, or with “Open in Google”.</div>`;
      }
    }
    body.innerHTML = html;
    const refresh = document.getElementById('wgtCpRefresh');
    if (refresh) refresh.addEventListener('click', () => pgLoadDocComments(p, 0));
    const toggleBtn = document.getElementById('wgtCpToggleResolved');
    if (toggleBtn) toggleBtn.addEventListener('click', () => { pgShowResolved = !pgShowResolved; pgRenderCommentsPanel(); });
  }

  function pgFocusComment(cid) {
    pgShowCommentsPanel();
    pgFlashAnchor(cid);
    const item = document.getElementById('wgt-cp-item-' + cid);
    if (item) {
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      item.classList.add('wgt-flash');
      setTimeout(() => item.classList.remove('wgt-flash'), 1000);
    }
  }
  function pgFlashAnchor(cid) {
    const anchor = document.querySelector(`#wgtView .wgt-commented[data-cid="${cid.replace(/[\x22\\]/g, '\\$&')}"]`);
    if (anchor) {
      anchor.scrollIntoView({ behavior: 'smooth', block: 'center' });
      anchor.classList.add('wgt-flash');
      setTimeout(() => anchor.classList.remove('wgt-flash'), 1000);
    }
  }

  // ── One-time global listeners (selection + click-away) ──
  function pgBindGlobalListenersOnce() {
    if (pgGlobalBound) return;
    pgGlobalBound = true;

    // Ctrl/Cmd+F searches the open page instead of the whole browser tab —
    // but only while the wiki is on screen and not being edited, so the
    // browser's own find still works everywhere else.
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k' && !(pgEditing && !pgDocInline)) {
        const box = document.getElementById('wgtSearch');
        if (box && !box.disabled) { e.preventDefault(); box.focus(); box.select(); return; }
      }
      const shell = document.getElementById('wgtShell');
      if (!shell || pgEditing || !pgCurrent || pgIsDocPage(pgCurrent)) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        const sel = window.getSelection();
        const seed = sel && !sel.isCollapsed ? sel.toString().trim().slice(0, 80) : '';
        pgFindOpen(seed);
      }
      if (e.key === 'Escape') {
        const bar = document.getElementById('wgtFindBar');
        if (bar && bar.classList.contains('wgt-open')) pgFindClose();
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (pgEditing || !pgCurrent || pgIsDocPage(pgCurrent) || !pgCan('edit')) return;
      if (e.target.closest('#wgtSelToolbar, #wgtCommentPopup, #wgtHlMenu')) return;
      pgHideHighlightMenu();
      const info = pgGetSelectionInfo();
      const toolbar = document.getElementById('wgtSelToolbar');
      if (!info || !toolbar) { pgHideSelToolbar(); return; }
      toolbar.dataset.quote = info.quote;
      toolbar.dataset.prefix = info.prefix;
      toolbar.dataset.suffix = info.suffix;
      pgPositionFloating(toolbar, info.rect);
    });

    document.addEventListener('mousedown', (e) => {
      if (!e.target.closest('#wgtSelToolbar')) pgHideSelToolbar();
      if (!e.target.closest('#wgtHlMenu, #wgtView mark.wgt-hl')) pgHideHighlightMenu();
      if (!e.target.closest('#wgtCommentPopup, #wgtSelCommentBtn')) pgHideCommentPopup();
    });
  }

  // ── Shell wiring (rebound on every render) ──────────────
  function pgWireShell() {
    const newPageBtn = document.getElementById('wgtNewPageBtn');
    const uploadBtn = document.getElementById('wgtUploadBtn');
    const fileInput = document.getElementById('wgtFileInput');
    const cpCloseBtn = document.getElementById('wgtCpCloseBtn');
    const searchInput = document.getElementById('wgtSearch');
    const contentEl = document.getElementById('wgtContent');
    const selToolbar = document.getElementById('wgtSelToolbar');
    const hlMenu = document.getElementById('wgtHlMenu');
    const commentPopup = document.getElementById('wgtCommentPopup');

    const newFolderBtn = document.getElementById('wgtNewFolderBtn');
    if (newFolderBtn) newFolderBtn.addEventListener('click', () => pgCreateFolder());
    if (newPageBtn) newPageBtn.addEventListener('click', () => pgCreateNewPage());
    const settingsBtn = document.getElementById('wkSettingsBtn');
    if (settingsBtn) settingsBtn.addEventListener('click', () => {
      const box = document.getElementById('wgtSearch');
      if (box && box.value) { box.value = ''; pgRunSearch(''); }
      pgShowSettings();
    });
    const linkDocBtn = document.getElementById('wgtLinkDocBtn');
    if (linkDocBtn) linkDocBtn.addEventListener('click', () => pgLinkDoc());
    if (uploadBtn) uploadBtn.addEventListener('click', () => fileInput && fileInput.click());
    if (fileInput) fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      pgHandleUpload(files);
    });
    // The Comments button lives in each page's header — see pgCommentsBtnHtml.
    if (cpCloseBtn) cpCloseBtn.addEventListener('click', pgHideCommentsPanel);
    if (searchInput) searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && searchInput.value) {
        e.preventDefault();
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input'));
      }
    });
    if (searchInput) searchInput.addEventListener('input', () => {
      pgRunSearch(searchInput.value);       // server text search, merged in when it lands
      pgRenderSidebar(searchInput.value);
      pgRenderSearchResults(searchInput.value);
    });

    if (contentEl) contentEl.addEventListener('click', (e) => {
      const link = e.target.closest('[data-wikilink]');
      if (link) {
        e.preventDefault();
        const target = decodeURIComponent(link.dataset.wikilink);
        const existing = pgPages.find(p => p.title.toLowerCase() === target.toLowerCase());
        if (existing) pgOpenPage(existing);
        else if (pgCan('add')) {
          pgDialog('Create page', [], () => pgDoCreateNewPage(target), {
            confirm: 'Create page',
            intro: '<strong>' + esc(target) + '</strong> doesn\'t exist yet. Create it in <strong>' +
                   esc(pgFolderLabel(pgFolder)) + '</strong>?'
          });
        } else pgToast('That page doesn\'t exist yet');
        return;
      }
      const hl = e.target.closest('#wgtView mark.wgt-hl');
      if (hl) { e.stopPropagation(); pgShowHighlightMenu(hl); return; }
      const cm = e.target.closest('#wgtView .wgt-commented');
      if (cm) { e.stopPropagation(); pgFocusComment(cm.dataset.cid); return; }
    });

    if (selToolbar) {
      selToolbar.querySelectorAll('.wgt-swatch').forEach(sw => {
        sw.addEventListener('click', () => {
          const color = sw.dataset.color;
          const quote = selToolbar.dataset.quote, prefix = selToolbar.dataset.prefix, suffix = selToolbar.dataset.suffix;
          pgHideSelToolbar();
          window.getSelection().removeAllRanges();
          pgAddHighlight(quote, prefix, suffix, color);
        });
      });
      const cmtBtn = document.getElementById('wgtSelCommentBtn');
      if (cmtBtn) cmtBtn.addEventListener('click', () => {
        pgPendingComment = { quote: selToolbar.dataset.quote, prefix: selToolbar.dataset.prefix, suffix: selToolbar.dataset.suffix };
        const rect = selToolbar.getBoundingClientRect();
        pgHideSelToolbar();
        if (!commentPopup) return;
        const preview = document.getElementById('wgtCmtQuotePreview');
        const input = document.getElementById('wgtCmtInput');
        if (preview) preview.textContent = '"' + pgTruncate(pgPendingComment.quote, 100) + '"';
        if (input) input.value = '';
        commentPopup.style.display = 'block';
        commentPopup.style.top = Math.max(8, rect.top) + 'px';
        commentPopup.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 270)) + 'px';
        if (input) input.focus();
      });
    }

    if (commentPopup) {
      const cancelBtn = document.getElementById('wgtCmtCancelBtn');
      const submitBtn = document.getElementById('wgtCmtSubmitBtn');
      if (cancelBtn) cancelBtn.addEventListener('click', pgHideCommentPopup);
      if (submitBtn) submitBtn.addEventListener('click', () => {
        const input = document.getElementById('wgtCmtInput');
        const text = input ? input.value.trim() : '';
        if (!text || !pgPendingComment) return;
        pgAddComment(pgPendingComment.quote, pgPendingComment.prefix, pgPendingComment.suffix, text);
        pgHideCommentPopup();
      });
    }

    if (hlMenu) {
      hlMenu.querySelectorAll('.wgt-swatch').forEach(sw => {
        sw.addEventListener('click', () => { pgChangeHighlightColor(hlMenu.dataset.hid, sw.dataset.color); pgHideHighlightMenu(); });
      });
      const trashBtn = document.getElementById('wgtHlDeleteBtn');
      if (trashBtn) trashBtn.addEventListener('click', () => { pgRemoveHighlight(hlMenu.dataset.hid); pgHideHighlightMenu(); });
    }
  }

  // ── Header tools: search and page actions ───────────────
  // They live in the app's top bar (#wkTools in Index.html) rather than in a
  // toolbar row inside the wiki, which gives the pages that row back.
  const pgIcon = d => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const PG_ICONS = {
    search: pgIcon('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    plus: pgIcon('<path d="M12 5v14M5 12h14"/>'),
    folder: pgIcon('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/>'),
    link: pgIcon('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
    upload: pgIcon('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'),
    eye: pgIcon('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
    pen: pgIcon('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/>'),
    comment: pgIcon('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
    external: pgIcon('<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>'),
    trash: pgIcon('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
    unlink: pgIcon('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/><path d="M4 4l16 16"/>'),
    check: pgIcon('<path d="m5 12 5 5L20 7"/>'),
    doc: pgIcon('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'),
    sheet: pgIcon('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/>'),
    slide: pgIcon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/>'),
    gear: pgIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    lock: pgIcon('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
    maximize: pgIcon('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'),
    restore: pgIcon('<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>'),
    fullscreen: pgIcon('<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>'),
    exitFullscreen: pgIcon('<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>'),
    page: pgIcon('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>')
  };

  // ── Page header: title on the left, quiet icon actions + one primary ──
  // Icon buttons carry their name in title/aria-label; only the primary action
  // (Edit / Done) is spelled out.
  function pgIconBtn(id, icon, label, extra) {
    return `<button type="button" class="wk-pa${extra ? ' ' + extra : ''}" id="${id}" title="${esc(label)}" aria-label="${esc(label)}">${PG_ICONS[icon]}</button>`;
  }
  function pgPrimaryBtn(id, icon, label, title) {
    return `<button type="button" class="wk-pa-primary" id="${id}" title="${esc(title || label)}">${PG_ICONS[icon]}<span>${esc(label)}</span></button>`;
  }
  // What kind of page this is, for icons and labels everywhere: which Google
  // app it opens in (or an Office file), or the wiki's own .html/.md page.
  function pgKindOf(p) {
    if (p.kind === 'html') return { cls: 'page', icon: 'page', label: 'Wiki page' };
    const base = p.office ? pgNoun(p) : pgAppInfo(p).name;
    return { cls: p.app || 'doc', icon: pgAppInfo(p).icon, label: p.kind === 'link' ? 'Linked ' + base : base };
  }
  // Small icon: sidebar and search results.
  function pgSideIcon(p) {
    const k = pgKindOf(p);
    return `<span class="wk-side-app wk-kind-${k.cls}" title="${esc(k.label)}">${PG_ICONS[k.icon]}</span>`;
  }
  // Tinted badge: page titles and the contents list.
  function pgKindBadge(p) {
    const k = pgKindOf(p);
    return `<span class="wk-kind wk-kind-${k.cls}" title="${esc(k.label)}">${PG_ICONS[k.icon]}</span>`;
  }

  function pgPageTitleHtml(p) {
    const crumb = p.folder
      ? `<span class="wk-crumb">${esc(p.folder.split('/').join(' / '))}</span><span class="wk-crumb-sep">/</span>` : '';
    return `<div class="wk-title">
        ${pgKindBadge(p)}
        <div class="wk-title-text">${crumb}<h2>${esc(p.title)}</h2></div>
      </div>`;
  }

  function pgToolsHtml() {
    const mac = /Mac|iPhone|iPad/.test(navigator.platform || '');
    return `
      <label class="wk-search" for="wgtSearch">
        ${PG_ICONS.search}
        <input id="wgtSearch" type="search" placeholder="Search pages, Docs, Sheets and Slides…" autocomplete="off" spellcheck="false" disabled />
        <kbd class="wk-kbd" aria-hidden="true">${mac ? '⌘' : 'Ctrl'} K</kbd>
      </label>
      <div class="wk-actions">
        <span class="wk-readonly" id="wgtReadonlyNote" style="display:none" title="Ask the wiki's owner for edit access">${PG_ICONS.eye}<span class="wk-label">Read-only</span></span>
        <div class="wk-seg" id="wkEditTools">
          <button class="wk-act" id="wgtNewFolderBtn" disabled title="New folder">${PG_ICONS.folder}<span class="wk-label">Folder</span></button>
          <button class="wk-act" id="wgtLinkDocBtn" disabled title="Add an existing Google Doc, Sheet or Slides — or a Word, Excel or PowerPoint file in Drive">${PG_ICONS.link}<span class="wk-label">Link</span></button>
          <button class="wk-act" id="wgtUploadBtn" disabled title="Upload Word, PDF or text (→ Doc), Excel or CSV (→ Sheet), PowerPoint (→ Slides)">${PG_ICONS.upload}<span class="wk-label">Upload</span></button>
        </div>
        <button class="wk-act wk-act-primary" id="wgtNewPageBtn" disabled title="Create a Google Doc page">${PG_ICONS.plus}<span class="wk-label">New page</span></button>
        ${pgUser.isAdmin ? `<button class="wk-act wk-settings-btn" id="wkSettingsBtn" title="Settings — people and permissions" aria-label="Settings">${PG_ICONS.gear}</button>` : ''}
        <input type="file" id="wgtFileInput" multiple accept=".docx,.doc,.odt,.rtf,.pdf,.txt,.md,.markdown,.html,.htm,.xlsx,.xls,.ods,.csv,.tsv,.pptx,.ppt,.odp" style="display:none" />
      </div>`;
  }

  const PG_APP = {
    async render(container) {
      container.innerHTML = `
        <div class="wgt-shell" id="wgtShell">
          <div class="wgt-main">
            <div class="wgt-sidebar" id="wgtSidebar"><div class="wgt-empty-hint">Loading pages…</div></div>
            <div class="wgt-content" id="wgtContent">
              <div class="wgt-welcome" id="wgtWelcome">
                <h3>OIS Team Wiki</h3>
                <p id="wgtWelcomeMsg">Loading pages…</p>
              </div>
            </div>
            <div class="wgt-comments-panel" id="wgtCommentsPanel">
              <div class="wgt-cp-header"><span>Comments</span><button id="wgtCpCloseBtn">✕</button></div>
              <div id="wgtCpBody"></div>
            </div>
          </div>
          <div id="wgtFindBar" class="wgt-find-bar">
            <input id="wgtFindInput" type="text" placeholder="Find in this page…" />
            <span class="wgt-find-count" id="wgtFindCount"></span>
            <button class="wgt-find-btn" id="wgtFindPrev" title="Previous match (Shift+Enter)">↑</button>
            <button class="wgt-find-btn" id="wgtFindNext" title="Next match (Enter)">↓</button>
            <button class="wgt-find-btn" id="wgtFindClose" title="Close (Esc)">✕</button>
          </div>
        </div>
        <div id="wgtTableTools" class="wgt-table-tools">
          <span class="wgt-tt-label">Table</span>
          <button class="wgt-tt-btn" data-tt="row-above" title="Insert row above">↥ Row</button>
          <button class="wgt-tt-btn" data-tt="row-below" title="Insert row below">↧ Row</button>
          <button class="wgt-tt-btn" data-tt="col-left" title="Insert column left">↤ Col</button>
          <button class="wgt-tt-btn" data-tt="col-right" title="Insert column right">↦ Col</button>
          <span class="wgt-tt-sep"></span>
          <button class="wgt-tt-btn" data-tt="header" title="Toggle header row">Header</button>
          <span class="wgt-tt-sep"></span>
          <button class="wgt-tt-btn wgt-tt-danger" data-tt="del-row" title="Delete this row">✕ Row</button>
          <button class="wgt-tt-btn wgt-tt-danger" data-tt="del-col" title="Delete this column">✕ Col</button>
          <button class="wgt-tt-btn wgt-tt-danger" data-tt="del-table" title="Delete the whole table">🗑</button>
        </div>
        <div id="wgtSelToolbar" class="wgt-sel-toolbar">
          <div class="wgt-swatch yellow" data-color="yellow" title="Highlight yellow"></div>
          <div class="wgt-swatch green" data-color="green" title="Highlight green"></div>
          <div class="wgt-swatch blue" data-color="blue" title="Highlight blue"></div>
          <div class="wgt-swatch pink" data-color="pink" title="Highlight pink"></div>
          <div class="wgt-sep"></div>
          <button class="wgt-cmt-btn" id="wgtSelCommentBtn">💬 Comment</button>
        </div>
        <div id="wgtHlMenu" class="wgt-hl-menu">
          <div class="wgt-swatch yellow" data-color="yellow"></div>
          <div class="wgt-swatch green" data-color="green"></div>
          <div class="wgt-swatch blue" data-color="blue"></div>
          <div class="wgt-swatch pink" data-color="pink"></div>
          <button class="wgt-trash" id="wgtHlDeleteBtn" title="Remove highlight">🗑</button>
        </div>
        <div id="wgtCommentPopup" class="wgt-comment-popup">
          <div class="wgt-quote-preview" id="wgtCmtQuotePreview"></div>
          <textarea id="wgtCmtInput" placeholder="Add a comment…"></textarea>
          <div class="wgt-row">
            <button class="wgt-btn" id="wgtCmtCancelBtn">Cancel</button>
            <button class="wgt-btn wgt-primary" id="wgtCmtSubmitBtn">Comment</button>
          </div>
        </div>
        <div class="wgt-toast" id="wgtToast"></div>
      `;

      const home = document.getElementById('wkHome');
      if (home && !home.dataset.bound) {
        home.dataset.bound = '1';
        home.addEventListener('click', (e) => {
          e.preventDefault();
          const box = document.getElementById('wgtSearch');
          if (box && box.value) { box.value = ''; pgRunSearch(''); }
          pgShowHome();
        });
      }
      const tools = document.getElementById('wkTools');
      if (tools) tools.innerHTML = pgToolsHtml();
      else container.insertAdjacentHTML('afterbegin', '<div class="wk-tools wk-tools-inline">' + pgToolsHtml() + '</div>');
      pgEditing = false;
      pgWireShell();
      pgWireFindBar();
      pgBindGlobalListenersOnce();
      await pgLoadViewLibs();

      if (BOOT.denied) {
        const tools = document.getElementById('wkTools');
        if (tools) tools.innerHTML = '';
        pgShowDenied(container);
        return;
      }
      if (BOOT.error) { pgShowLoadError(BOOT.error); return; }
      await pgLoadPages();
    }
  };

  // Other people edit the same wiki, so pick up their new pages and folders
  // when the reader comes back to the tab — at most once a minute.
  let pgLastRefresh = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !pgLoaded || pgEditing) return;
    // Back from editing a Doc: show the new version straight away, and pick up
    // a changed title with it.
    if (pgRefreshEditedDoc()) {
      pgLastRefresh = Date.now();
      pgLoadPages({ fresh: true, quiet: true });
      return;
    }
    if (Date.now() - pgLastRefresh < 60000) return;
    pgLastRefresh = Date.now();
    pgLoadPages({ fresh: true, quiet: true });
  });

  PG_APP.render(document.getElementById('wkMain'));
})();
</script>
